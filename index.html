          const o = op.kagitlar[i];
          const ayni = o.kitapcik === kagit.kitapcik && o.kitapcikBos === kagit.kitapcikBos && o.cevaplar.join() === kagit.cevaplar.join();
          if (ayni) continue; // aynı dosya ikinci kez (zamanı da değişmez)
          op.kagitlar[i] = kagit;
          rapor.guncel++; rapor.guncelNo.push(no);
        } else { op.kagitlar.push(kagit); rapor.yeni++; }
        if (!op.kitapcikB && k.kitapcik === 'B' && !k.kitapcikBos) rapor.uyari.push(`${op.ad}: ${no} numaralı kâğıtta B kitapçığı işaretli, sınav tek kitapçıklı; A anahtarıyla puanlandı.`);
        if (op.kitapcikB && k.kitapcikBos) rapor.uyari.push(`${op.ad}: ${no} numaralı kâğıtta kitapçık işaretlenmemiş; A sayıldı.`);
        degisen.add(op);
      }
    }
    for (const op of degisen) op.degisti = simdi;
    return { degisen: [...degisen], rapor };
  }

  /* ---------- kazanım Excel'i (TestPlus şablonu: No · Kazanım · Kazanım Grup) ---------- */
  // .xlsx (zip) dosyasının ilk sayfasını satır dizisi olarak verir; kütüphanesiz (DecompressionStream)
  async function xlsxSatirlar(tampon) {
    const b = new Uint8Array(tampon), v = new DataView(b.buffer, b.byteOffset, b.byteLength);
    let son = -1;
    for (let i = b.length - 22; i >= Math.max(0, b.length - 65557); i--) if (v.getUint32(i, true) === 0x06054b50) { son = i; break; }
    if (son < 0) throw new Error('Dosya Excel (.xlsx) değil.');
    const adet = v.getUint16(son + 10, true);
    let p = v.getUint32(son + 16, true);
    const girdiler = new Map();
    for (let i = 0; i < adet && p + 46 <= b.length && v.getUint32(p, true) === 0x02014b50; i++) {
      const yontem = v.getUint16(p + 10, true), boy = v.getUint32(p + 20, true);
      const adBoy = v.getUint16(p + 28, true), ekBoy = v.getUint16(p + 30, true), notBoy = v.getUint16(p + 32, true);
      const yerel = v.getUint32(p + 42, true);
      girdiler.set(new TextDecoder().decode(b.subarray(p + 46, p + 46 + adBoy)), { yontem, boy, yerel });
      p += 46 + adBoy + ekBoy + notBoy;
    }
    const oku = async (ad) => {
      const g = girdiler.get(ad);
      if (!g) return null;
      const bas = g.yerel + 30 + v.getUint16(g.yerel + 26, true) + v.getUint16(g.yerel + 28, true);
      const veri = b.subarray(bas, bas + g.boy);
      if (g.yontem === 0) return new TextDecoder().decode(veri);
      if (g.yontem !== 8) throw new Error('Excel dosyası desteklenmeyen biçimde sıkıştırılmış.');
      const ds = new DecompressionStream('deflate-raw');
      const w = ds.writable.getWriter(); w.write(veri); w.close();
      return new Response(ds.readable).text();
    };
    const ozel = { amp: '&', lt: '<', gt: '>', quot: '"', apos: "'" };
    const varlik = (s) => s.replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos);/gi, (_, e) => e[0] === '#' ? String.fromCodePoint(e[1].toLowerCase() === 'x' ? parseInt(e.slice(2), 16) : Number(e.slice(1))) : ozel[e.toLowerCase()]);
    const metin = (xml) => [...xml.replace(/<rPh\b[\s\S]*?<\/rPh>/g, '').matchAll(/<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g)]
      .map(m => varlik(m[1]).replace(/_x([0-9A-Fa-f]{4})_/g, (_, x) => String.fromCharCode(parseInt(x, 16)))).join('');
    const paylasilan = [...((await oku('xl/sharedStrings.xml')) || '').matchAll(/<si\b[^>]*?(?:\/>|>([\s\S]*?)<\/si>)/g)].map(m => metin(m[1] || ''));
    // ilk sayfa: workbook.xml'deki ilk <sheet> ve onun ilişki hedefi
    let yol = 'xl/worksheets/sheet1.xml';
    const kitap = await oku('xl/workbook.xml'), iliski = await oku('xl/_rels/workbook.xml.rels');
    const rid = kitap && (kitap.match(/<sheet\b[^>]*\br:id="([^"]+)"/) || [])[1];
    const iliskiEtiketi = rid && iliski && [...iliski.matchAll(/<Relationship\b[^>]*>/g)].map(m => m[0]).find(e => e.includes(`Id="${rid}"`));
    const hedef = iliskiEtiketi && (iliskiEtiketi.match(/Target="([^"]+)"/) || [])[1];
    if (hedef) yol = hedef.startsWith('/') ? hedef.slice(1) : 'xl/' + hedef.replace(/^\.\//, '');
    const sayfa = await oku(yol);
    if (!sayfa) throw new Error('Excel dosyasında sayfa bulunamadı.');
    const satirlar = [];
    for (const m of sayfa.matchAll(/<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g)) {
      const r = Number((m[1].match(/\br="(\d+)"/) || [])[1]) || satirlar.length + 1;
      const satir = [];
      for (const c of (m[2] || '').matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)) {
        const ref = (c[1].match(/\br="([A-Z]+)\d+"/) || [])[1];
        const tur = (c[1].match(/\bt="([^"]+)"/) || [])[1];
        const ic = c[2] || '';
        const deger = (ic.match(/<v>([\s\S]*?)<\/v>/) || [])[1];
        let s = '';
        if (tur === 's') s = paylasilan[Number(deger)] || '';
        else if (tur === 'inlineStr') s = metin(ic);
        else if (deger != null) s = varlik(deger);
        const sutun = ref ? [...ref].reduce((a, ch) => a * 26 + ch.charCodeAt(0) - 64, 0) - 1 : satir.length;
        satir[sutun] = s;
      }
      satirlar[r - 1] = Array.from(satir, x => x == null ? '' : x);
    }
    return Array.from(satirlar, x => x || []);
  }

  const bosluk = (s) => String(s || '').replace(/\s+/g, ' ').trim();
  const kazanimSade = (ad) => bosluk(String(ad || '').replace(/^\[[^\]]*\]\s*/, ''));
  // Python str.casefold() ile toLowerCase'in ayrıştığı harfler (fizik metninde µ görülebilir)
  const katla = (s) => s.toLowerCase().replace(/[µßςſ]/g, c => ({ 'µ': 'μ', 'ß': 'ss', 'ς': 'σ', 'ſ': 's' })[c]);
  // TestPlus dönüştürücüsüyle aynı kimlik: 'k' + sha1(boşlukları sadeleşmiş, casefold edilmiş ad)[:10]; ad öneksiz verilir
  async function kazanimKimligi(ad) {
    const ozet = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(katla(bosluk(ad))));
    return 'k' + [...new Uint8Array(ozet)].map(x => x.toString(16).padStart(2, '0')).join('').slice(0, 10);
  }

  /* Satırları bölümlere ayırır. "[Ders 7] …" önekli satır o dersin 7. sorusudur; öneksiz satırda soru No sütunundan,
   * bölüm adı dosya adından ("Kazanımlar - Fen Bilimleri - …" → Fen Bilimleri) gelir.
   * Dönüş: { bolumler:[{ ad, girdiler:[{ no, ad }] }], hata? } */
  function kazanimBolumleri(satirlar, dosyaAdi = '') {
    const kucuk = (s) => String(s == null ? '' : s).trim().toLocaleLowerCase('tr');
    const kazanimMi = (c) => /^kazan[ıi]m(lar)?(\s+ad[ıi])?$/.test(kucuk(c));
    const bas = satirlar.findIndex(r => r.some(kazanimMi));
    if (bas < 0) return { bolumler: [], hata: 'Başlık satırında “Kazanım” sütunu yok (TestPlus şablonu: No · Kazanım · Kazanım Grup).' };
    const kSut = satirlar[bas].findIndex(kazanimMi);
    const nSut = satirlar[bas].findIndex(c => /^(soru\s*)?(no|numarası?)\.?$|^sıra$/.test(kucuk(c)));
    const parca = String(dosyaAdi).replace(/\.[^.]*$/, '').replace(/\s*\(\d+\)$/, '').split(/\s+-\s+/);
    const dosyaBolum = ((parca.length >= 2 && /^kazan[ıi]m/i.test(parca[0])) ? parca[1] : parca[0]).trim() || 'Dosya';
    const harita = new Map();
    satirlar.slice(bas + 1).forEach((r, i) => {
      const ham = String(r[kSut] == null ? '' : r[kSut]).trim();
      if (!ham || ham.toLowerCase() === 'null') return;
      const sira = i + 1; // No sütunu yoksa ya da boşsa satırın başlıktan sonraki konumu
      const m = ham.match(/^\[(.+?)\s+(\d+)\]\s*([\s\S]*)$/);
      const bolum = m ? m[1].trim() : dosyaBolum;
      const no = m ? Number(m[2]) : (parseInt(nSut >= 0 ? r[nSut] : '', 10) || sira);
      const ad = kazanimSade(m ? m[3] : ham);
      if (!ad || !(no >= 1)) return;
      if (!harita.has(bolum)) harita.set(bolum, new Map());
      const g = harita.get(bolum);
      if (!g.has(no)) g.set(no, ad);
    });
    if (!harita.size) return { bolumler: [], hata: 'Dosyada kazanım satırı yok.' };
    return { bolumler: [...harita].map(([ad, g]) => ({ ad, dosya: String(dosyaAdi), girdiler: [...g].map(([no, a]) => ({ no, ad: a })).sort((x, y) => x.no - y.no) })) };
  }

  /* Her bölüme en uygun dersin sırası (-1: koç seçer). "Türk Dili ve Edebiyatı" → Türkçe, "Matematik" → Temel Matematik. */
  function kazanimDersTahmin(bolumler, op) {
    const kelime = (s) => new Set(String(s).toLocaleLowerCase('tr').replace(/türk dili( ve)?( edebiyatı)?|edebiyat/g, 'türkçe')
      .replace(/[^a-zçğıöşü0-9]+/g, ' ').split(' ').filter(w => w && !['ve', 'bilimleri', 'bilimi', 'temel', 'testi', 'dersi', 'sınıf'].includes(w)));
    const dersK = op.dersler.map(d => kelime(d.ad));
    const tahmin = bolumler.map(b => {
      const k = kelime(b.ad);
      const puan = dersK.map(dk => { let n = 0; for (const w of k) if (dk.has(w)) n++; return n ? n / Math.max(k.size, dk.size) : 0; });
      const en = Math.max(...puan);
      return en > 0 && puan.filter(p => p === en).length === 1 ? puan.indexOf(en) : -1;
    });
    // hiçbir ad tutmadıysa ve bölüm sayısı ders sayısına eşitse sırayla
    if (tahmin.every(t => t < 0) && bolumler.length === op.dersler.length) return bolumler.map((_, i) => i);
    // aynı derse iki bölüm düştüyse ikisini de koça bırak
    return tahmin.map(t => t >= 0 && tahmin.filter(x => x === t).length > 1 ? -1 : t);
  }

  /* Eşlemeyi uygular (yerinde). eslem = [{ ders: dersSırası (-1: atla), girdiler }]. Eşlenen dersin eski kazanımları silinir.
   * Dönüş: { hata } ya da { atanan, kazanimlar:[{ id, ad }] } */
  async function kazanimUygula(op, eslem) {
    const secili = eslem.filter(e => e.ders >= 0 && e.ders < op.dersler.length);
    if (!secili.length) return { hata: 'Hiçbir bölüm bir derse eşlenmedi.' };
    const dersler = secili.map(e => e.ders);
    if (new Set(dersler).size !== dersler.length) return { hata: 'İki bölüm aynı derse eşlenmiş.' };
    for (const e of secili) {
      const d = op.dersler[e.ders];
      const fazla = e.girdiler.find(g => g.no > d.soru);
      if (fazla) return { hata: `${d.ad} ${d.soru} soru, dosyadaki bölümde ${fazla.no}. soru var. Eşlemeyi denetleyin.` };
    }
    const kimlikler = await Promise.all(secili.map(e => Promise.all(e.girdiler.map(g => kazanimKimligi(g.ad)))));
    const adlar = { ...(op.kazanimAd || {}) };
    let atanan = 0;
    secili.forEach((e, i) => {
      const d = op.dersler[e.ders];
      d.kazanim = Array.from({ length: d.soru }, () => []);
      e.girdiler.forEach((g, j) => { const id = kimlikler[i][j]; adlar[id] = g.ad; d.kazanim[g.no - 1] = [id]; atanan++; });
    });
    // artık hiçbir soruda geçmeyen adları at
    const kullanilan = new Set(op.dersler.flatMap(d => (d.kazanim || []).flat()));
    op.kazanimAd = Object.fromEntries(Object.entries(adlar).filter(([id]) => kullanilan.has(id)));
    return { atanan, kazanimlar: Object.entries(op.kazanimAd).map(([id, ad]) => ({ id, ad })) };
  }
  const kazanimSayisi = (d) => (d.kazanim || []).filter(x => x && x.length).length;

  const Optik = {
    SAYFA, formKodu, formTanimi, formDuzeni, formSvg, kodla, kodCoz, griyeCevir, formOku, homografi,
    HARF, SABLONLAR, ANAHTAR_NO, kontrolAlani, optikSinav, anahtarCoz, anahtarYazi, anahtarEksik, optikYayini, okumaAl,
    xlsxSatirlar, kazanimKimligi, kazanimBolumleri, kazanimDersTahmin, kazanimUygula, kazanimSayisi,
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = Optik;
  else kok.Optik = Optik;
})(typeof window !== 'undefined' ? window : globalThis);
</script>
<script>/* Deneme Takip · arayüz. Veri yalnız bu tarayıcıda (IndexedDB) ve koçun yedek dosyasında durur. */
(function () {
  'use strict';
  const M = window.Motor;
  const SURUM = 'v1.4 · 7 Ekim 2026';
  const ESIK = { zayif: 0.5, iyi: 0.67 }; // AKAS paneliyle aynı: < %50 zayıf, ≥ %67 iyi
  const VARSAYILAN_AYAR = { karneSira: true, karnePuan: true, karneKazanim: true, karneSoruDokumu: true, tahtaKisi: 7, tahtaDersler: false };

  let durum = M.bosDurum();
  const onbellek = new Map();
  const $ = (s, k = document) => k.querySelector(s);
  const ekran = () => $('#ekran');

  /* ---------- yardımcılar ---------- */
  const h = (x) => String(x == null ? '' : x).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const sayi = (x, b = 2) => (x == null || isNaN(x)) ? '–' : (Math.round(x * 100) / 100 || 0).toLocaleString('tr-TR', { minimumFractionDigits: 0, maximumFractionDigits: b });
  const yuzde = (x) => (x == null || isNaN(x)) ? '–' : '%' + Math.round(x * 100);
  const tarihYaz = (t) => { if (!t) return '–'; const [y, a, g] = String(t).split('-'); return h(`${g}.${a}.${y}`); };
  const renkSinif = (p) => p == null ? '' : p < ESIK.zayif ? 'zayif' : p >= ESIK.iyi ? 'iyi' : 'orta';
  const ayar = () => ({ ...VARSAYILAN_AYAR, ...(durum.ayarlar || {}) });
  const ogrenci = (no) => durum.ogrenciler.find(o => String(o.no) === String(no));
  const ogrAd = (no) => { const o = ogrenci(no); return o && o.ad ? o.ad : ''; };
  const ogrEtiket = (no) => ogrAd(no) || `No ${no}`;
  const sinavBul = (id) => durum.sinavlar.find(s => s.id === id);
  const kazanimAd = (id) => { const k = durum.kazanimlar.find(x => x.id === id); return k ? k.ad : id; };
  /* Öğrenme çıktısı grubu: "FİZ.9.1.2. … | ç) …" → anahtar FIZ.9.1.2, etiket "|" öncesi.
   * Kod biçimleri: FİZ.9.1.2. · TDE9.1. · M.9.1.1.1 - · T.8.1.1: · Kimya 9.1.1. · harfsiz en az üç düzey (9.1.1.).
   * Kodsuz adda anahtar "|" öncesi metindir. */
  const KOD_KATLA = { 'İ': 'I', 'Ç': 'C', 'Ğ': 'G', 'Ö': 'O', 'Ş': 'S', 'Ü': 'U' };
  function kazanimKodu(ad) {
    const bas = String(ad).split(' | ')[0].trim();
    // büyük harfli önek (FİZ.9.1.2, TDE9.1, M.9.1.1.1) ya da en az üç parçalı numara (Kimya 9.1.1);
    // "Sayı 3.5" gibi düz sözcük + ondalık kod sayılmaz. Önekte Türkçe harf katlanır: FİZ = FIZ.
    const m = bas.match(/^(?:([A-ZÇĞİÖŞÜ]{1,8})\.?\s*(\d+(?:\.\d+)+)|([A-Za-zÇĞİÖŞÜçğıöşü]{1,8})\.?\s*(\d+(?:\.\d+){2,})|(\d+(?:\.\d+){2,}))\.?(?=[\s:\-–—]|[a-zçğıöşü]\)|$)/);
    const harf = m && (m[1] || m[3]);
    const anahtar = !m ? bas.toLocaleLowerCase('tr') : harf ? harf.toLocaleUpperCase('tr').replace(/[İÇĞÖŞÜ]/g, c => KOD_KATLA[c]) + '.' + (m[2] || m[4]) : m[5];
    return { anahtar, etiket: bas };
  }
  // idler: yalnız bu dersin kazanımları (etiketler başka sınavların aynı kodlu ifadelerini almasın)
  function kazanimGruplari(idler) {
    const kim = new Map(), etiket = new Map();
    for (const id of new Set(idler)) {
      const g = kazanimKodu(kazanimAd(id));
      kim.set(id, g.anahtar);
      if (!etiket.has(g.anahtar)) etiket.set(g.anahtar, []);
      if (!etiket.get(g.anahtar).includes(g.etiket)) etiket.get(g.anahtar).push(g.etiket);
    }
    // Aynı kod farklı ifadelerle yazılmışsa (eski TestPlus sınavları) ilki ve "+n" görünür, hepsi ipucunda
    return {
      grupla: (id) => kim.get(id) || id,
      etiket: (a) => { const e = etiket.get(a); return !e ? kazanimAd(a) : e[0] + (e.length > 1 ? ` (+${e.length - 1} ifade)` : ''); },
      ipucu: (a) => { const e = etiket.get(a); return e ? e.join('\n') : kazanimAd(a); },
    };
  }
  const kisaKazanim = (ad) => { const k = String(ad).split(' | ')[0].trim(); return k.length > 150 ? k.slice(0, 147).trimEnd() + '…' : k; };
  const dersSoru = (s) => s.dersler.reduce((t, d) => t + d.soru, 0);

  function hesap(sinav) {
    if (!onbellek.has(sinav.id)) onbellek.set(sinav.id, M.sinavHesapla(sinav));
    return onbellek.get(sinav.id);
  }
  function tumHesaplar() { return durum.sinavlar.map(hesap); }
  // YKS puan tahmini; AYT denemesinde TYT eşinin hesabı da gerekir (önbellek kaydet() ile temizlenir)
  function puanlar(x) {
    const k = 'puan:' + x.sinav.id;
    if (!onbellek.has(k)) {
      const esi = M.puanTuru(x.sinav) === 'ayt' ? M.tytEsiBul(x.sinav, durum.sinavlar) : null;
      onbellek.set(k, { ...M.puanHesapla(x, esi ? hesap(esi) : null), esi });
    }
    return onbellek.get(k);
  }
  const TUR_AD = { tyt: 'TYT denemesi', ayt: 'AYT denemesi', ara: 'Ara sınıf denemesi (TYT’ye yaklaşık)', yok: 'Puan hesaplanmasın' };
  const puanBaslik = (P, t) => P.tur === 'ara' ? 'TYT ≈' : M.OSYM.tur[t].ad;
  const testAd = (k) => M.OSYM.test[k].ad;
  // puan hücresinin açıklaması: hesapta kullanılan (ölçekli) netler ya da neden hesaplanmadığı
  function puanIpucu(P, v, t) {
    if (!v || !v.net) return 'Bu sınavda puanlanan derse girmemiş.';
    if (v[t] == null) {
      if (P.tur === 'ayt' && v.tytYok) return 'TYT eşine girmediği (ya da TYT puanı hesaplanmadığı) için hesaplanmadı.';
      return 'ÖSYM kuralı: puan için ilgili testlerden en az 0,5 net gerekir.';
    }
    return 'Puanda kullanılan netler: ' + Object.entries(v.net).map(([k, n]) => `${testAd(k)} ${sayi(n)}`).join(' · ');
  }
  const puanYazi = (P, v) => P.turler.filter(t => v && v[t] != null).map(t => `${puanBaslik(P, t)} ${sayi(v[t], 1)}`).join(' · ');
  let analizOnbellek = new WeakMap();
  function kazanimAnalizi(x, dersId) {
    let m = analizOnbellek.get(x); if (!m) { m = new Map(); analizOnbellek.set(x, m); }
    if (!m.has(dersId)) m.set(dersId, M.kazanimAnalizi(x, dersId));
    return m.get(dersId);
  }

  function araliklar(nolar) {
    const p = []; let i = 0;
    while (i < nolar.length) {
      let j = i; while (j + 1 < nolar.length && nolar[j + 1] === nolar[j] + 1) j++;
      p.push(j - i >= 2 ? `${nolar[i]}–${nolar[j]}` : nolar.slice(i, j + 1).join(', '));
      i = j + 1;
    }
    return p.join(', ');
  }

  let bildirimZaman;
  function bildir(metin) {
    const b = bildirimAlani();
    b.textContent = metin; b.classList.add('acik');
    clearTimeout(bildirimZaman); bildirimZaman = setTimeout(() => b.classList.remove('acik'), 3500);
  }
  function bildirimAlani() {
    let b = $('.bildirim');
    if (!b) { b = document.createElement('div'); b.className = 'bildirim'; b.setAttribute('role', 'status'); b.setAttribute('aria-live', 'polite'); document.body.appendChild(b); }
    return b;
  }

  /* ---------- depolama (IndexedDB) ---------- */
  const DB = {
    ac() {
      if (this._p) return this._p;
      this._p = new Promise((coz, red) => {
        const r = indexedDB.open('deneme-takip', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => coz(r.result);
        r.onerror = () => red(r.error);
      });
      return this._p;
    },
    async al(k) {
      const db = await this.ac();
      return new Promise((coz, red) => { const r = db.transaction('kv').objectStore('kv').get(k); r.onsuccess = () => coz(r.result); r.onerror = () => red(r.error); });
    },
    async koy(k, v) {
      const db = await this.ac();
      return new Promise((coz, red) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => coz(); t.onerror = t.onabort = () => red(t.error || new Error('Yazma iptal edildi')); });
    },
  };

  // Aynı anda açık başka sekme varsa değişikliği duyurur; o sekme veriyi yeniden okur
  const kanal = typeof BroadcastChannel !== 'undefined' ? new BroadcastChannel('deneme-takip') : null;
  if (kanal) kanal.onmessage = async () => {
    try {
      const kayit = await DB.al('durum'); if (!kayit) return;
      const taslak = durum.elleTaslak;
      durum = { ...M.bosDurum(), ...kayit };
      if (taslak) durum.elleTaslak = taslak; // bu sekmedeki yarım elle giriş öbür sekmenin yazısıyla silinmesin
      onbellek.clear(); analizOnbellek = new WeakMap(); seritGuncelle();
      const a = document.activeElement;
      const yaziyor = a && a.matches && a.matches('input:not([type=checkbox]), textarea');
      if (yaziyor) bildir('Veri başka bir sekmede değişti.');
      else { yonlendir(); bildir('Veri başka bir sekmede değişti; ekran yenilendi.'); }
    } catch (e) { console.error(e); }
  };

  // Başarılıysa true; yazılamazsa uyarır ve false döner (veri bu sekmede açık kalır)
  let kayitBekliyor = false; // son kaydetme başarısızdı: bellekteki veri tarayıcıda yok
  async function kaydet() {
    durum.degisti = Date.now();
    onbellek.clear(); analizOnbellek = new WeakMap();
    let tamam = true;
    try {
      await DB.koy('durum', durum);
      if (kanal) kanal.postMessage('degisti');
    } catch (e) {
      console.error(e); tamam = false;
      bildir('Tarayıcıya kaydedilemedi: ' + (e && e.message) + '. Sekmeyi kapatmadan Yedekle’ye basın.');
    }
    kayitBekliyor = !tamam;
    seritGuncelle();
    return tamam;
  }

  // Seçim penceresi: [{ad, deger, ana}] → seçilen değer (Esc / Vazgeç: null)
  function sec(baslik, metin, secenekler) {
    return new Promise(coz => {
      const d = document.createElement('dialog');
      d.className = 'secim';
      d.innerHTML = `<h2>${h(baslik)}</h2><p>${metin}</p><div class="satir">${secenekler.map((o, i) => `<button data-i="${i}" class="${o.ana ? 'ana' : ''}">${h(o.ad)}</button>`).join('')}</div>`;
      d.addEventListener('click', ev => { const b = ev.target.closest('button[data-i]'); if (b) { d.close(); coz(secenekler[b.dataset.i].deger); } });
      d.addEventListener('cancel', () => coz(null));
      d.addEventListener('close', () => { coz(null); setTimeout(() => d.remove(), 0); }); // seçim yapıldıysa Promise zaten çözülmüştür
      document.body.appendChild(d); d.showModal();
    });
  }

  function seritGuncelle() {
    const s = $('#serit');
    const yedeksiz = (durum.sinavlar.length || (durum.optik || []).length) && (!durum.sonYedek || (durum.degisti || 0) > durum.sonYedek);
    s.classList.toggle('gizli', !yedeksiz);
    if (yedeksiz) {
      s.innerHTML = `<span>${durum.sonYedek ? 'Son yedekten sonra değişiklik var.' : 'Henüz yedek alınmadı.'} Tarayıcı verisi silinirse yedek dosyasından dönülür.</span><button class="ana" data-is="yedekle">Yedekle</button>`;
    }
  }

  /* ---------- yedek ve içe aktarma ---------- */
  function yedekMetni() {
    return JSON.stringify({ ...durum, bicim: 'deneme-takip/durum', surum: 1, yedekTarihi: new Date().toISOString() });
  }

  async function yedekKaydedildi() {
    durum.sonYedek = Date.now();
    try { await DB.koy('durum', durum); if (kanal) kanal.postMessage('degisti'); } catch (e) { console.error(e); }
    seritGuncelle();
  }

  async function yedekle(yeniDosya) {
    const metin = yedekMetni();
    if (window.showSaveFilePicker) {
      let yazilan = null;
      try {
        let tutamac = yeniDosya ? null : await DB.al('yedekDosyasi');
        if (tutamac && (await tutamac.queryPermission({ mode: 'readwrite' })) !== 'granted') {
          if ((await tutamac.requestPermission({ mode: 'readwrite' })) !== 'granted') tutamac = null;
        }
        if (!tutamac) {
          tutamac = await window.showSaveFilePicker({ suggestedName: 'deneme-takip-yedek.json', types: [{ description: 'Deneme Takip yedeği', accept: { 'application/json': ['.json'] } }] });
          await DB.koy('yedekDosyasi', tutamac);
        }
        const y = await tutamac.createWritable();
        await y.write(metin); await y.close();
        yazilan = tutamac;
      } catch (e) {
        if (e && e.name === 'AbortError') return;
        console.warn('Dosyaya yazılamadı, indirmeye geçiliyor', e);
        DB.koy('yedekDosyasi', null).catch(() => {}); // taşınmış ya da silinmiş dosya: sonraki yedekte konum yeniden sorulur
      }
      if (yazilan) {
        durum.yedekAdi = yazilan.name;
        await yedekKaydedildi();
        bildir(`Yedeklendi: ${yazilan.name}`);
        if (location.hash.startsWith('#/veri')) yonlendir();
        return;
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([metin], { type: 'application/json' }));
    const simdi = new Date(); // dosya adında yerel gün (UTC değil)
    a.download = `deneme-takip-yedek-${new Date(simdi - simdi.getTimezoneOffset() * 60000).toISOString().slice(0, 10)}.json`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    await yedekKaydedildi();
    bildir('Yedek indirildi. Dosyayı Drive klasörüne taşıyın.');
  }

  async function dosyaIsle(dosya) {
    try { await dosyaIsleIc(dosya); } catch (e) {
      console.error(e);
      iceAktarmaSonucu(`<div class="bilgi hata"><b>Dosya alınamadı.</b> ${h(e && e.message)}</div>`);
    }
  }

  async function dosyaIsleIc(dosya) {
    let veri;
    try { veri = JSON.parse(await dosya.text()); } catch (e) { return bildir('Dosya okunamadı: geçerli bir JSON değil.'); }
    if (veri && veri.bicim === 'deneme-takip/optik') return iceAktarmaSonucu((await optikOkumaAl(veri)).html);
    const sorun = M.dogrula(veri);
    if (sorun.length) return iceAktarmaSonucu(`<div class="bilgi hata"><b>Dosya alınmadı.</b><br>${sorun.slice(0, 8).map(h).join('<br>')}</div>`);
    if (veri.bicim === 'deneme-takip/durum') {
      let yerine = true;
      if (durum.sinavlar.length || (durum.optik || []).length || durum.elleTaslak || durum.ogrenciler.some(o => o.ad)) {
        const eski = veri.degisti && durum.degisti && veri.degisti < durum.degisti;
        const tarihi = veri.yedekTarihi ? new Date(veri.yedekTarihi).toLocaleString('tr-TR') : 'bilinmiyor';
        const optikSay = (d) => (Array.isArray(d.optik) && d.optik.length ? `, ${d.optik.length} optik sınav` : '');
        const metin = `Yedek: ${veri.sinavlar.length} sınav${optikSay(veri)}, ${veri.ogrenciler.length} öğrenci (alındığı an: ${h(tarihi)}). Tarayıcıda şu an ${durum.sinavlar.length} sınav${optikSay(durum)} var.`
          + (eski ? '<br><b>Dikkat: bu yedek, tarayıcıdaki veriden eski.</b>' : '')
          + (durum.elleTaslak ? '<br>Yarım kalmış elle giriş “yerine koy” seçilirse silinir.' : '');
        const c = await sec('Yedek dosyası', metin, [
          { ad: 'Birleştir', deger: 'birlestir', ana: true },
          { ad: 'Mevcut verinin yerine koy', deger: 'yerine' },
          { ad: 'Vazgeç', deger: null },
        ]);
        if (!c) return;
        yerine = c === 'yerine';
      }
      if (yerine) {
        const tut = { sonYedek: durum.sonYedek, yedekAdi: durum.yedekAdi };
        durum = { ...M.bosDurum(), ...veri, ...tut };
        optikHepsiniYayinla();
        if (!(await kaydet())) return iceAktarmaSonucu(KAYIT_HATASI);
        return iceAktarmaSonucu(`<div class="bilgi"><b>Yedek geri yüklendi.</b> ${veri.sinavlar.length} sınav, ${veri.ogrenciler.length} öğrenci.</div>`);
      }
    }
    // TestPlus çapraz denetimi: hesap motorumuz aktarılan değerleri tutturmalı
    const denetim = (veri.sinavlar || []).map(s => ({ ad: s.ad, ...M.tpDenetle(s) }));
    const tutmayan = denetim.filter(d => d.tutmayan);
    const { durum: yeni, rapor } = M.birlestir(durum, veri);
    if (veri.ayarlar && !durum.ayarlar) yeni.ayarlar = veri.ayarlar;
    durum = yeni;
    // optik sınavların yayını birleşmiş optik kaydından ve güncel öğrenci sınıflarından yeniden kurulur
    optikHepsiniYayinla();
    if (!(await kaydet())) return iceAktarmaSonucu(KAYIT_HATASI);
    const tutan = denetim.reduce((t, d) => t + d.tutan, 0);
    let html = `<div class="bilgi"><b>Alındı.</b> Yeni sınav ${rapor.yeniSinav}, güncellenen ${rapor.guncelSinav}, yeni öğrenci ${rapor.yeniOgrenci}.`;
    if (tutan) html += ` TestPlus ile karşılaştırılan ${tutan} ders sonucu${tutmayan.length ? '' : 'nun hepsi tuttu'}.`;
    html += '</div>';
    if (tutmayan.length) html += `<div class="bilgi uyari"><b>Dikkat:</b> şu sınavlarda hesap TestPlus ile tutmadı: ${tutmayan.map(d => h(d.ad) + ` (${d.tutmayan})`).join(', ')}.</div>`;
    if (!veri.adlarVar && veri.bicim === 'deneme-takip/aktarim') html += `<div class="bilgi uyari">Bu dosyada öğrenci adları yok; öğrenciler okul numarasıyla görünür. Adlı aktarım için dönüştürücüyü <code>--adlar</code> ile çalıştırın.</div>`;
    iceAktarmaSonucu(html);
  }

  const KAYIT_HATASI = '<div class="bilgi hata"><b>Dosya okundu ama tarayıcıya kaydedilemedi.</b> Veri bu sekmede açık; sekmeyi kapatmadan Yedekle’ye basın.</div>';
  let bekleyenSonuc = '';
  function iceAktarmaSonucu(html) {
    bekleyenSonuc = html;
    if (location.hash.startsWith('#/veri')) yonlendir(); else location.hash = '#/veri';
  }

  /* ---------- grafik ---------- */
  function cizgiGrafik({ etiketler, seriler, yuzdeMi = false, yuks = 220 }) {
    const G = 640, Y = yuks, sol = 40, sag = 12, ust = 14, alt = 36;
    seriler = seriler.map(sr => ({ ...sr, degerler: sr.degerler.map(v => Number.isFinite(v) ? v : null) }));
    const tum = seriler.flatMap(s => s.degerler).filter(v => v != null);
    if (!tum.length) return '<p class="alt">Grafik için veri yok.</p>';
    let min = Math.min(...tum), max = Math.max(...tum);
    if (yuzdeMi) { min = Math.min(0, min); max = Math.max(1, max); } else { const p = (max - min) * 0.15 || 1; min = Math.floor(min - p); max = Math.ceil(max + p); }
    const n = etiketler.length;
    const ic = 26; // ilk ve son tarih etiketi kesilmesin
    const x = (i) => n === 1 ? (sol + G - sag) / 2 : sol + ic + i * (G - sol - sag - 2 * ic) / (n - 1);
    const y = (v) => ust + (1 - (v - min) / (max - min || 1)) * (Y - ust - alt);
    let s = `<svg class="grafik" viewBox="0 0 ${G} ${Y}" role="img" aria-label="${h(seriler.map(sr => sr.ad).join(', '))} çizgi grafiği">`;
    for (let k = 0; k <= 4; k++) {
      const v = min + (max - min) * k / 4, yy = y(v);
      s += `<line x1="${sol}" x2="${G - sag}" y1="${yy}" y2="${yy}" stroke="var(--cizgi)" />`;
      s += `<text x="${sol - 6}" y="${yy + 4}" text-anchor="end">${yuzdeMi ? Math.round(v * 100) : sayi(v, 1)}</text>`;
    }
    etiketler.forEach((e, i) => { s += `<text x="${x(i)}" y="${Y - alt + 16}" text-anchor="middle">${h(e)}</text>`; });
    seriler.forEach(sr => {
      const nok = sr.degerler.map((v, i) => v == null ? null : [x(i), y(v)]);
      const yol = nok.filter(Boolean).map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      s += `<path d="${yol}" fill="none" stroke="${sr.renk}" stroke-width="${sr.kalin ? 2.6 : 1.8}" ${sr.kesik ? 'stroke-dasharray="5 4"' : ''}/>`;
      nok.forEach((p, i) => { if (p) s += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${sr.renk}"><title>${h(sr.ad)} · ${h(etiketler[i])}: ${yuzdeMi ? yuzde(sr.degerler[i]) : sayi(sr.degerler[i])}</title></circle>`; });
    });
    s += '</svg>';
    s += `<div class="satir alt" style="gap:14px;margin-top:4px">${seriler.map(sr => `<span><span class="cubuk" style="width:14px;background:${sr.renk}"></span> ${h(sr.ad)}</span>`).join('')}</div>`;
    return s;
  }
  const DERS_RENK = { 'Türkçe': '#2759c4', 'Sosyal Bilimler': '#1f8a4c', 'Matematik': '#c0392b', 'Fen Bilimleri': '#b7791f' };
  const dersRenk = (ad) => DERS_RENK[ad] || ['#7d3cbd', '#138496', '#6b7280'][[...ad].reduce((t, c) => t + c.charCodeAt(0), 0) % 3];
  const kisaTarih = (t) => t ? t.slice(8, 10) + '.' + t.slice(5, 7) + '.' + t.slice(2, 4) : '';

  /* ---------- tablolar: tıklayınca sırala ---------- */
  function tabloSiralanir(kap) {
    kap.querySelectorAll('th.sirala').forEach((th, sutun) => {
      th.addEventListener('click', () => {
        const tbody = th.closest('table').tBodies[0];
        const idx = [...th.parentNode.children].indexOf(th);
        const artan = th.dataset.yon !== 'artan';
        th.parentNode.querySelectorAll('th').forEach(x => delete x.dataset.yon);
        th.dataset.yon = artan ? 'artan' : 'azalan';
        const satirlar = [...tbody.rows];
        const deger = (r) => { const c = r.cells[idx]; const v = c.dataset.d != null ? c.dataset.d : c.textContent; const t = String(v).trim().replace('%', '').replace(',', '.'); const n = t === '' ? NaN : Number(t); return isNaN(n) ? String(v) : n; };
        satirlar.sort((a, b) => { const x = deger(a), y = deger(b); const r = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'tr', { numeric: true }); return artan ? r : -r; });
        satirlar.forEach(r => tbody.appendChild(r));
      });
    });
  }

  /* ---------- ekranlar ---------- */
  function bosEkran() {
    return `<div class="bos-durum"><h1>Henüz sınav yok</h1>
      <p>TestPlus’tan aktarılan dosyayı ya da bir yedek dosyasını buraya sürükleyin.</p>
      <div class="surukle" id="surukle-alani" style="max-width:520px;margin:18px auto">Dosyayı buraya bırakın<br><br><button class="ana" data-is="dosya-sec">Dosya seç</button></div>
      <p class="alt">Elle sonuç girmek için üstteki <a href="#/elle">Elle sonuç</a> sekmesini kullanın.</p></div>`;
  }

  function seviyeler() { return [...new Set(durum.sinavlar.map(s => s.seviye).filter(Boolean))].sort((a, b) => a - b); }

  function gorSinavlar(sorgu) {
    if (!durum.sinavlar.length) return bosEkran();
    const sev = sorgu.seviye ? Number(sorgu.seviye) : null;
    const sinavlar = durum.sinavlar.filter(s => !sev || s.seviye === sev).slice().reverse();
    const hs = sinavlar.map(hesap);
    const dersAdlari = [...new Set(sinavlar.flatMap(s => s.dersler.map(d => d.ad)))];
    let html = `<div class="satir ayrik"><div><h1>Sınavlar</h1><div class="alt">${durum.sinavlar.length} sınav · ${durum.ogrenciler.length} öğrenci</div></div>
      <div class="satir"><label class="alt">Sınıf düzeyi</label> <select data-is="seviye-sec"><option value="">Hepsi</option>${seviyeler().map(v => `<option value="${v}" ${v === sev ? 'selected' : ''}>${v}. sınıf</option>`).join('')}</select></div></div>`;
    // trend: başarı yüzdesi = ortalama toplam net / toplam soru (sınavların soru sayısı farklı olabilir)
    // Eğilim her sınıf düzeyi için ayrı çizilir: 9 ve 10. sınıf denemeleri aynı çizgide karşılaştırılmaz
    (sev ? [sev] : seviyeler()).forEach(v => {
      const kronolojik = durum.sinavlar.filter(s => s.seviye === v);
      if (kronolojik.length < 2) return;
      const kh = kronolojik.map(hesap);
      const adlar = [...new Set(kronolojik.flatMap(s => s.dersler.map(d => d.ad)))];
      const seriler = adlar.map(ad => ({
        ad, renk: dersRenk(ad),
        degerler: kh.map(x => { const d = x.sinav.dersler.find(dd => dd.ad === ad); const o = d && x.genel.dersler[d.id]; return o ? o.basari : null; }),
      }));
      seriler.unshift({ ad: 'Toplam', renk: 'var(--yazi)', kalin: true, degerler: kh.map(x => x.genel.basari) });
      html += `<div class="kart"><div class="satir ayrik"><b>${v}. sınıf · ortalama başarı eğilimi</b><span class="alt">net ÷ soru sayısı, %</span></div>${cizgiGrafik({ etiketler: kronolojik.map(s => kisaTarih(s.tarih)), seriler, yuzdeMi: true })}</div>`;
    });
    html += `<div class="tablo-kap"><table><thead><tr><th class="sol">Tarih</th><th class="sol">Sınav</th><th>Düzey</th><th>Kişi</th>${dersAdlari.map(a => `<th title="ortalama net">${h(a)}</th>`).join('')}<th>Toplam net</th><th>Soru</th></tr></thead><tbody>`;
    hs.forEach(x => {
      const s = x.sinav;
      html += `<tr class="tik" data-git="#/sinav/${encodeURIComponent(s.id)}"><td class="sol" data-d="${h(s.tarih)}">${tarihYaz(s.tarih)}</td><td class="sol">${h(s.ad)}${s.notlar && s.notlar.length ? ' <span class="rozet uyari" title="' + h(s.notlar.join(' ')) + '">not</span>' : ''}</td><td>${s.seviye ? s.seviye + '.' : '–'}</td><td>${x.satirlar.length}</td>`;
      dersAdlari.forEach(ad => { const d = s.dersler.find(dd => dd.ad === ad); const o = d && x.genel.dersler[d.id]; html += `<td title="${d ? d.soru + ' soru' : ''}">${o ? sayi(o.net) : '–'}</td>`; });
      html += `<td class="vurgu">${sayi(x.genel.toplam)}</td><td>${dersSoru(s)}</td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  function sinavBasligi(s, x) {
    return `<div class="satir ayrik"><div><div class="alt"><a href="#/sinavlar">Sınavlar</a> ›</div><h1>${h(s.ad)}</h1>
      <div class="alt">${tarihYaz(s.tarih)}${s.yayin ? ' · ' + h(s.yayin) : ''}${s.optik && optikBul(s.id) ? ` · <a href="#/optik/${encodeURIComponent(s.id)}">optik okuma</a>` : ''} · ${x.satirlar.length} öğrenci · ${s.dersler.map(d => `${h(d.ad)} ${d.soru}`).join(', ')} soru · ${s.ceza ? s.ceza + ' yanlış 1 doğruyu götürür' : 'yanlış doğruyu götürmez'}</div></div>
      <div class="satir yazdirma-yok"><a href="#/tahta/${encodeURIComponent(s.id)}"><button>Sınıf ekranı</button></a><a href="#/karne/${encodeURIComponent(s.id)}/hepsi"><button class="ana">Karneler</button></a></div></div>
      ${(s.notlar || []).map(n => `<div class="bilgi uyari">${h(n)}</div>`).join('')}`;
  }

  function sekmeler(s, secili) {
    const l = [['siralama', 'Sıralama'], ['dersler', 'Ders ortalamaları'], ['sorular', 'Soru analizi'], ['kazanimlar', 'Kazanım analizi'], ['kopya', 'Kopya analizi']];
    return `<div class="sekmeler">${l.map(([k, a]) => `<a href="#/sinav/${encodeURIComponent(s.id)}/${k}" class="${k === secili ? 'secili' : ''}">${a}</a>`).join('')}</div>`;
  }

  function sinifSecici(x, secili, is = 'sinif-sec') {
    const s = Object.keys(x.siniflar);
    if (s.length < 2) return '';
    return `<label class="alt">Sınıf</label> <select data-is="${is}"><option value="">Hepsi</option>${s.map(v => `<option ${v === secili ? 'selected' : ''}>${h(v)}</option>`).join('')}</select>`;
  }

  function gorSinav(id, sekme, sorgu) {
    const s = sinavBul(id);
    if (!s) return '<p>Sınav bulunamadı. <a href="#/sinavlar">Sınavlara dön</a></p>';
    const x = hesap(s);
    sekme = sekme || 'siralama';
    let html = sinavBasligi(s, x) + sekmeler(s, sekme);
    if (sekme === 'siralama') html += sekmeSiralama(s, x, sorgu);
    else if (sekme === 'dersler') html += sekmeDersler(s, x);
    else if (sekme === 'sorular') html += sekmeSorular(s, x, sorgu);
    else if (sekme === 'kazanimlar') html += sekmeKazanimlar(s, x, sorgu);
    else if (sekme === 'kopya') html += sekmeKopya(s, x, sorgu);
    return html;
  }

  function sekmeSiralama(s, x, sorgu) {
    const sinif = x.siniflar[sorgu.sinif] ? sorgu.sinif : ''; // eski bağlantıdaki olmayan sınıf: bütün sınıflar
    const ayrinti = sorgu.ayrinti === '1';
    const satirlar = x.satirlar.filter(r => !sinif || r.sinif === sinif);
    const cok = Object.keys(x.siniflar).length > 1; // tek şubede sınıf sırası genel sırayla aynı
    let html = `<div class="satir ayrik yazdirma-yok" style="margin:8px 0">${sinifSecici(x, sinif)}<label class="alt"><input type="checkbox" data-is="ayrinti" ${ayrinti ? 'checked' : ''}> Doğru / yanlış / boş göster</label></div>`;
    html += `<div class="tablo-kap"><table><thead><tr><th class="sirala">Sıra</th>${cok ? '<th class="sirala" title="sınıf içi sıra">Sınıf sıra</th>' : ''}<th class="sol sirala">No</th><th class="sol sirala">Ad</th>${cok ? '<th class="sol sirala">Sınıf</th>' : ''}`;
    s.dersler.forEach(d => { html += ayrinti ? `<th>${h(d.ad)} D</th><th>Y</th><th>B</th><th class="sirala">Net</th>` : `<th class="sirala" title="${d.soru} soru">${h(d.ad)}</th>`; });
    const P = puanlar(x);
    html += `<th class="sirala">Toplam</th><th class="sirala" title="T puanı: 50 sınav ortalaması, her 10 puan bir standart sapma (başarı yüzdesine göre, sınava girenlerin hepsi içinde)">T</th><th class="sirala" title="Z puanı: ortalamadan kaç standart sapma uzakta">Z</th>`;
    html += P.turler.map(t => `<th class="sirala" title="${P.tur === 'ara' ? 'bu netlerin TYT’deki yaklaşık puan karşılığı (OBP hariç)' : 'ÖSYM yöntemiyle tahmini sınav puanı (OBP hariç)'}">${puanBaslik(P, t)}</th>`).join('') + '</tr></thead><tbody>';
    satirlar.forEach(r => {
      html += `<tr ${r.no ? `class="tik" data-git="#/ogrenci/${encodeURIComponent(r.no)}"` : ''}><td>${r.sira}</td>${cok ? `<td>${r.sinifSira}</td>` : ''}<td class="sol">${h(r.no)}</td><td class="sol">${h(ogrAd(r.no)) || '<span class="alt">–</span>'}</td>${cok ? `<td class="sol">${h(r.sinif)}</td>` : ''}`;
      s.dersler.forEach(d => {
        const p = r.dersler[d.id];
        if (!p) { html += ayrinti ? '<td>–</td><td>–</td><td>–</td><td>–</td>' : '<td>–</td>'; return; }
        html += ayrinti ? `<td>${p.d}</td><td>${p.y}</td><td>${p.b}</td><td class="vurgu">${sayi(p.net)}</td>` : `<td title="D ${p.d} · Y ${p.y} · B ${p.b}">${sayi(p.net)}</td>`;
      });
      const v = P.ogrenci.get(String(r.no));
      html += `<td class="vurgu">${sayi(r.toplam)}</td><td>${sayi(r.t, 1)}</td><td>${sayi(r.z)}</td>`;
      html += P.turler.map(t => `<td title="${h(puanIpucu(P, v, t))}" data-d="${v && v[t] != null ? v[t] : -1}">${sayi(v && v[t], 1)}</td>`).join('') + '</tr>';
    });
    const o = (sinif && x.siniflar[sinif]) || x.genel;
    html += `</tbody><tfoot><tr><td colspan="${cok ? 5 : 3}" class="sol"><b>Ortalama</b> (${o.kisi} kişi)</td>`;
    s.dersler.forEach(d => { const od = o.dersler[d.id]; html += ayrinti ? `<td>${od ? sayi(od.d, 1) : '–'}</td><td>${od ? sayi(od.y, 1) : '–'}</td><td>${od ? sayi(od.b, 1) : '–'}</td><td><b>${od ? sayi(od.net) : '–'}</b></td>` : `<td><b>${od ? sayi(od.net) : '–'}</b></td>`; });
    html += `<td><b>${sayi(o.toplam)}</b></td><td></td><td></td>`;
    html += P.turler.map(t => { const v = satirlar.map(r => P.ogrenci.get(String(r.no))).filter(z => z && z[t] != null); return `<td><b>${v.length ? sayi(v.reduce((a, z) => a + z[t], 0) / v.length, 1) : '–'}</b></td>`; }).join('');
    html += '</tr></tfoot></table></div>';
    html += puanBolumu(s, P);
    html += '<p class="alt">T ve Z puanı öğrencinin bu sınava girenler arasındaki yerini gösterir; farklı zorluktaki sınavları karşılaştırmaya yarar. T = 50 + 10 × Z; 60, ortalamanın bir standart sapma üstü demektir. Küçük grupta (20–30 kişi) bir iki kişinin farkı T’yi birkaç puan oynatabilir.</p>';
    return html;
  }

  function puanBolumu(s, P) {
    const otomatik = M.puanTuruTahmin(s);
    let html = `<div class="kart"><div class="satir yazdirma-yok" style="margin-bottom:6px"><label class="alt">Puan</label> <select data-is="puan-turu" data-sinav="${h(s.id)}"><option value="">Kendiliğinden: ${TUR_AD[otomatik]}</option>${['tyt', 'ayt', 'ara', 'yok'].map(k => `<option value="${k}" ${s.puanTuru === k ? 'selected' : ''}>${TUR_AD[k]}</option>`).join('')}</select>`;
    if (P.tur === 'ayt') {
      const adaylar = durum.sinavlar.filter(z => z.id !== s.id && ['tyt', 'ara'].includes(M.puanTuru(z))).slice().reverse();
      const kendi = M.tytEsiBul({ ...s, tytEsi: null }, durum.sinavlar);
      html += ` <label class="alt">TYT eşi</label> <select data-is="tyt-esi" data-sinav="${h(s.id)}"><option value="">Kendiliğinden: ${kendi ? h(kendi.ad) : 'bulunamadı'}</option>${adaylar.map(z => `<option value="${h(z.id)}" ${s.tytEsi === z.id ? 'selected' : ''}>${tarihYaz(z.tarih)} · ${h(z.ad)}</option>`).join('')}</select>`;
    }
    html += '</div>';
    html += P.uyari.map(u => `<div class="bilgi uyari">${h(u)}</div>`).join('');
    const b = P.bilgi;
    const kucultulen = b && P.turler.length ? Object.keys(b.soru).filter(k => b.olcek[k] < 1) : [];
    const az = b && P.turler.length ? Object.keys(b.soru).filter(k => b.soru[k] < M.OSYM.test[k].soru) : [];
    const sinavAdi = P.tur === 'ayt' ? 'AYT' : 'TYT';
    let olcekNotu = '';
    if (kucultulen.length) olcekNotu += ` ${sinavAdi}’den çok soru olan testte net ${sinavAdi} soru sayısına küçültülür: ${kucultulen.map(k => `${testAd(k)} ${b.soru[k]} → ${M.OSYM.test[k].soru}`).join(', ')}.`;
    if (az.length) olcekNotu += ` ${sinavAdi}’den az soru olan testte net olduğu gibi alınır, sorulmayan konular yapılmış sayılmaz: ${az.map(k => `${testAd(k)} ${b.soru[k]} / ${M.OSYM.test[k].soru}`).join(', ')}.`;
    if (P.tur === 'tyt') {
      html += `<p class="alt"><b>TYT</b>: ÖSYM’nin yöntemiyle tahmini sınav puanı (OBP hariç). Her testin neti, ${M.OSYM.yil} YKS’deki son sınıf öğrencilerinin ortalaması ve standart sapmasıyla standart puana çevrilir; ÖSYM ağırlıklarıyla (Türkçe ve Temel Matematik %33, Sosyal ve Fen %17) toplanır ve 100–500 aralığına yayılır. ÖSYM bu aralığın uç değerlerini yayımlamadığı için bunlar ${M.OSYM.yil} puan dağılımından tahmin edildi; gerçek puandan birkaç puan sapabilir.${olcekNotu}</p>`;
    } else if (P.tur === 'ara' && P.turler.length) {
      let ac = `<b>TYT ≈</b>: bu netlerin TYT’deki yaklaşık puan karşılığı (OBP hariç), ÖSYM yöntemiyle. Netler hiçbir zaman büyütülmez.${olcekNotu}`;
      ac += ' Bu yüzden puan, öğrenci bugün TYT’ye girse alacağı puandan çok bu sınavdaki başarısının TYT karşılığıdır; aynı düzeydeki öğrencileri ve öğrencinin gelişimini karşılaştırmak için kullanın.';
      html += `<p class="alt">${ac}</p>`;
    } else if (P.tur === 'ayt' && P.turler.length) {
      html += `<p class="alt"><b>${P.turler.map(t => M.OSYM.tur[t].ad).join(', ')}</b>: ÖSYM’nin yöntemiyle tahmini sınav puanları (OBP hariç). AYT testlerinin standart puanlarına TYT eşindeki A-TYT puanının %40’ı eklenir; TYT eşine girmeyen öğrencinin puanı hesaplanmaz. Ortalama ve sapmalar ${M.OSYM.yil} YKS’den; 100–500 aralığının uçları ${M.OSYM.yil} puan dağılımından tahmin edildi, 10 puana kadar sapabilir.${olcekNotu}</p>`;
    } else if (P.tur === 'yok') {
      html += '<p class="alt">Bu sınav için puan hesaplanmıyor.</p>';
    }
    if (P.turler.length) {
      html += `<details class="alt"><summary>1 net kaç puan?</summary>${P.turler.map(t => { const d = M.netDegeri(t); return `<p><b>${puanBaslik(P, t)}</b>: ${Object.entries(d).map(([k, v]) => `${testAd(k)} ${sayi(v)}`).join(' · ')}</p>`; }).join('')}
        <p>Bir netin değeri testin ağırlığına ve ülke genelinde o testteki netlerin ne kadar dağıldığına bağlıdır (dağılım küçükse her net daha değerlidir), testteki soru sayısına göre orantılanmaz.${kucultulen.length ? ` Değerler ÖSYM sınavındaki bir net içindir; bu sınavda net küçültülen testlerde bir net daha az getirir: ${kucultulen.map(k => `${testAd(k)} ×${sayi(b.olcek[k])}`).join(', ')}.` : ''}</p></details>`;
    }
    return html + '</div>';
  }

  function sekmeDersler(s, x) {
    const gruplar = [['Genel', x.genel], ...Object.entries(x.siniflar).map(([k, v]) => [k, v])];
    let html = `<div class="tablo-kap"><table><thead><tr><th class="sol">Grup</th><th>Kişi</th>${s.dersler.map(d => `<th>${h(d.ad)} net</th><th>Başarı</th>`).join('')}<th>Toplam net</th></tr></thead><tbody>`;
    gruplar.forEach(([ad, o]) => {
      html += `<tr><td class="sol"><b>${h(ad)}</b></td><td>${o.kisi}</td>`;
      s.dersler.forEach(d => {
        const od = o.dersler[d.id]; const p = od ? od.basari : null;
        html += `<td>${od ? sayi(od.net) : '–'}</td><td><span class="cubuk-kap"><span class="cubuk" style="width:${Math.max(0, Math.min(100, (p || 0) * 100))}%"></span></span> <span class="${renkSinif(p)}">${yuzde(p)}</span></td>`;
      });
      html += `<td class="vurgu">${sayi(o.toplam)}</td></tr>`;
    });
    html += '</tbody></table></div><p class="alt">Başarı: ortalama net ÷ soru sayısı (iptal sorular hariç).</p>';
    // sınıf düzeyindeki önceki sınavlarla karşılaştırma
    const ayni = durum.sinavlar.filter(t => t.seviye === s.seviye && t.tarih <= s.tarih);
    if (ayni.length > 1) {
      const kh = ayni.map(hesap);
      const seriler = s.dersler.map(d => ({ ad: d.ad, renk: dersRenk(d.ad), degerler: kh.map(k => { const dd = k.sinav.dersler.find(z => z.ad === d.ad); const o = dd && k.genel.dersler[dd.id]; return o ? o.basari : null; }) }));
      html += `<div class="kart"><b>Bu sınava kadar ders başarısı (${s.seviye}. sınıf)</b>${cizgiGrafik({ etiketler: ayni.map(t => kisaTarih(t.tarih)), seriler, yuzdeMi: true })}</div>`;
    }
    return html;
  }

  function dersSecici(s, secili) {
    return `<label class="alt">Ders</label> <select data-is="ders-sec">${s.dersler.map(d => `<option value="${h(d.id)}" ${d.id === secili ? 'selected' : ''}>${h(d.ad)}</option>`).join('')}</select>`;
  }

  function sekmeSorular(s, x, sorgu) {
    const dersId = sorgu.ders || s.dersler[0].id;
    const a = M.soruAnalizi(x, dersId);
    if (!a) return '<p>Ders bulunamadı.</p>';
    if (!a.kisi) return `<div class="satir">${dersSecici(s, dersId)}</div><div class="bilgi">Bu derste cevap dizisi olan kâğıt yok (elle girilen sonuçlarda soru analizi yapılamaz).</div>`;
    let html = `<div class="satir ayrik" style="margin:8px 0">${dersSecici(s, dersId)}<span class="alt">${a.kisi} kâğıt${a.disarida ? ` (${a.disarida} B kitapçığı analiz dışı: soru eşlemesi bilinmiyor)` : ''} · güçlük: doğru oranı · ayırt edicilik: en iyi %27 ile en zayıf %27 arasındaki doğru oranı farkı</span></div>`;
    html += `<div class="tablo-kap"><table><thead><tr><th class="sirala">Soru</th><th>Cevap</th><th class="sirala">Doğru</th>${M.HARFLER.split('').map(h_ => `<th>${h_}</th>`).join('')}<th>Boş</th><th title="çift işaret">Çift</th><th class="sirala">Ayırt edicilik</th><th class="sol">Kazanım</th></tr></thead><tbody>`;
    a.sorular.forEach(q => {
      const r = renkSinif(q.guclukP);
      html += `<tr><td>${q.no}</td><td><b>${q.anahtar === 'X' ? 'İptal' : h(q.anahtar)}</b></td><td class="${r}" data-d="${q.guclukP == null ? -1 : q.guclukP}"><b>${yuzde(q.guclukP)}</b></td>`;
      M.HARFLER.split('').forEach(hr => {
        const n = q.dagilim[hr] || 0;
        const dogru = q.anahtar.indexOf(hr) >= 0, celd = hr === q.celdirici && n >= Math.max(2, q.dogru);
        html += `<td class="${dogru ? 'z-iyi' : celd ? 'z-zayif' : ''}">${n || ''}</td>`;
      });
      const ay = q.ayirt;
      html += `<td>${q.bos || ''}</td><td>${q.cift || ''}</td><td data-d="${ay == null ? -9 : ay}" class="${ay == null ? '' : ay < 0.2 ? 'zayif' : ay >= 0.4 ? 'iyi' : 'orta'}">${ay == null ? '–' : sayi(ay)}</td>`;
      html += `<td class="sol kazanim-ad" title="${h(q.kazanim.map(kazanimAd).join(' | '))}">${h(q.kazanim.map(kazanimAd).join(' | ')) || '<span class="alt">–</span>'}</td></tr>`;
    });
    html += '</tbody></table></div>';
    html += `<p class="alt">Yeşil: doğru şık. Kırmızı: doğru cevaptan çok ya da ona yakın seçilen çeldirici. Ayırt edicilik 0,40 ve üstü iyi, 0,20 altı zayıf (soru gözden geçirilmeli).</p>`;
    return html;
  }

  function sekmeKopya(s, x, sorgu) {
    const k = M.kopyaAnalizi(x);
    if (k.kagit < 3) return '<div class="bilgi">Kopya analizi için cevap dizisi olan en az 3 kâğıt gerekir; elle girilen sonuçlarda yapılamaz.</div>';
    const hepsi = sorgu.hepsi === '1';
    const isaretli = k.ciftler.filter(c => c.duzey);
    const liste = hepsi ? k.ciftler.slice(0, Math.max(30, isaretli.length)) : isaretli;
    const dersAd = id => (s.dersler.find(d => d.id === id) || {}).ad || id;
    const olasilik = p => p >= 0.5 ? '–' : p < 1e-6 ? '< 1 / 1.000.000' : '1 / ' + Math.round(1 / p).toLocaleString('tr-TR');
    const cok = Object.keys(x.siniflar).length > 1;
    let html = `<div class="bilgi uyari"><b>Bu bir inceleme işaretidir, kanıt değildir.</b> İki öğrencinin aynı sorularda aynı yanlış şıkkı seçmesi, birbirinden bağımsız çalışan iki öğrenciden beklenenden çok fazlaysa işaretlenir. Yan yana oturmak, birlikte çalışmak ya da aynı yanlış bilgiyi aynı kaynaktan öğrenmek de benzerlik yaratır. Öğrenciyle konuşmadan önce kâğıtlara ve oturma düzenine bakın; bu sayfayı öğrenciyle ya da sınıfla paylaşmayın.</div>`;
    html += `<div class="satir ayrik yazdirma-yok" style="margin:8px 0"><span class="alt">${k.kagit} kâğıt · ${k.ciftSayisi} çift karşılaştırıldı · <b>${isaretli.filter(c => c.duzey === 'guclu').length}</b> güçlü, <b>${isaretli.filter(c => c.duzey === 'dikkat').length}</b> dikkat</span><label class="alt"><input type="checkbox" data-is="kopya-hepsi" ${hepsi ? 'checked' : ''}> İşaretsizlerle birlikte en benzer 30 çifti göster</label></div>`;
    if (!liste.length) return html + '<p>Bu sınavda işaretlenen çift yok.</p>';
    html += `<div class="tablo-kap"><table><thead><tr><th class="sol">Düzey</th><th class="sol" title="altında: bu sınavdaki T puanı ← önceki denemelerin T ortalaması">Öğrenci 1</th><th class="sol" title="altında: bu sınavdaki T puanı ← önceki denemelerin T ortalaması">Öğrenci 2</th>${cok ? '<th class="sol">Sınıf</th>' : ''}<th title="ikisinin de aynı yanlış şıkkı işaretlediği soru">Ortak yanlış</th><th title="bağımsız çalışan iki öğrenciden beklenen ortak yanlış">Beklenen</th><th title="ikisinin de yanlış yaptığı soru">İkisi de yanlış</th><th title="farklı cevaplanan soru">Farklı cevap</th><th title="Harpp-Hogan oranı: ortak yanlış ÷ farklı cevap; 1 ve üstü çok yüksektir">Oran</th><th title="bu sınavda bu kadar benzer bir çiftin tesadüfen çıkma olasılığı">Tesadüf olasılığı</th><th class="sol">Derslere göre ortak yanlış</th></tr></thead><tbody>`;
    const hs = tumHesaplar();
    liste.forEach(c => {
      const duzey = c.duzey === 'guclu' ? '<b class="zayif">Güçlü</b>' : c.duzey === 'dikkat' ? '<b class="orta">Dikkat</b>' : '<span class="alt">–</span>';
      const sapma = (no) => {
        const o = M.oncekiSapma(hs, s.id, no);
        if (!o) return '<div class="alt">önceki deneme az</div>';
        // ortak yanlışın olduğu derslerde aynı karşılaştırma (ipucunda)
        const ders = Object.keys(c.ortakDers).map(id => o.dersler[id]).filter(Boolean).map(d => `${d.ad}: ${sayi(d.simdi, 0)} ← ${sayi(d.onceki, 0)} (${d.fark >= 0 ? '+' : ''}${sayi(d.fark, 0)})`).join(' · ');
        const f = `${o.fark >= 0 ? '+' : ''}${sayi(o.fark, 0)}`;
        return `<div class="alt" style="white-space:nowrap" title="${h(`Önceki ${o.n} deneme.` + (ders ? ' Ortak yanlışlı derslerde T: ' + ders : ''))}">T ${sayi(o.simdi, 0)} ← ${sayi(o.onceki, 0)} ${Math.round(o.fark) >= 10 ? `<b class="zayif">${f}</b>` : f}</div>`;
      };
      html += `<tr><td class="sol">${duzey}</td><td class="sol"><a href="#/ogrenci/${encodeURIComponent(c.a)}">${h(ogrEtiket(c.a))}</a>${sapma(c.a)}</td><td class="sol"><a href="#/ogrenci/${encodeURIComponent(c.b)}">${h(ogrEtiket(c.b))}</a>${sapma(c.b)}</td>${cok ? `<td class="sol">${h(c.sinifA === c.sinifB ? c.sinifA : c.sinifA + ' / ' + c.sinifB)}</td>` : ''}<td class="vurgu">${c.ortak}</td><td>${sayi(c.beklenen, 1)}</td><td>${c.ikisiYanlis}</td><td>${c.farkli}</td><td>${sayi(c.oran)}</td><td>${olasilik(c.pDuzeltilmis)}</td><td class="sol">${Object.entries(c.ortakDers).map(([id, n]) => `${h(dersAd(id))} ${n}`).join(' · ')}</td></tr>`;
    });
    html += '</tbody></table></div>';
    html += '<p class="alt">Beklenen: her soruda sınıfın yanlış şıklara dağılımından hesaplanır; herkesin düştüğü çeldiricide buluşmak az, kimsenin seçmediği şıkta buluşmak çok şey söyler. Güçlü: tesadüf olasılığı binde birden az. Dikkat: yüzde 5’ten az. Aynı çift birkaç sınavda işaretleniyorsa iz daha anlamlıdır. Yalnız aynı kitapçıktaki kâğıtlar karşılaştırılır.</p>';
    html += '<p class="alt">Öğrenci adının altındaki “T 64 ← 48 +16”: öğrencinin bu sınavdaki T puanı ← önceki en çok 5 denemesinin T ortalaması (T, sınavların zorluk farkını giderir; en az 2 önceki deneme gerekir). +10, sınıfta bir standart sapmalık yükseliştir ve kırmızı yazılır; fare üstüne gelince ortak yanlışlı derslerin karşılaştırması görünür. Bu sütun düzeyi değiştirmez: çalışan öğrenci de yükselir. İşaretli bir çiftte yalnız birinin olağan dışı yükselmesi, kimin kimden baktığı konusunda ipucu olabilir.</p>';
    return html;
  }

  function sekmeKazanimlar(s, x, sorgu) {
    const dersId = sorgu.ders || s.dersler[0].id;
    const kodlu = sorgu.kaz === 'kod';
    const dersK = (s.dersler.find(d => d.id === dersId) || {}).kazanim || [];
    const G = kazanimGruplari(dersK.flat());
    const k = M.kazanimAnalizi(x, dersId, kodlu ? G.grupla : null);
    if (!k) return '<p>Ders bulunamadı.</p>';
    const ad = kodlu ? G.etiket : kazanimAd, ipucu = kodlu ? G.ipucu : kazanimAd;
    // seçenek yalnız toplanacak bir şey varsa (aynı koda düşen iki alt madde) görünür
    const toplanir = kodlu || new Set(k.kazanimlar.map(e => G.grupla(e.kimlik))).size < k.kazanimlar.length;
    const gosterim = toplanir ? `<span><label class="alt">Gösterim</label> <select data-is="kaz-gosterim"><option value="">Her alt madde ayrı</option><option value="kod" ${kodlu ? 'selected' : ''}>Öğrenme çıktısına göre (kod)</option></select></span>` : '';
    let html = `<div class="satir ayrik" style="margin:8px 0"><span class="satir">${dersSecici(s, dersId)}${gosterim}</span>${sinifSecici(x, sorgu.sinif || '')}</div>`;
    if (!k.kazanimlar.length) return html + `<div class="bilgi">Bu derste sorulara kazanım atanmamış. ${s.optik && optikBul(s.id) ? `Kazanım Excel’ini <a href="#/optik/${encodeURIComponent(s.id)}">optik sınav sayfasından</a> yükleyin.` : 'TestPlus’ta kazanım Excel’i yüklenmiş sınavlarda görünür.'}</div>`;
    const liste = k.kazanimlar.slice().sort((a, b) => (a.basari ?? 1) - (b.basari ?? 1));
    html += `<h2>Kapsam ve sınıf başarısı</h2>${kodlu ? '<p class="alt">Aynı koddaki alt maddeler (a, b, ç…) tek satırda toplandı. Başarı, bu soruların hepsindeki doğru oranıdır; bir soru iki alt maddeye bağlıysa bir kez sayılır.</p>' : ''}<div class="tablo-kap"><table><thead><tr><th class="sol">Kazanım</th><th>Soru</th><th class="sirala">Başarı</th></tr></thead><tbody>`;
    liste.forEach(e => {
      html += `<tr><td class="sol kazanim-ad" title="${h(ipucu(e.kimlik))}">${h(ad(e.kimlik))}</td><td title="soru numaraları">${araliklar(e.sorular)}</td><td data-d="${e.basari == null ? -1 : e.basari}"><span class="cubuk-kap"><span class="cubuk" style="width:${(e.basari || 0) * 100}%"></span></span> <b class="${renkSinif(e.basari)}">${yuzde(e.basari)}</b></td></tr>`;
    });
    html += '</tbody></table></div>';
    const sinif = sorgu.sinif || '';
    const ogr = k.ogrenci.filter(o => !sinif || o.sinif === sinif).sort((a, b) => String(a.no).localeCompare(String(b.no), 'tr', { numeric: true }));
    html += `<h2>Öğrenci × kazanım ısı haritası</h2><p class="alt">Satır: öğrenci. Sütun: yukarıdaki listedeki sırayla kazanım (en zayıftan güçlüye). Hücre: o kazanımın sorularındaki doğru oranı. Üzerine gelince kazanım adı görünür.</p>`;
    html += `<div class="tablo-kap"><table class="harita"><thead><tr><th class="sol">Öğrenci</th>${liste.map((e, i) => `<th title="${h(ipucu(e.kimlik))}">${i + 1}</th>`).join('')}<th>Ort.</th></tr></thead><tbody>`;
    ogr.forEach(o => {
      const degerler = liste.map(e => o.basari[e.kimlik]);
      const gecerli = degerler.filter(v => v != null);
      const ort = gecerli.length ? gecerli.reduce((a, b) => a + b, 0) / gecerli.length : null;
      html += `<tr class="tik" data-git="#/ogrenci/${encodeURIComponent(o.no)}"><td class="sol">${h(ogrEtiket(o.no))}</td>${degerler.map((v, i) => `<td class="z-${renkSinif(v)}" title="${h(ipucu(liste[i].kimlik))}">${v == null ? '' : Math.round(v * 100)}</td>`).join('')}<td><b>${ort == null ? '' : Math.round(ort * 100)}</b></td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  function gorOgrenciler(sorgu) {
    if (!durum.ogrenciler.length) return bosEkran();
    const hs = tumHesaplar();
    const ara = (sorgu.ara || '').toLocaleLowerCase('tr');
    const sinif = sorgu.sinif || '';
    const siniflar = [...new Set(durum.ogrenciler.map(o => o.sinif).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
    const satirlar = durum.ogrenciler
      .filter(o => (!sinif || o.sinif === sinif) && (!ara || String(o.no).includes(ara) || (o.ad || '').toLocaleLowerCase('tr').includes(ara)))
      .map(o => {
        const g = M.ogrenciGelisimi(hs, o.no);
        const son = g[g.length - 1], onceki = g[g.length - 2];
        return { o, g, son, onceki };
      })
      .sort((a, b) => (a.o.sinif || '').localeCompare(b.o.sinif || '', 'tr', { numeric: true }) || String(a.o.no).localeCompare(String(b.o.no), 'tr', { numeric: true }));
    let html = `<div class="satir ayrik"><div><h1>Öğrenciler</h1><div class="alt">${durum.ogrenciler.length} öğrenci</div></div>
      <div class="satir"><a href="#/ozet"><button>Net özeti</button></a><input type="text" placeholder="No ya da ad ara" data-is="ogrenci-ara" value="${h(sorgu.ara || '')}"> <select data-is="ogr-sinif-sec"><option value="">Bütün sınıflar</option>${siniflar.map(v => `<option ${v === sinif ? 'selected' : ''}>${h(v)}</option>`).join('')}</select></div></div>`;
    html += `<div class="tablo-kap"><table><thead><tr><th class="sol sirala">No</th><th class="sol sirala">Ad</th><th class="sol sirala">Sınıf</th><th class="sirala">Sınav</th><th class="sol">Son sınav</th><th class="sirala">Son toplam net</th><th class="sirala">Sıra</th><th class="sirala" title="son sınavın başarı yüzdesi ile bir öncekinin farkı">Değişim</th></tr></thead><tbody>`;
    satirlar.forEach(({ o, g, son, onceki }) => {
      let deg = null;
      if (son && onceki) {
        if (son.basari != null && onceki.basari != null) deg = son.basari - onceki.basari;
      }
      html += `<tr class="tik" data-git="#/ogrenci/${encodeURIComponent(o.no)}"><td class="sol">${h(o.no)}</td><td class="sol">${h(o.ad || '') || '<span class="alt">–</span>'}</td><td class="sol">${h(o.sinif || '')}</td><td>${g.length}</td><td class="sol">${son ? h(son.sinavAd) : '–'}</td><td class="vurgu">${son ? sayi(son.toplam) : '–'}</td><td>${son ? son.sira + ' / ' + son.kisi : '–'}</td><td data-d="${deg == null ? -99 : deg}" class="${deg == null ? '' : deg > 0.02 ? 'iyi' : deg < -0.02 ? 'zayif' : ''}">${deg == null ? '–' : (deg > 0 ? '▲ ' : deg < 0 ? '▼ ' : '') + Math.abs(Math.round(deg * 100)) + ' puan'}</td></tr>`;
    });
    html += '</tbody></table></div><p class="alt">Değişim: son iki sınavın başarı yüzdesi (toplam net ÷ toplam soru) farkı, yüzde puanı olarak.</p>';
    return html;
  }

  /* Net özeti: öğrenci × sınav. Koçun Excel'indeki "Net Özeti"nin karşılığı; girilmeyen sınav boş kalır,
   * sıra ortalama başarıya (net ÷ soru) göredir, böylece az sınava giren öğrenci haksız sıralanmaz. */
  function gorOzet(sorgu) {
    if (!durum.sinavlar.length) return bosEkran();
    const sev = sorgu.seviye ? Number(sorgu.seviye) : (durum.sinavlar.filter(s => s.seviye).pop() || {}).seviye || null;
    const sinavlar = durum.sinavlar.filter(s => !sev || s.seviye === sev);
    const hs = sinavlar.map(hesap);
    const dersAd = sorgu.ders || '';
    const dersAdlari = [...new Set(sinavlar.flatMap(s => s.dersler.map(d => d.ad)))];
    const sinif = sorgu.sinif || '';
    const kayit = new Map();
    hs.forEach((x, i) => x.satirlar.forEach(r => {
      if (!r.no) return; // numarasız kâğıt öğrenciye bağlanamaz
      let net, basari, t;
      if (dersAd) {
        const d = x.sinav.dersler.find(z => z.ad === dersAd);
        if (!d || !r.dersler[d.id]) return;
        ({ net, basari, t } = r.dersler[d.id]);
      } else {
        net = r.toplam; basari = r.basari; t = r.t;
      }
      const k = kayit.get(String(r.no)) || { no: r.no, sinif: r.sinif, hucre: Array(hs.length).fill(null) };
      k.sinif = r.sinif; k.hucre[i] = { net, basari, t };
      kayit.set(String(r.no), k);
    }));
    const siniflar = [...new Set([...kayit.values()].map(k => k.sinif).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
    const satirlar = [...kayit.values()].filter(k => !sinif || k.sinif === sinif).map(k => {
      const v = k.hucre.filter(Boolean), vb = v.filter(c => c.basari != null), vt = v.filter(c => c.t != null);
      return { ...k, sayi: v.length, ortNet: v.reduce((t, c) => t + c.net, 0) / v.length, ortBasari: vb.length ? vb.reduce((t, c) => t + c.basari, 0) / vb.length : null, ortT: vt.length ? vt.reduce((t, c) => t + c.t, 0) / vt.length : null };
    });
    const sira = M.sirala(satirlar, k => k.ortBasari == null ? -Infinity : k.ortBasari);
    satirlar.sort((a, b) => sira.get(a) - sira.get(b) || String(a.no).localeCompare(String(b.no), 'tr', { numeric: true }));
    let html = `<div class="satir ayrik"><div><div class="alt"><a href="#/ogrenciler">Öğrenciler</a> ›</div><h1>Net özeti</h1><div class="alt">${sev ? sev + '. sınıf · ' : ''}${sinavlar.length} sınav · ${satirlar.length} öğrenci</div></div>
      <div class="satir"><select data-is="seviye-sec">${seviyeler().map(v => `<option value="${v}" ${v === sev ? 'selected' : ''}>${v}. sınıf</option>`).join('')}</select>
      <select data-is="ozet-ders"><option value="">Toplam net</option>${dersAdlari.map(a => `<option ${a === dersAd ? 'selected' : ''}>${h(a)}</option>`).join('')}</select>
      ${siniflar.length > 1 ? `<select data-is="sinif-sec"><option value="">Bütün sınıflar</option>${siniflar.map(v => `<option ${v === sinif ? 'selected' : ''}>${h(v)}</option>`).join('')}</select>` : ''}</div></div>`;
    if (!satirlar.length) return html + '<p>Bu seçimde sonuç yok.</p>';
    html += `<div class="tablo-kap"><table><thead><tr><th class="sirala">Sıra</th><th class="sol sirala">No</th><th class="sol sirala">Ad</th>${siniflar.length > 1 ? '<th class="sol sirala">Sınıf</th>' : ''}`;
    sinavlar.forEach(s => { html += `<th class="sirala" title="${h(s.ad)}">${h(kisaTarih(s.tarih))}<br><span style="font-weight:400">${h((s.yayin || s.ad).replace(/ Yayınları$/, '').slice(0, 14))}</span></th>`; });
    html += `<th class="sirala" title="girdiği sınav sayısı">Sınav</th><th class="sirala">Ort. net</th><th class="sirala" title="net ÷ soru sayısı ortalaması">Ort. başarı</th><th class="sirala" title="girdiği sınavlardaki T puanlarının ortalaması">Ort. T</th></tr></thead><tbody>`;
    satirlar.forEach(k => {
      html += `<tr class="tik" data-git="#/ogrenci/${encodeURIComponent(k.no)}"><td>${sira.get(k)}</td><td class="sol">${h(k.no)}</td><td class="sol">${h(ogrAd(k.no)) || '<span class="alt">–</span>'}</td>${siniflar.length > 1 ? `<td class="sol">${h(k.sinif)}</td>` : ''}`;
      k.hucre.forEach(c => { html += c ? `<td data-d="${c.net}" class="${c.net < 0 ? 'zayif' : ''}">${sayi(c.net)}</td>` : '<td data-d="-999" class="alt" title="sınava girmedi">–</td>'; });
      html += `<td>${k.sayi}</td><td class="vurgu">${sayi(k.ortNet)}</td><td data-d="${k.ortBasari == null ? -99 : k.ortBasari}">${yuzde(k.ortBasari)}</td><td data-d="${k.ortT == null ? -99 : k.ortT}">${sayi(k.ortT, 1)}</td></tr>`;
    });
    html += `</tbody><tfoot><tr><td colspan="${siniflar.length > 1 ? 4 : 3}" class="sol"><b>Ortalama</b></td>`;
    sinavlar.forEach((s, i) => { const v = satirlar.map(k => k.hucre[i]).filter(Boolean); html += `<td><b>${v.length ? sayi(v.reduce((t, c) => t + c.net, 0) / v.length) : '–'}</b></td>`; });
    html += `<td></td><td><b>${sayi(satirlar.reduce((t, k) => t + k.ortNet, 0) / satirlar.length)}</b></td><td></td><td></td></tr></tfoot></table></div>`;
    html += `<p class="alt">“–”: sınava girmedi; ortalamaya katılmaz. Sıra ortalama başarıya (net ÷ soru, iptal sorular hariç) göredir; soru sayısı farklı sınavlar (ör. 25 soruluk) da böylece adil karşılaştırılır. Sütun başlığına tıklayınca o sınava göre sıralanır.</p>`;
    return html;
  }

  /* Konu takibi: koçun AKAS konu kodlarıyla sınavlar arası kapsam ve öğrenci başarısı.
   * AKAS'tan farkı: öğrenci hücresi ders yüzdesi değil, o konunun sorularındaki gerçek doğru oranıdır. */
  const KAPSAM = (n) => n === 0 ? ['Sorulmamış', 'alt'] : n === 1 ? ['Az', 'zayif'] : n <= 5 ? ['Temsil', 'orta'] : ['Yeterli', 'iyi'];
  const isaret = (p) => p == null ? '' : p >= ESIK.iyi ? '✦' : p >= ESIK.zayif ? '●' : '▾';

  function gorKonu(sorgu) {
    if (!durum.sinavlar.length) return bosEkran();
    const konulu = durum.sinavlar.filter(s => s.dersler.some(d => Array.isArray(d.konu)));
    let html = `<div class="satir ayrik"><div><h1>Konu takibi</h1><div class="alt">Sınavlar arası konu kapsamı ve öğrenci başarısı · konu kodları koçun AKAS eşlemesinden</div></div>`;
    if (!konulu.length) return html + `</div><div class="bilgi">Hiçbir sınavda konu eşlemesi yok. Konu kodları dönüştürücüdeki AKAS eşleme dosyasından gelir.</div>`;
    const sevler = [...new Set(konulu.map(s => s.seviye).filter(Boolean))].sort((a, b) => a - b);
    const sev = sorgu.seviye ? Number(sorgu.seviye) : (sevler.length ? sevler[sevler.length - 1] : null);
    const sinavlar = durum.sinavlar.filter(s => sev == null || s.seviye === sev);
    const dersler = [];
    sinavlar.forEach(s => s.dersler.forEach(d => { if (Array.isArray(d.konu) && !dersler.some(x => x.id === d.id)) dersler.push({ id: d.id, ad: d.ad }); }));
    const dersId = dersler.some(d => d.id === sorgu.ders) ? sorgu.ders : (dersler[0] || {}).id;
    const t = dersId ? M.konuTakibi(sinavlar.map(hesap), dersId) : { sinavlar: [], konular: [], ogrenci: [] };
    const siniflar = [...new Set(t.ogrenci.map(o => o.sinif).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
    const sinif = siniflar.includes(sorgu.sinif) ? sorgu.sinif : '';
    html += `<div class="satir"><select data-is="seviye-sec">${sevler.map(v => `<option value="${v}" ${v === sev ? 'selected' : ''}>${v}. sınıf</option>`).join('')}</select>
      <select data-is="ders-sec">${dersler.map(d => `<option value="${h(d.id)}" ${d.id === dersId ? 'selected' : ''}>${h(d.ad)}</option>`).join('')}</select>
      ${siniflar.length > 1 ? `<select data-is="sinif-sec"><option value="">Bütün sınıflar</option>${siniflar.map(v => `<option ${v === sinif ? 'selected' : ''}>${h(v)}</option>`).join('')}</select>` : ''}</div></div>`;
    if (!dersId) return html + `<div class="bilgi">${sev ? sev + '. sınıf sınavlarında' : 'Bu sınavlarda'} konu eşlemesi yok.</div>`;
    const eslemesiz = sinavlar.filter(s => !s.dersler.some(d => d.id === dersId && Array.isArray(d.konu)));
    if (eslemesiz.length) html += `<div class="bilgi uyari">Konu eşlemesi olmayan ${eslemesiz.length} sınav bu rapora girmedi: ${eslemesiz.map(s => h(s.ad)).join(', ')}.</div>`;
    if (!t.sinavlar.length) return html;
    const ogr = t.ogrenci.filter(o => !sinif || o.sinif === sinif);
    // katalogdaki bütün konular (hiç sorulmamışlar dahil) + katalogda olmayan kodlar
    const katalog = (durum.konular || []).filter(k => k.ders === dersId);
    const kodlar = [...new Set([...katalog.map(k => k.id), ...t.konular.map(k => k.kod)])];
    const konuAd = (kod) => { const k = (durum.konular || []).find(x => x.id === kod); return k ? k.ad : ''; };
    const satir = kodlar.map(kod => {
      const k = t.konular.find(x => x.kod === kod) || { kod, sinav: {}, soru: 0 };
      let d = 0, n = 0; ogr.forEach(o => { const e = o.konu[kod]; if (e) { d += e.d; n += e.t; } });
      return { ...k, ad: konuAd(kod), sinifBasari: n ? d / n : null };
    });
    const sorulan = satir.filter(k => k.soru).sort((a, b) => (a.sinifBasari ?? 2) - (b.sinifBasari ?? 2));
    const sorulmayan = satir.filter(k => !k.soru);
    const say = (f) => satir.filter(f).length;
    html += `<div class="izgara" style="margin:12px 0">
      <div class="ozet"><b>${satir.length}</b><span>konu</span></div>
      <div class="ozet"><b>${sorulmayan.length}</b><span>hiç sorulmamış</span></div>
      <div class="ozet"><b>${say(k => k.soru === 1)}</b><span>tek soruyla temsil</span></div>
      <div class="ozet"><b class="zayif">${say(k => k.sinifBasari != null && k.sinifBasari < ESIK.zayif)}</b><span>sınıf başarısı %50 altı</span></div></div>`;
    html += `<h2>Kapsam ve sınıf başarısı</h2><div class="tablo-kap"><table><thead><tr><th class="sol sirala">Kod</th><th class="sol sirala">Konu</th>${t.sinavlar.map(s => `<th title="${h(s.ad)}">${h(kisaTarih(s.tarih))}</th>`).join('')}<th class="sirala">Soru</th><th class="sol">Kapsam</th><th class="sirala">Sınıf başarısı</th></tr></thead><tbody>`;
    [...sorulan, ...sorulmayan].forEach(k => {
      const [kd, ks] = KAPSAM(k.soru);
      html += `<tr><td class="sol">${h(k.kod)}</td><td class="sol kazanim-ad" title="${h(k.ad)}">${h(k.ad) || '<span class="alt">katalogda yok</span>'}</td>`;
      t.sinavlar.forEach(s => { const q = k.sinav[s.id]; html += `<td title="${q ? 'soru ' + araliklar(q) : ''}">${q ? q.length : ''}</td>`; });
      html += `<td>${k.soru}</td><td class="sol ${ks}">${kd}</td><td data-d="${k.sinifBasari == null ? -1 : k.sinifBasari}">${k.sinifBasari == null ? '–' : `<span class="cubuk-kap"><span class="cubuk" style="width:${k.sinifBasari * 100}%"></span></span> <b class="${renkSinif(k.sinifBasari)}">${yuzde(k.sinifBasari)}</b>`}</td></tr>`;
    });
    html += `</tbody></table></div><p class="alt">Kapsam (AKAS ile aynı): 0 soru sorulmamış, 1 az, 2–5 temsil, 6 ve üstü yeterli. Hücredeki sayı o sınavdaki soru sayısı; üzerine gelince soru numaraları görünür.</p>`;
    html += `<h2>Öğrenci × konu</h2><p class="alt">Hücre: öğrencinin o konunun bütün sorularındaki doğru oranı. ✦ %67 ve üstü · ● %50–66 · ▾ %50 altı. Sütunlar yukarıdaki sırayla (en zayıf konudan başlayarak); üzerine gelince konu ve doğru sayısı görünür.</p>`;
    html += `<div class="tablo-kap"><table class="harita"><thead><tr><th class="sol">Öğrenci</th>${sorulan.map((k, i) => `<th title="${h(k.kod + ' ' + k.ad)}">${i + 1}</th>`).join('')}<th>Ort.</th></tr></thead><tbody>`;
    ogr.slice().sort((a, b) => String(a.no).localeCompare(String(b.no), 'tr', { numeric: true })).forEach(o => {
      let td = 0, tt = 0;
      const hucre = sorulan.map(k => {
        const e = o.konu[k.kod]; if (!e) return '<td></td>';
        td += e.d; tt += e.t; const p = e.d / e.t;
        return `<td class="z-${renkSinif(p)}" title="${h(k.kod + ' ' + k.ad)}: ${e.d}/${e.t}">${isaret(p)}</td>`;
      }).join('');
      html += `<tr class="tik" data-git="#/ogrenci/${encodeURIComponent(o.no)}"><td class="sol">${h(ogrEtiket(o.no))}</td>${hucre}<td><b>${tt ? Math.round(td / tt * 100) : ''}</b></td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  function gorOgrenci(no, sorgu = {}) {
    const o = ogrenci(no);
    if (!o) return '<p>Öğrenci bulunamadı. <a href="#/ogrenciler">Öğrencilere dön</a></p>';
    const g = M.ogrenciGelisimi(tumHesaplar(), no);
    let html = `<div class="satir ayrik"><div><div class="alt"><a href="#/ogrenciler">Öğrenciler</a> ›</div><h1>${h(o.ad || 'Okul no ' + o.no)}</h1><div class="alt">Okul no ${h(o.no)} · ${h(o.sinif || '')} · ${g.length} sınav</div></div>
      <div class="satir yazdirma-yok"><input type="text" data-is="ad-yaz" data-no="${h(o.no)}" placeholder="Ad soyad (sunucuya gitmez)" value="${h(o.ad || '')}" style="min-width:220px"> ${g.length ? `<a href="#/karne/${encodeURIComponent(g[g.length - 1].sinavId)}/${encodeURIComponent(o.no)}"><button class="ana">Son sınav karnesi</button></a>` : ''}</div></div>`;
    if (!g.length) return html + '<p>Bu öğrencinin sınavı yok.</p>';
    const etiket = g.map(x => kisaTarih(x.tarih));
    html += `<div class="kart"><b>Gelişim</b> <span class="alt">· toplam net ÷ toplam soru, %</span>${cizgiGrafik({ etiketler: etiket, yuzdeMi: true, seriler: [
      { ad: ogrEtiket(no), renk: 'var(--vurgu)', kalin: true, degerler: g.map(x => x.basari) },
      { ad: 'Sınıf ortalaması', renk: 'var(--soluk)', kesik: true, degerler: g.map(x => x.sinifBasari) },
    ] })}</div>`;
    const dersAdlari = [...new Set(g.flatMap(x => x.dersler.map(d => d.ad)))];
    html += `<div class="tablo-kap"><table><thead><tr><th class="sol">Tarih</th><th class="sol">Sınav</th>${dersAdlari.map(a => `<th>${h(a)}</th>`).join('')}<th>Toplam</th><th title="T puanı: sınava girenler içinde yeri; 50 ortalama">T</th><th title="tahmini YKS puanı (OBP hariç); TYT ≈ ara sınıf denemesinin yaklaşık TYT karşılığı">Puan</th><th>Sınıf ort.</th><th>Sıra</th><th>Sınıf sıra</th><th></th></tr></thead><tbody>`;
    g.slice().reverse().forEach(x => {
      html += `<tr><td class="sol">${tarihYaz(x.tarih)}</td><td class="sol"><a href="#/sinav/${encodeURIComponent(x.sinavId)}">${h(x.sinavAd)}</a></td>`;
      dersAdlari.forEach(a => { const d = x.dersler.find(z => z.ad === a); html += `<td title="${d ? `D ${d.d} · Y ${d.y} · B ${d.b} · sınıf ort. ${sayi(d.sinifOrt)}` : ''}" class="${d && d.sinifOrt != null ? (d.net >= d.sinifOrt ? 'iyi' : 'zayif') : ''}">${d ? sayi(d.net) : '–'}</td>`; });
      const sv = sinavBul(x.sinavId), P = sv ? puanlar(hesap(sv)) : null, pv = P && P.ogrenci.get(String(no));
      html += `<td class="vurgu">${sayi(x.toplam)}</td><td>${sayi(x.t, 1)}</td><td style="white-space:nowrap">${P && puanYazi(P, pv) || '–'}</td><td>${sayi(x.sinifOrt)}</td><td>${x.sira} / ${x.kisi}</td><td>${x.sinifSira} / ${x.sinifKisi}</td><td><a href="#/karne/${encodeURIComponent(x.sinavId)}/${encodeURIComponent(no)}">karne</a></td></tr>`;
    });
    html += '</tbody></table></div><p class="alt">Yeşil: sınıf ortalamasının üstünde ya da eşit; kırmızı: altında.</p>';
    const hs = tumHesaplar().filter(x => g.some(z => z.sinavId === x.sinav.id));
    html += ogrenciZorluk(hs, no, sorgu) + ogrenciKazanimGecmisi(hs, no, sorgu);
    return html;
  }

  /* ---------- zorluk ---------- */
  const DILIM_AD = ['Çok kolay', 'Kolay', 'Orta', 'Zor', 'Çok zor'];
  const DILIM_ARALIK = ['%80 ve üstü', '%60–79', '%40–59', '%20–39', '%20 altı'];
  const dilimAdi = (p) => DILIM_AD[M.ZORLUK_DILIM.findIndex(a => p >= a)];
  function esikKisa(o) {
    if (o.durum === 'ara') return `%${Math.round(o.esik * 100)} <span class="alt">${dilimAdi(o.esik).toLocaleLowerCase('tr')}</span>`;
    return { ust: 'inmiyor', alt: 'en kolayda', az: '<span class="alt">veri az</span>' }[o.durum];
  }
  function esikCumle(o) {
    if (o.durum === 'ara') return `Sınava girenlerin yaklaşık <b>%${Math.round(o.esik * 100)}</b>’inin çözebildiği sorulardan daha zor sorularda başarısı %50’nin altına iniyor (${dilimAdi(o.esik).toLocaleLowerCase('tr')} dilim).`;
    return { ust: 'Hesaba giren en zor dilimde bile soruların yarısından fazlasını çözüyor.', alt: 'Hesaba giren en kolay dilimde bile soruların yarısından azını çözüyor.', az: 'Eşik için en az iki dilimde beşer soru gerekir; henüz veri az.' }[o.durum];
  }
  // sıralama değeri: en kolayda düşen en üstte, hiç düşmeyen en altta
  const anahtarSuphe = (q) => q.kisi >= 15 && q.yanlisN >= q.kisi / 2; // küçük grupta tesadüf olabilir
  const esikSira = (o) => ({ alt: 2, ara: o.esik, ust: -1, az: -2 }[o.durum]);
  const ZORLUK_ACIKLAMA = 'Bir sorunun zorluğu, o sınava girenlerin (A kitapçığı) o soruyu çözme oranıdır; öğrencinin kendi cevabı bu orana katılmaz. 8 kişiden az girilen dersler hesaba girmez. Boş bırakılan soru çözülmemiş sayılır.';

  function ogrenciZorluk(hs, no, sorgu) {
    const dersler = [];
    hs.forEach(x => x.sinav.dersler.forEach(d => { if (!d.elle && !dersler.some(z => z.id === d.id)) dersler.push({ id: d.id, ad: d.ad }); }));
    const dersId = dersler.some(d => d.id === sorgu.zders) ? sorgu.zders : '';
    const z = M.zorlukProfili(hs, dersId || null);
    const o = z.ogrenci.find(x => String(x.no) === String(no));
    let html = `<div class="kart"><div class="satir ayrik"><b>Zorluk profili</b><span><label class="alt">Ders</label> <select data-is="z-ders"><option value="">Bütün dersler</option>${dersler.map(d => `<option value="${h(d.id)}" ${d.id === dersId ? 'selected' : ''}>${h(d.ad)}</option>`).join('')}</select></span></div>`;
    if (!o || !o.t) return html + '<p class="alt">Bu öğrencinin girdiği sınavlarda zorluk hesaplanacak kadar kâğıt yok.</p></div>';
    html += `<p>${esikCumle(o)}</p><div class="tablo-kap"><table><thead><tr><th class="sol">Dilim</th><th title="sınava girenlerin çözme oranı">Sorunun çözülme oranı</th><th>Soru</th><th>Doğru</th><th class="sol">Öğrencinin başarısı</th><th title="aynı sorularda sınava girenlerin ortalaması">Ortalama öğrenci</th></tr></thead><tbody>`;
    o.dilim.forEach((x, i) => {
      if (!x.t) return;
      const b = x.d / x.t, ort = x.pt / x.t;
      html += `<tr><td class="sol">${DILIM_AD[i]}</td><td>${DILIM_ARALIK[i]}</td><td>${x.t}</td><td>${x.d}</td><td class="sol"><span class="cubuk-kap"><span class="cubuk" style="width:${b * 100}%"></span></span> <b class="${renkSinif(b)}">${yuzde(b)}</b></td><td>${yuzde(ort)}</td></tr>`;
    });
    html += `</tbody></table></div><p class="alt">${ZORLUK_ACIKLAMA} “Ortalama öğrenci”, aynı soruların sınava girenlerce çözülme oranıdır; öğrencinin başarısı bunun üstündeyse o dilimde grubun önündedir. Bütün öğrencilerin karşılaştırması <a href="#/zorluk">Zorluk</a> sayfasında.</p></div>`;
    return html;
  }

  function ogrenciKazanimGecmisi(hs, no, sorgu) {
    const dersler = [];
    hs.forEach(x => x.sinav.dersler.forEach(d => { if (Array.isArray(d.kazanim) && d.kazanim.some(k => k && k.length) && !dersler.some(z => z.id === d.id)) dersler.push({ id: d.id, ad: d.ad }); }));
    let html = `<div class="kart"><b>Kazanım geçmişi</b>`;
    if (!dersler.length) return html + '<p class="alt">Bu öğrencinin girdiği sınavlarda kazanım yüklenmiş ders yok.</p></div>';
    const dersId = dersler.some(d => d.id === sorgu.kders) ? sorgu.kders : dersler[0].id;
    const kodlu = sorgu.kaz !== 'ayri';
    const G = kazanimGruplari(hs.flatMap(x => x.sinav.dersler.filter(d => d.id === dersId).flatMap(d => (d.kazanim || []).flat())));
    const k = M.kazanimGecmisi(hs, no, dersId, kodlu ? G.grupla : null);
    const ad = kodlu ? G.etiket : kazanimAd, ipucu = kodlu ? G.ipucu : kazanimAd;
    const zayifMi = sorgu.kf === 'zayif';
