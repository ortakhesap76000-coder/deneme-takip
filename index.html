    const liste = k.kazanimlar.filter(e => !zayifMi || (e.basari != null && e.basari < ESIK.zayif))
      .sort((a, b) => (a.basari ?? 2) - (b.basari ?? 2) || (b.grupBasari ?? 0) - (a.grupBasari ?? 0));
    html += ` <div class="satir" style="margin:6px 0"><span><label class="alt">Ders</label> <select data-is="k-ders">${dersler.map(d => `<option value="${h(d.id)}" ${d.id === dersId ? 'selected' : ''}>${h(d.ad)}</option>`).join('')}</select></span>
      <span><label class="alt">Gösterim</label> <select data-is="kaz-gosterim"><option value="">Öğrenme çıktısına göre (kod)</option><option value="ayri" ${kodlu ? '' : 'selected'}>Her alt madde ayrı</option></select></span>
      <span><select data-is="k-filtre"><option value="">Bütün kazanımlar</option><option value="zayif" ${zayifMi ? 'selected' : ''}>Yalnız %50 altı</option></select></span></div>`;
    if (!k.sinavlar.length) return html + '<p class="alt">Bu derste öğrencinin A kitapçığıyla girdiği kazanımlı sınav yok.</p></div>';
    const tekrar = k.kazanimlar.filter(e => Object.keys(e.sinav).length > 1).length;
    html += `<p class="alt">${k.kazanimlar.length} kazanım, ${k.sinavlar.length} sınav; ${tekrar} kazanım birden çok sınavda soruldu. Tarih sütunları: o sınavdaki soruları, ✓ doğru · ✗ yanlış · ○ boş (dörtten çok soruda doğru/soru); üzerine gelince soru numaraları görünür.</p>`;
    html += `<div class="tablo-kap"><table class="gecmis"><thead><tr><th class="sol sirala">Kazanım</th><th class="sirala">Doğru</th><th class="sirala">Başarı</th><th class="sirala" title="aynı sorularda sınava girenlerin doğru oranı">Sınava girenler</th>${k.sinavlar.map(s => `<th title="${h(s.ad)}">${h(kisaTarih(s.tarih))}</th>`).join('')}</tr></thead><tbody>`;
    const IS = { d: '✓', y: '✗', b: '○' }, AD = { d: 'doğru', y: 'yanlış', b: 'boş' };
    liste.forEach(e => {
      html += `<tr><td class="sol kazanim-ad" title="${h(ipucu(e.kimlik))}">${h(ad(e.kimlik))}</td><td data-d="${e.t ? e.d / e.t : -1}">${e.d}/${e.t}</td><td data-d="${e.basari ?? -1}"><b class="${renkSinif(e.basari)}">${yuzde(e.basari)}</b></td><td data-d="${e.grupBasari ?? -1}">${yuzde(e.grupBasari)}</td>`;
      k.sinavlar.forEach(s => {
        const q = e.sinav[s.id];
        if (!q) { html += '<td></td>'; return; }
        const d = q.filter(x => x.sonuc === 'd').length;
        html += `<td class="z-${renkSinif(d / q.length)}" title="${h(s.ad + ': ' + q.map(x => `soru ${x.no} ${AD[x.sonuc]}`).join(' · '))}">${q.length <= 4 ? q.map(x => IS[x.sonuc]).join('') : `${d}/${q.length}`}</td>`;
      });
      html += '</tr>';
    });
    if (!liste.length) html += `<tr><td class="sol alt" colspan="${k.sinavlar.length + 4}">%50 altında kazanım yok.</td></tr>`;
    html += `</tbody></table></div><p class="alt">${kodlu ? 'Aynı koddaki kazanımlar (alt maddeler ve farklı yayınların aynı kodlu kazanımları) tek satırda toplanır. Kod yazımı farklıysa (ör. eski müfredatın M.9.1.2.1’i ile yeni MAT.9.1.2) ayrı satırda kalır.' : 'Her kazanım metni ayrı satırda; yalnız birebir aynı metin sınavlar arasında birleşir.'} Yalnız A kitapçığıyla girilen sınavlar sayılır.</p></div>`;
    return html;
  }

  function gorZorluk(sorgu) {
    if (!durum.sinavlar.length) return bosEkran();
    const sevler = [...new Set(durum.sinavlar.map(s => s.seviye).filter(Boolean))].sort((a, b) => a - b);
    const sev = sevler.includes(Number(sorgu.seviye)) ? Number(sorgu.seviye) : (sevler.length ? sevler[sevler.length - 1] : null);
    const sinavlar = durum.sinavlar.filter(s => sev == null || s.seviye === sev);
    const dersler = [];
    sinavlar.forEach(s => s.dersler.forEach(d => { if (!d.elle && !dersler.some(x => x.id === d.id)) dersler.push({ id: d.id, ad: d.ad }); }));
    const dersId = dersler.some(d => d.id === sorgu.ders) ? sorgu.ders : '';
    const z = M.zorlukProfili(sinavlar.map(hesap), dersId || null);
    const siniflar = [...new Set(z.ogrenci.map(o => o.sinif).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
    const sinif = siniflar.includes(sorgu.sinif) ? sorgu.sinif : '';
    let html = `<div class="satir ayrik"><div><h1>Zorluk</h1><div class="alt">Soruların zorluğu ve her öğrencinin başarısının düştüğü eşik · ${sinavlar.length} sınav</div></div>
      <div class="satir">${sevler.length ? `<select data-is="seviye-sec">${sevler.map(v => `<option value="${v}" ${v === sev ? 'selected' : ''}>${v}. sınıf</option>`).join('')}</select>` : ''}
      <select data-is="ders-sec"><option value="">Bütün dersler</option>${dersler.map(d => `<option value="${h(d.id)}" ${d.id === dersId ? 'selected' : ''}>${h(d.ad)}</option>`).join('')}</select>
      ${siniflar.length > 1 ? `<select data-is="sinif-sec"><option value="">Bütün sınıflar</option>${siniflar.map(v => `<option ${v === sinif ? 'selected' : ''}>${h(v)}</option>`).join('')}</select>` : ''}</div></div>`;
    if (!z.ogrenci.length) return html + '<div class="bilgi">Zorluk hesaplanacak kadar kâğıt yok (bir derse en az 8 kişi girmeli).</div>';
    html += `<p class="alt">${ZORLUK_ACIKLAMA} Dilimler: ${DILIM_AD.map((a, i) => `${a.toLocaleLowerCase('tr')} ${DILIM_ARALIK[i]}`).join(' · ')}. Eşik: öğrencinin başarısının %50’nin altına indiği çözülme oranı (yalnız en az beş sorulu dilimler); düşük eşik, daha zor sorulara kadar dayandığını gösterir.</p>`;

    // öğrenciler
    const ogr = z.ogrenci.filter(o => !sinif || o.sinif === sinif).sort((a, b) => esikSira(b) - esikSira(a) || String(a.no).localeCompare(String(b.no), 'tr', { numeric: true }));
    const cok = siniflar.length > 1;
    html += `<h2>Öğrenciler</h2><div class="tablo-kap"><table><thead><tr><th class="sol sirala">Öğrenci</th>${cok ? '<th class="sol sirala">Sınıf</th>' : ''}${DILIM_AD.map((a, i) => `<th class="sirala" title="çözülme oranı ${DILIM_ARALIK[i]}">${a}</th>`).join('')}<th class="sirala">Toplam</th><th class="sirala" title="başarının %50’nin altına indiği çözülme oranı">Eşik</th></tr></thead><tbody>`;
    const ort = M.ZORLUK_DILIM.map(() => ({ d: 0, t: 0, pt: 0 }));
    ogr.forEach(o => {
      o.dilim.forEach((x, i) => { ort[i].d += x.d; ort[i].t += x.t; ort[i].pt += x.pt; });
      html += `<tr class="tik" data-git="#/ogrenci/${encodeURIComponent(o.no)}"><td class="sol">${h(ogrEtiket(o.no))}</td>${cok ? `<td class="sol">${h(o.sinif || '')}</td>` : ''}${o.dilim.map(x => { const b = x.t ? x.d / x.t : null; return `<td class="z-${renkSinif(b)}" data-d="${b ?? -1}" title="${x.d}/${x.t}">${b == null ? '' : Math.round(b * 100)}</td>`; }).join('')}<td data-d="${o.basari ?? -1}">${yuzde(o.basari)}</td><td data-d="${esikSira(o)}" style="white-space:nowrap">${esikKisa(o)}</td></tr>`;
    });
    html += `</tbody><tfoot><tr><td class="sol"><b>Ortalama</b></td>${cok ? '<td></td>' : ''}${ort.map(x => `<td><b>${x.t ? Math.round(x.d / x.t * 100) : ''}</b></td>`).join('')}<td></td><td></td></tr></tfoot></table></div><p class="alt">Hücre: o dilimdeki sorulardan çözdüğü oran (%). Satıra tıklayınca öğrencinin sayfası açılır. Eşik sütununda “inmiyor”: hesaba giren en zor dilimde bile yarıdan fazlası; “en kolayda”: en kolay dilimde bile yarıdan azı.</p>`;

    // denemeler
    html += `<h2>Denemeler, zordan kolaya</h2><div class="tablo-kap"><table><thead><tr><th class="sol">Sınav</th><th class="sol">Tarih</th><th>Soru</th><th class="sirala">Ortalama çözülme</th>${DILIM_AD.map(a => `<th title="bu dilimdeki soru sayısı">${a}</th>`).join('')}</tr></thead><tbody>`;
    z.sinavlar.slice().sort((a, b) => a.ort - b.ort).forEach(s => {
      html += `<tr><td class="sol"><a href="#/sinav/${encodeURIComponent(s.id)}/sorular">${h(s.ad)}</a></td><td class="sol">${tarihYaz(s.tarih)}</td><td>${s.soru}</td><td data-d="${s.ort}"><span class="cubuk-kap"><span class="cubuk" style="width:${s.ort * 100}%"></span></span> ${yuzde(s.ort)}</td>${s.dagilim.map(n => `<td>${n || ''}</td>`).join('')}</tr>`;
    });
    html += '</tbody></table></div><p class="alt">Ortalama çözülme: soruların sınava girenlerce çözülme oranlarının ortalaması. Aynı öğrenciler zamanla ilerlediği için sonraki bir deneme biraz kolay görünebilir; farklı sınıf düzeyleri karşılaştırılmaz.</p>';

    // en zor sorular
    const zor = z.sorular.slice().sort((a, b) => a.p - b.p || b.kisi - a.kisi).slice(0, 15);
    html += `<h2>En zor 15 soru</h2><div class="tablo-kap"><table><thead><tr><th class="sol">Sınav</th><th class="sol">Ders</th><th>Soru</th><th>Anahtar</th><th>Çözen</th><th title="en çok işaretlenen yanlış şık">Çoğunluğun yanlışı</th><th class="sol">Kazanım</th></tr></thead><tbody>`;
    let suphe = 0;
    zor.forEach(q => {
      const s = sinavBul(q.sinavId), d = s && s.dersler.find(x => x.id === q.dersId);
      html += `<tr><td class="sol"><a href="#/sinav/${encodeURIComponent(q.sinavId)}/sorular?ders=${encodeURIComponent(q.dersId)}">${h(s ? s.ad : q.sinavId)}</a></td><td class="sol">${h(d ? d.ad : q.dersId)}</td><td>${q.no}</td><td>${h(q.anahtar)}</td><td>${yuzde(q.p)} <span class="alt">(${Math.round(q.p * q.kisi)}/${q.kisi})</span></td><td>${q.yanlisSik ? `${q.yanlisSik} <span class="alt">(${q.yanlisN}/${q.kisi})</span>${anahtarSuphe(q) ? (suphe++, ' <b class="zayif" title="Çoğunluk aynı yanlış şıkta buluştu; cevap anahtarını kontrol edin.">⚠</b>') : ''}` : '–'}</td><td class="sol kazanim-ad" title="${h(q.kazanim.map(kazanimAd).join('\n'))}">${q.kazanim.length ? h(kisaKazanim(kazanimAd(q.kazanim[0]))) : '<span class="alt">–</span>'}</td></tr>`;
    });
    html += `</tbody></table></div><p class="alt">Soru numaraları A kitapçığına göredir.${suphe ? ' ⚠: sınava girenlerin yarısı ya da daha fazlası aynı yanlış şıkkı işaretlemiş. Bu, cevap anahtarı hatası da olabilir; kitapçıktan kontrol edin, gerekirse anahtarı düzeltin.' : ''}</p>`;
    return html;
  }

  /* ---------- karne ---------- */
  function karneSayfasi(s, x, satir) {
    const a = ayar();
    const no = satir.no;
    const g = M.ogrenciGelisimi(tumHesaplar(), no).filter(z => z.tarih <= s.tarih).slice(-6);
    const sinifO = x.siniflar[satir.sinif];
    const cok = Object.keys(x.siniflar).length > 1;
    let html = `<div class="karne karne-sayfa"><div class="bas"><div><h1>${h(ogrAd(no) || 'Okul No ' + no)}</h1><div class="kucuk">${ogrAd(no) ? `Okul no ${h(no)} · ` : ''}Sınıf ${h(satir.sinif)}</div></div><div style="text-align:right"><b>${h(s.ad)}</b><div class="kucuk">${tarihYaz(s.tarih)}</div></div></div>`;
    html += `<table><thead><tr><th class="sol">Ders</th><th>Soru</th><th>Doğru</th><th>Yanlış</th><th>Boş</th><th>Net</th>${cok ? '<th>Sınıf ort.</th><th>Genel ort.</th>' : '<th>Ortalama</th>'}</tr></thead><tbody>`;
    s.dersler.forEach(d => {
      const p = satir.dersler[d.id]; if (!p) return;
      const so = sinifO && sinifO.dersler[d.id], go = x.genel.dersler[d.id];
      html += `<tr><td class="sol">${h(d.ad)}</td><td>${d.soru}</td><td>${p.d}</td><td>${p.y}</td><td>${p.b}</td><td><b class="${so ? (p.net >= so.net ? 'iyi' : 'zayif') : ''}">${sayi(p.net)}</b></td><td>${so ? sayi(so.net) : '–'}</td>${cok ? `<td>${go ? sayi(go.net) : '–'}</td>` : ''}</tr>`;
    });
    html += `<tr><td class="sol"><b>Toplam</b></td><td>${s.dersler.filter(d => satir.dersler[d.id]).reduce((t, d) => t + d.soru, 0)}</td><td>${Object.values(satir.dersler).reduce((t, p) => t + p.d, 0)}</td><td>${Object.values(satir.dersler).reduce((t, p) => t + p.y, 0)}</td><td>${Object.values(satir.dersler).reduce((t, p) => t + p.b, 0)}</td><td><b>${sayi(satir.toplam)}</b></td><td>${sinifO ? sayi(sinifO.toplam) : '–'}</td>${cok ? `<td>${sayi(x.genel.toplam)}</td>` : ''}</tr></tbody></table>`;
    if (a.karnePuan) {
      const P = puanlar(x), py = puanYazi(P, P.ogrenci.get(String(no)));
      if (py) html += `<p class="kucuk">${P.tur === 'ara' ? 'Yaklaşık TYT puanı' : 'Tahmini puan'}: <b>${py.replace(/^TYT ≈ /, '')}</b> <span style="color:#777">(${P.tur === 'ara' ? 'ÖSYM yöntemiyle, bu sınavdaki netlerin TYT karşılığı' : 'bu denemeye göre, ÖSYM yöntemiyle'}; OBP hariç)</span></p>`;
    }
    if (a.karneSira) html += `<p class="kucuk">Sıra: genel <b>${satir.sira} / ${x.satirlar.length}</b>${sinifO && cok ? ` · sınıf içi <b>${satir.sinifSira} / ${sinifO.kisi}</b>` : ''}</p>`;
    html += '<div class="ikili">';
    if (g.length > 1) {
      html += `<div><h2>Son sınavlarda gelişim (%)</h2>${cizgiGrafik({ etiketler: g.map(z => kisaTarih(z.tarih)), yuzdeMi: true, yuks: 180, seriler: [
        { ad: 'Öğrenci', renk: '#2759c4', kalin: true, degerler: g.map(z => z.basari) },
        { ad: 'Sınıf ort.', renk: '#888', kesik: true, degerler: g.map(z => z.sinifBasari) }] })}</div>`;
    }
    if (a.karneSoruDokumu) {
      html += '<div><h2>Tekrar edilecek sorular</h2>';
      s.dersler.forEach(d => {
        const c = satir.kagit.cevap && satir.kagit.cevap[d.id]; if (c == null) return;
        const an = M.dersAnahtari(d, satir.kagit.kitapcik);
        const yanlis = [], bos = [];
        for (let i = 0; i < d.soru; i++) { const k = an[i] || ''; if (!k || k === 'X') continue; const ch = c[i] || '-'; if (ch === '-') bos.push(i + 1); else if (ch === '*' || k.indexOf(ch) < 0) yanlis.push(i + 1); }
        html += `<p class="kucuk"><b>${h(d.ad)}</b> · yanlış: ${yanlis.length ? araliklar(yanlis) : 'yok'}${bos.length ? ` · boş: ${araliklar(bos)}` : ''}</p>`;
      });
      html += `<p class="kucuk">Soru numaraları ${h(satir.kagit.kitapcik || 'A')} kitapçığına göredir.</p></div>`;
    }
    html += '</div>';
    if (a.karneKazanim) {
      const bloklar = [];
      s.dersler.forEach(d => {
        const k = kazanimAnalizi(x, d.id); if (!k || !k.kazanimlar.length) return;
        const o = k.ogrenci.find(z => String(z.no) === String(no)); if (!o) return;
        // Karnede kazanımın kısa başlığı yazılır ("|" sonrası alt maddeler atılır); aynı başlıklar birleşir
        const grup = new Map();
        k.kazanimlar.filter(e => o.basari[e.kimlik] != null && o.basari[e.kimlik] < ESIK.zayif).forEach(e => {
          const ad = kisaKazanim(kazanimAd(e.kimlik));
          const g = grup.get(ad) || { ad, basari: 1, sorular: new Set() };
          g.basari = Math.min(g.basari, o.basari[e.kimlik]); e.sorular.forEach(n => g.sorular.add(n));
          grup.set(ad, g);
        });
        const zayif = [...grup.values()].sort((p, q) => p.basari - q.basari || Math.min(...p.sorular) - Math.min(...q.sorular)).slice(0, 4); // A4 tek sayfaya sığsın
        if (zayif.length) bloklar.push(`<p class="kucuk"><b>${h(d.ad)}</b></p><ul class="kucuk" style="margin:0 0 6px;padding-left:18px">${zayif.map(e => `<li title="${h(e.ad)}"><span style="color:#777">soru ${araliklar([...e.sorular].sort((a, b) => a - b))} ·</span> ${h(e.ad)}</li>`).join('')}</ul>`);
      });
      if (bloklar.length) html += `<h2>Çalışılması gereken kazanımlar</h2>${bloklar.join('')}`;
    }
    html += '</div>';
    return html;
  }

  function gorKarne(sinavId, kim, sorgu) {
    const s = sinavBul(sinavId);
    if (!s) return '<p>Sınav bulunamadı.</p>';
    const x = hesap(s);
    const sinif = x.siniflar[sorgu.sinif] ? sorgu.sinif : '';
    const satirlar = kim === 'hepsi' ? x.satirlar.filter(r => !sinif || r.sinif === sinif).slice().sort((a, b) => String(a.no).localeCompare(String(b.no), 'tr', { numeric: true })) : x.satirlar.filter(r => String(r.no) === String(kim));
    const a = ayar();
    let html = `<div class="satir ayrik yazdirma-yok" style="margin-bottom:12px"><div><div class="alt"><a href="#/sinav/${encodeURIComponent(s.id)}">${h(s.ad)}</a> ›</div><h1>Karne${kim === 'hepsi' ? 'ler' : ''}</h1><div class="alt">${satirlar.length} sayfa · PDF için yazdır penceresinde “PDF olarak kaydet” seçin.</div></div>
      <div class="satir">${kim === 'hepsi' ? sinifSecici(x, sinif) : ''}
      <label class="alt"><input type="checkbox" data-ayar="karneSira" ${a.karneSira ? 'checked' : ''}> Sıra</label>
      <label class="alt"><input type="checkbox" data-ayar="karnePuan" ${a.karnePuan ? 'checked' : ''}> Puan</label>
      <label class="alt"><input type="checkbox" data-ayar="karneKazanim" ${a.karneKazanim ? 'checked' : ''}> Kazanımlar</label>
      <label class="alt"><input type="checkbox" data-ayar="karneSoruDokumu" ${a.karneSoruDokumu ? 'checked' : ''}> Soru dökümü</label>
      <button class="ana" data-is="yazdir">Yazdır / PDF</button></div></div>`;
    if (!satirlar.length) return html + `<p>${kim === 'hepsi' ? 'Bu sınavda öğrenci yok.' : 'Bu öğrenci bu sınava girmemiş.'}</p>`;
    if (satirlar.some(r => !ogrAd(r.no))) html += `<div class="bilgi uyari yazdirma-yok">Bazı öğrencilerin adı yok; karnede okul numarası yazar. Adlar öğrenci sayfasından ya da adlı aktarımla eklenir.</div>`;
    html += satirlar.map(r => karneSayfasi(s, x, r)).join('');
    return html;
  }

  /* ---------- sınıf ekranı (isimsiz, numaralı) ---------- */
  function gorTahta(sinavId, sorgu) {
    const s = sinavBul(sinavId);
    if (!s) return '<p>Sınav bulunamadı.</p>';
    const x = hesap(s);
    const a = ayar();
    const sinif = x.siniflar[sorgu.sinif] ? sorgu.sinif : '';
    const kisi = Number(sorgu.kisi || a.tahtaKisi);
    const satirlar = x.satirlar.filter(r => !sinif || r.sinif === sinif);
    const sira = sinif ? (r) => r.sinifSira : (r) => r.sira;
    const ust = satirlar.filter(r => sira(r) <= kisi);
    let html = `<div class="satir ayrik yazdirma-yok"><div class="alt"><a href="#/sinav/${encodeURIComponent(s.id)}">${h(s.ad)}</a> ›</div>
      <div class="satir">${sinifSecici(x, sinif)}<label class="alt">İlk</label> <select data-is="tahta-kisi">${[3, 5, 7, 10].map(n => `<option ${n === kisi ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <label class="alt"><input type="checkbox" data-ayar="tahtaDersler" ${a.tahtaDersler ? 'checked' : ''}> Ders netleri</label>
      <button data-is="tam-ekran">Tam ekran</button></div></div>`;
    html += `<div class="tahta"><h1>${h(s.ad)}</h1><p class="alt">${tarihYaz(s.tarih)}${sinif ? ' · ' + h(sinif) : ''} · ilk ${kisi}</p>
      <div class="tablo-kap"><table><thead><tr><th>Sıra</th><th>Okul No</th>${a.tahtaDersler ? s.dersler.map(d => `<th>${h(d.ad)}</th>`).join('') : ''}<th>Toplam Net</th></tr></thead><tbody>`;
    ust.forEach(r => { html += `<tr><td><b>${sira(r)}</b></td><td>${h(r.no)}</td>${a.tahtaDersler ? s.dersler.map(d => `<td>${r.dersler[d.id] ? sayi(r.dersler[d.id].net) : '–'}</td>`).join('') : ''}<td><b>${sayi(r.toplam)}</b></td></tr>`; });
    html += `</tbody></table></div><p class="alt">Sınıf ortalaması ${sayi(((sinif && x.siniflar[sinif]) || x.genel).toplam)} net · ${satirlar.length} öğrenci</p></div>`;
    return html;
  }

  /* ---------- elle sonuç ---------- */
  const STANDART_DERSLER = [['Türkçe', 30], ['Sosyal Bilimler', 30], ['Matematik', 30], ['Fen Bilimleri', 30]];

  function gorElle(sorgu) {
    const taslak = durum.elleTaslak;
    if (!taslak) {
      const simdi = new Date(), bugun = new Date(simdi - simdi.getTimezoneOffset() * 60000).toISOString().slice(0, 10); // yerel gün
      return `<h1>Elle sonuç girişi</h1><p class="alt">TestPlus’ta okutulmamış bir denemenin doğru ve yanlış sayılarını öğrenci öğrenci girersiniz. Soru ve kazanım analizi bu sınavlarda yapılamaz; sıralama, ortalama, gelişim ve karne çalışır.</p>
      <div class="kart" id="elle-form"><div class="izgara" style="grid-template-columns:repeat(auto-fill,minmax(220px,1fr))">
        <label>Sınav adı<br><input type="text" name="ad" style="width:100%" placeholder="Yayın - Sınav adı"></label>
        <label>Tarih<br><input type="date" name="tarih" value="${bugun}"></label>
        <label>Sınıf düzeyi<br><select name="seviye">${[9, 10, 11, 12].map(v => `<option>${v}</option>`).join('')}</select></label>
        <label>Yanlış götürme<br><select name="ceza"><option value="4">4 yanlış 1 doğruyu götürür</option><option value="0">Götürmez</option></select></label>
      </div><h2>Dersler ve soru sayıları</h2><div class="satir">${STANDART_DERSLER.map(([d, n], i) => `<label class="kart" style="margin:0;padding:8px 10px"><input type="checkbox" name="d${i}" checked> ${d} <input type="number" name="n${i}" value="${n}" min="1" max="60"></label>`).join('')}</div>
      <h2>Öğrenciler</h2><p class="alt">Listedeki öğrencilerden sınıf seçin; gerekirse okul numarası ekleyin.</p>
      <div class="satir"><select name="sinif"><option value="">Sınıf seçin</option>${[...new Set(durum.ogrenciler.map(o => o.sinif).filter(Boolean))].sort().map(s => `<option>${h(s)}</option>`).join('')}</select>
      <input type="text" name="ekno" placeholder="Ek okul no (virgülle)"></div>
      <p><button class="ana" data-is="elle-basla">Giriş tablosunu aç</button></p></div>`;
    }
    const s = taslak;

      <div class="satir"><button data-is="elle-vazgec">Vazgeç</button><button class="ana" data-is="elle-kaydet">Sınavı kaydet</button></div></div>
      <div class="tablo-kap"><table id="elle-tablo"><thead><tr><th class="sol">No</th><th class="sol">Ad</th>${s.dersler.map(d => `<th>${h(d.ad)} D</th><th>Y</th>`).join('')}<th>Toplam net</th></tr></thead><tbody>`;
    s.kagitlar.forEach((k, i) => {
      html += `<tr data-i="${i}"><td class="sol">${h(k.no)}</td><td class="sol">${h(ogrAd(k.no))}</td>${s.dersler.map(d => { const v = k.elle[d.id] || ['', '']; return `<td><input type="number" min="0" max="${d.soru}" data-d="${d.id}" data-f="0" value="${v[0] ?? ''}"></td><td><input type="number" min="0" max="${d.soru}" data-d="${d.id}" data-f="1" value="${v[1] ?? ''}"></td>`; }).join('')}<td class="vurgu" data-toplam></td></tr>`;
    });
    html += '</tbody></table></div><p class="alt">Boş bırakılan satırlar sınava katılmamış sayılır. Sekme tuşuyla hücreler arasında ilerleyin.</p>';
    return html;
  }

  function elleToplamGuncelle() {
    const s = durum.elleTaslak; if (!s) return;
    document.querySelectorAll('#elle-tablo tbody tr').forEach(tr => {
      const k = s.kagitlar[tr.dataset.i]; let t = 0, var_ = false, hata = false;
      s.dersler.forEach(d => {
        const v = k.elle[d.id];
        if (elleGirildi(v)) { var_ = true; const dd = dolu(v[0]) ? +v[0] : 0, yy = dolu(v[1]) ? +v[1] : 0; if (elleGecersiz(dd, yy, d.soru)) hata = true; t += dd - (s.ceza ? yy / s.ceza : 0); }
      });
      const c = tr.querySelector('[data-toplam]');
      c.textContent = var_ ? (hata ? 'geçersiz değer' : sayi(t)) : '';
      c.className = hata ? 'zayif' : 'vurgu';
    });
  }

  /* ---------- optik okuma (Aşama 2) ---------- */
  const Op = window.Optik;
  const optikBul = (id) => (durum.optik || []).find(o => o.id === id);
  const yerelGun = () => { const s = new Date(); return new Date(s - s.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  // Bu cihazda okunan kâğıtlar (DB 'okuma'): sınav verisinden ayrı durur, telefondan dosya olarak gönderilir
  let okuma = { formlar: [] };
  // kâğıt kimliği → { dosya, nokta }: kontrol ekranındaki kesitler için, yalnız bu oturumda (fotoğraf saklanmaz)
  const fotolar = new Map();
  async function okumaKaydet() {
    try { await DB.koy('okuma', okuma); return true; } catch (e) { console.error(e); bildir('Okunan kâğıtlar kaydedilemedi: ' + (e && e.message)); return false; }
  }

  /* Anahtarı tamam ve kâğıdı olan optik sınav sınavlara katılır (yeniden katılırsa güncellenir); değilse sonuç ekranlarından çekilir.
   * Koçun sonuç ekranındaki seçimleri (puan türü, TYT eşi) optik kayıtta da tutulur: yayın geçici çekilse de kaybolmaz. */
  function optikYayinla(op) {
    const eski = durum.sinavlar.find(s => s.id === op.id);
    if (eski) {
      const ayar = {};
      for (const k of ['puanTuru', 'tytEsi']) if (eski[k] != null) ayar[k] = eski[k];
      op.yayinAyar = ayar;
    }
    if (Op.anahtarEksik(op).length || !op.kagitlar.length) { durum.sinavlar = durum.sinavlar.filter(s => s.id !== op.id); hayaletTemizle(); return; }
    // listede olmayan numara sınıfsız öğrenci olarak eklenir; kâğıdı kalmayınca hayaletTemizle siler
    const yeniOgr = [...new Set(op.kagitlar.map(k => k.no))].filter(no => !ogrenci(no)).map(no => ({ no, sinif: '', optik: true }));
    const ayar = op.yayinAyar || {};
    const yayin = Op.optikYayini(op, no => (ogrenci(no) || {}).sinif);
    for (const k of ['puanTuru', 'tytEsi']) if (ayar[k] != null) yayin[k] = ayar[k];
    const kazanimlar = Object.entries(op.kazanimAd || {}).map(([id, ad]) => ({ id, ad }));
    durum = M.birlestir(durum, { sinavlar: [yayin], ogrenciler: yeniOgr, kazanimlar }).durum;
    hayaletTemizle();
  }
  function optikHepsiniYayinla() { for (const o of durum.optik || []) if (o && Array.isArray(o.dersler) && Array.isArray(o.kagitlar)) optikYayinla(o); }
  // optik okumanın eklediği adsız, sınıfsız öğrenci hiçbir sınavda kâğıdı kalmayınca silinir
  function hayaletTemizle() {
    const kullanilan = new Set(durum.sinavlar.flatMap(s => s.kagitlar.map(k => String(k.no))));
    durum.ogrenciler = durum.ogrenciler.filter(o => !o.optik || o.ad || o.sinif || kullanilan.has(String(o.no)));
  }
  // okuma formunun bu cihazdaki optik sınavı (kod ve soru sayıları tutmalı)
  const okumaSinavi = (f) => (durum.optik || []).find(o => Op.formKodu(o.id) === f.kod && (o.secenek || 5) === f.secenek && o.dersler.map(d => d.soru).join() === f.sorular.join());
  const kontrolKalan = (k) => (k.supheli || []).filter(s => s.secim == null).length;
  const sinifiBilinmeyen = (nolar) => durum.ogrenciler.some(o => o.sinif) ? nolar.filter(no => no !== Op.ANAHTAR_NO && !((ogrenci(no) || {}).sinif)) : [];

  function dersSatirlari(liste) {
    return liste.map(([ad, soru]) => `<div class="satir optik-ders"><input type="text" data-alan="ad" value="${h(ad)}" placeholder="Ders adı"><input type="number" data-alan="soru" min="1" max="63" value="${soru}" style="width:80px"> soru <button data-is="optik-ders-sil" title="Dersi çıkar" aria-label="Dersi çıkar">×</button></div>`).join('');
  }

  function gorOptik() {
    const liste = (durum.optik || []).slice().sort((a, b) => String(b.tarih).localeCompare(String(a.tarih)));
    let html = `<div class="satir ayrik"><div><h1>Optik okuma</h1><div class="alt">Sınavın formunu buradan basın, doldurulan kâğıtları telefonla okuyun. Fotoğraflar telefonda işlenir; hiçbir yere gönderilmez.</div></div>
      <a href="#/oku"><button class="ana">Kâğıt oku</button></a></div>`;
    if (liste.length) {
      html += `<div class="tablo-kap"><table><thead><tr><th class="sol">Tarih</th><th class="sol">Sınav</th><th>Ders</th><th>Soru</th><th>Kâğıt</th><th class="sol">Cevap anahtarı</th></tr></thead><tbody>`;
      for (const o of liste) {
        const e = Op.anahtarEksik(o).reduce((t, x) => t + x.eksik, 0);
        html += `<tr class="tik" data-git="#/optik/${encodeURIComponent(o.id)}"><td class="sol" data-d="${h(o.tarih)}">${tarihYaz(o.tarih)}</td><td class="sol">${h(o.ad)}</td><td>${o.dersler.length}</td><td>${h(dersSoru(o))}</td><td>${o.kagitlar.length}</td><td class="sol">${e ? `<span class="rozet uyari">${e} soru eksik</span>` : '<span class="rozet">tamam</span>'}</td></tr>`;
      }
      html += '</tbody></table></div>';
    }
    html += `<div class="kart" id="optik-form"><h2 style="margin-top:0">Yeni optik sınav</h2><div class="izgara" style="grid-template-columns:repeat(auto-fill,minmax(210px,1fr))">
      <label>Sınav adı<br><input type="text" name="ad" style="width:100%" placeholder="Yayın - Sınav adı"></label>
      <label>Tarih<br><input type="date" name="tarih" value="${yerelGun()}"></label>
      <label>Sınıf düzeyi<br><select name="seviye">${[9, 10, 11, 12].map(v => `<option ${v === 12 ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label>Yanlış götürme<br><select name="ceza"><option value="4">4 yanlış 1 doğruyu götürür</option><option value="0">Götürmez</option></select></label>
      <label>Şık sayısı<br><select name="secenek"><option value="5">5 (A–E)</option><option value="4">4 (A–D)</option></select></label>
      <label>Kitapçık<br><select name="kitapcikB"><option value="">Tek kitapçık</option><option value="1">A ve B kitapçığı</option></select></label>
      </div>
      <h2>Dersler</h2><div class="satir"><select data-is="optik-sablon" aria-label="Ders düzeni"><option value="tyt">TYT düzeni</option><option value="ayt">AYT düzeni</option><option value="ara">Ara sınıf (4 ders)</option></select><span class="alt">Ders adlarını ve soru sayılarını sınavın kitapçığına göre düzeltin; sıra formdaki sıradır.</span></div>
      <div id="optik-dersler">${dersSatirlari(Op.SABLONLAR.tyt)}</div>
      <div class="satir"><button data-is="optik-ders-ekle">Ders ekle</button><span class="alt" id="optik-sigma"></span></div>
      <p><button class="ana" data-is="optik-olustur">Sınavı oluştur</button></p></div>`;
    return html;
  }

  function optikGirdi() {
    const f = $('#optik-form');
    const v = (n) => f.querySelector(`[name="${n}"]`).value;
    const dersler = [...f.querySelectorAll('.optik-ders')].map(r => ({ ad: r.querySelector('[data-alan="ad"]').value, soru: Number(r.querySelector('[data-alan="soru"]').value) }));
    return { ad: v('ad'), tarih: v('tarih'), seviye: Number(v('seviye')), ceza: Number(v('ceza')), secenek: Number(v('secenek')), kitapcikB: !!v('kitapcikB'), dersler };
  }
  function optikSigmaGuncelle() {
    const e = $('#optik-sigma'); if (!e) return;
    const g = optikGirdi();
    const sorular = g.dersler.map(d => d.soru);
    const d = sorular.length && sorular.every(n => Number.isInteger(n) && n >= 1) ? Op.formDuzeni({ secenek: g.secenek, sorular }) : { hata: 'Soru sayılarını girin.' };
    if (d.hata) { e.textContent = d.hata; e.className = 'zayif'; return; }
    const satir = d.kabarcik.length + d.basliklar.length;
    e.textContent = `${sorular.reduce((a, b) => a + b, 0)} soru; form tek sayfaya sığıyor (${satir} / ${d.sutun * d.satir} satır).`;
    e.className = 'alt';
  }
  let olusturuyor = false;
  async function optikOlustur() {
    if (olusturuyor) return;
    const r = Op.optikSinav(optikGirdi());
    if (r.hata) return bildir(r.hata);
    durum.optik = [...(durum.optik || []), r.sinav];
    olusturuyor = true;
    let tamam;
    try { tamam = await kaydet(); } finally { olusturuyor = false; }
    if (!tamam) { durum.optik = durum.optik.filter(o => o !== r.sinav); return; }
    location.hash = '#/optik/' + encodeURIComponent(r.sinav.id);
    bildir('Optik sınav oluşturuldu. Formu yazdırıp cevap anahtarını girin.');
  }

  let optikRapor = '';
  function gorOptikSinav(id) {
    const o = optikBul(id);
    if (!o) return '<p>Optik sınav bulunamadı. <a href="#/optik">Optik okumaya dön</a></p>';
    const enc = encodeURIComponent(o.id);
    const eksik = Op.anahtarEksik(o);
    const yayinda = durum.sinavlar.some(s => s.id === o.id);
    const rapor = optikRapor; optikRapor = '';
    let html = `<div class="satir ayrik"><div><div class="alt"><a href="#/optik">Optik okuma</a> ›</div><h1>${h(o.ad)}</h1>
      <div class="alt">${tarihYaz(o.tarih)}${o.seviye ? ' · ' + h(o.seviye) + '. sınıf' : ''} · ${o.dersler.map(d => `${h(d.ad)} ${h(d.soru)}`).join(', ')} soru · ${h(o.secenek)} şık · ${o.kitapcikB ? 'A ve B kitapçığı' : 'tek kitapçık'} · ${o.ceza ? h(o.ceza) + ' yanlış 1 doğruyu götürür' : 'yanlış doğruyu götürmez'}</div></div>
      <div class="satir"><a href="#/optik/${enc}/form"><button>Formu yazdır</button></a><a href="#/oku"><button>Kâğıt oku</button></a>${yayinda ? `<a href="#/sinav/${enc}"><button class="ana">Sonuçlar</button></a>` : ''}</div></div>${rapor}`;
    if (!yayinda) html += `<div class="bilgi uyari" id="optik-yayin">${eksik.length ? `Sonuçlar cevap anahtarı tamamlanınca görünür (eksik: ${eksik.map(e => `${h(e.ders)}${o.kitapcikB ? ' ' + e.kitapcik : ''} ${e.eksik}`).join(', ')}).` : 'Cevap anahtarı tamam; kâğıtlar okununca sonuçlar görünür.'}</div>`;
    html += `<div class="kart"><b>Cevap anahtarı</b><p class="alt">Her dersin şıklarını sırayla yazın ya da yapıştırın: <code>ABCDE…</code> ya da <code>1-A 2-B …</code> (numara ve boşluklar atlanır). İptal soru <code>X</code>, iki doğru şık <code>[AB]</code>, henüz bilinmeyen <code>?</code>. Ya da bir formu anahtar olarak doldurun, okul numarasına <b>00000</b> kodlayıp öğrenci kâğıtlarıyla birlikte okutun.</p>`;
    for (const k of o.kitapcikB ? ['A', 'B'] : ['A']) {
      if (o.kitapcikB) html += `<h2>${k} kitapçığı</h2>`;
      html += '<div class="izgara anahtar">' + o.dersler.map(d => {
        const a = d.anahtar[k] || [];
        const n = a.filter(Boolean).length;
        return `<label>${h(d.ad)} <span class="${n === d.soru ? 'iyi' : 'alt'}" data-anahtar-durum>${n} / ${d.soru}${n === d.soru ? ' ✓' : ''}</span><br><input type="text" data-is="anahtar" data-op="${h(o.id)}" data-ders="${h(d.id)}" data-kit="${k}" value="${n ? h(Op.anahtarYazi(a)) : ''}" spellcheck="false" autocomplete="off" autocapitalize="characters"></label>`;
      }).join('') + '</div>';
    }
    html += '</div>' + kazanimKarti(o);
    if (o.kagitlar.length) {
      const x = yayinda ? hesap(sinavBul(o.id)) : null;
      const net = new Map(x ? x.satirlar.map(s => [String(s.no), s.toplam]) : []);
      const bilinmeyen = new Set(sinifiBilinmeyen(o.kagitlar.map(k => k.no)));
      const sirali = o.kagitlar.slice().sort((a, b) => a.no.localeCompare(b.no, 'tr', { numeric: true }));
      html += `<h2>Okunan kâğıtlar (${o.kagitlar.length})</h2><div class="tablo-kap"><table><thead><tr><th class="sol">Okul no</th><th class="sol">Ad</th>${o.kitapcikB ? '<th>Kitapçık</th>' : ''}<th>Boş</th><th>Çift işaret</th><th>Toplam net</th><th></th></tr></thead><tbody>`;
      for (const k of sirali) {
        const say = (c) => k.cevaplar.join('').split(c).length - 1;
        html += `<tr><td class="sol">${h(k.no)}</td><td class="sol">${h(ogrAd(k.no)) || (bilinmeyen.has(k.no) ? '<span class="rozet uyari">sınıfı bilinmiyor</span>' : '<span class="alt">–</span>')}</td>${o.kitapcikB ? `<td>${h(k.kitapcik)}${k.kitapcikBos ? ' <span class="rozet uyari">boş</span>' : ''}</td>` : ''}<td>${say('-')}</td><td>${say('*')}</td><td class="vurgu">${net.has(k.no) ? sayi(net.get(k.no)) : '–'}</td><td><button data-is="optik-kagit-sil" data-op="${h(o.id)}" data-no="${h(k.no)}">Sil</button></td></tr>`;
      }
      html += '</tbody></table></div>';
      if (bilinmeyen.size) html += `<p class="alt">“Sınıfı bilinmiyor”: numara öğrenci listesinde sınıfıyla yok; öğrenci numarasını yanlış kodlamış olabilir.</p>`;
    }
    html += `<p style="margin-top:24px"><button data-is="optik-sil" data-op="${h(o.id)}">Optik sınavı sil</button></p>`;
    return html;
  }

  // kazanım Excel'i seçildi, eşleme koçun onayını bekliyor: { opId, bolumler, tahmin, dosyalar }
  let kazanimTaslak = null;
  function kazanimKarti(o) {
    const t = kazanimTaslak && kazanimTaslak.opId === o.id ? kazanimTaslak : null;
    let html = '<div class="kart" id="kazanim-kart"><b>Kazanımlar</b>';
    if (t) {
      html += `<p class="alt">${h(t.dosyalar.join(', '))}: dosyadaki bölümleri sınavın dersleriyle eşleyin. Eşlenen dersin önceki kazanımlarının yerine geçer; “Alma” seçilen bölüm atlanır.</p>
        <div class="tablo-kap"><table><thead><tr><th class="sol">Dosyadaki bölüm</th><th>Kazanımlı soru</th><th class="sol">Sınavdaki ders</th></tr></thead><tbody>`;
      t.bolumler.forEach((b, i) => {
        html += `<tr><td class="sol">${h(b.ad)}${t.dosyalar.length > 1 ? `<div class="alt">${h(b.dosya)}</div>` : ''}</td><td>${b.girdiler.length}</td><td class="sol"><select data-is="kazanim-ders" data-i="${i}"><option value="-1">Alma</option>${o.dersler.map((d, j) => `<option value="${j}"${t.tahmin[i] === j ? ' selected' : ''}>${h(d.ad)} (${h(d.soru)} soru)</option>`).join('')}</select></td></tr>`;
      });
      html += `</tbody></table></div><div class="satir"><button class="ana" data-is="kazanim-uygula" data-op="${h(o.id)}">Kazanımları ekle</button><button data-is="kazanim-vazgec">Vazgeç</button></div>`;
    } else {
      const varMi = o.dersler.some(d => Op.kazanimSayisi(d));
      html += `<p class="alt">TestPlus’a yüklediğiniz kazanım Excel’ini seçin (No · Kazanım · Kazanım Grup). Tek dosyada bütün dersler ya da ders başına ayrı dosyalar olabilir; birkaç dosya birlikte seçilebilir. Soru sırası ${o.kitapcikB ? 'A kitapçığınındır' : 'kitapçıktakidir'}. Kazanım analizi sınavın Sonuçlar sayfasında görünür.</p>`;
      if (varMi) html += `<p>${o.dersler.map(d => { const n = Op.kazanimSayisi(d); return `${h(d.ad)} <span class="${n === d.soru ? 'iyi' : n ? 'alt' : 'zayif'}">${n} / ${h(d.soru)}${n === d.soru ? ' ✓' : ''}</span>`; }).join(' · ')}</p>`;
      html += `<div class="satir"><label class="dugme">Kazanım Excel’i seç<input type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" multiple data-is="kazanim-dosya" data-op="${h(o.id)}" class="gizli"></label>${varMi ? `<button data-is="kazanim-kaldir" data-op="${h(o.id)}">Kazanımları kaldır</button>` : ''}</div>`;
    }
    return html + '</div>';
  }
  async function kazanimDosyaSec(opId, dosyalar) {
    const o = optikBul(opId); if (!o || !dosyalar.length) return;
    const bolumler = [], sorun = [];
    for (const f of dosyalar) {
      try {
        const r = Op.kazanimBolumleri(await Op.xlsxSatirlar(await f.arrayBuffer()), f.name);
        if (r.hata) sorun.push(`${f.name}: ${r.hata}`); else bolumler.push(...r.bolumler);
      } catch (e) { console.error(e); sorun.push(`${f.name}: ${(e && e.message) || 'okunamadı'}`); }
    }
    kazanimTaslak = bolumler.length ? { opId, bolumler, tahmin: Op.kazanimDersTahmin(bolumler, o), dosyalar: dosyalar.map(f => f.name) } : null;
    if (sorun.length) optikRapor = `<div class="bilgi ${bolumler.length ? 'uyari' : 'hata'}">${sorun.map(h).join('<br>')}</div>`;
    yonlendir();
    const kart = $('#kazanim-kart'); if (kart) kart.scrollIntoView({ block: 'nearest' });
  }

  async function anahtarDegisti(t) {
    const o = optikBul(t.dataset.op); if (!o) return;
    const d = o.dersler.find(x => x.id === t.dataset.ders); if (!d) return;
    const r = Op.anahtarCoz(t.value, d.soru, o.secenek);
    const durumE = t.closest('label').querySelector('[data-anahtar-durum]');
    if (r.hata && (r.gecersiz || r.fazla)) {
      t.classList.add('hatali'); durumE.textContent = r.hata; durumE.className = 'zayif';
      return;
    }
    t.classList.remove('hatali');
    const dizi = r.dizi.concat(Array(d.soru - r.dizi.length).fill(''));

  /* --- telefonda okuma --- */
  function gorOku() {
    let html = `<h1>Kâğıt oku</h1><p class="alt">Kâğıdı düz ve aydınlık bir yere koyun; altı köşe karesi görünecek biçimde, yukarıdan ve yakından çekin. Fotoğraf bu cihazda okunur; hiçbir yere gönderilmez, saklanmaz.</p>
      <div class="satir oku-dugmeler"><label class="dugme ana">Fotoğraf çek<input type="file" accept="image/*" capture="environment" data-is="oku-dosya" class="gizli"></label><label class="dugme">Galeriden seç<input type="file" accept="image/*" multiple data-is="oku-dosya" class="gizli"></label></div>
      <div id="oku-ilerleme" aria-live="polite"></div>`;
    if (!okuma.formlar.length) return html + '<p class="alt">Henüz kâğıt okunmadı.</p>';
    for (const f of okuma.formlar) {
      const o = okumaSinavi(f);

        <div class="satir">${o ? `<button class="ana" data-is="oku-ekle" data-kod="${f.kod}">Sınava ekle</button>` : ''}<button ${o ? '' : 'class="ana"'} data-is="oku-gonder" data-kod="${f.kod}">Dosya olarak gönder</button><button data-is="oku-temizle" data-kod="${f.kod}">Listeyi temizle</button></div></div>
        <div class="tablo-kap"><table><thead><tr><th>Sıra</th><th class="sol">Okul no</th><th>Kitapçık</th><th class="sol">Durum</th></tr></thead><tbody>`;
      f.kagitlar.map((k, i) => [k, i]).reverse().forEach(([k, i]) => {
        const n = kontrolKalan(k);

          : !k.no ? '<span class="zayif">numara okunamadı</span>'
            : sayac[k.no] > 1 ? '<span class="zayif">aynı numara iki kez</span>'
              : n ? `<span class="zayif">${n} yer kontrol edilecek</span>` : '<span class="iyi">tamam ✓</span>';

      });
      html += '</tbody></table></div></div>';
    }
    return html;
  }

  async function goruntuAc(dosya, enCok = 2400) {
    const bmp = await createImageBitmap(dosya, { imageOrientation: 'from-image' });
    const k = Math.min(1, enCok / Math.max(bmp.width, bmp.height));
    const w = Math.round(bmp.width * k), yuk = Math.round(bmp.height * k);
    const c = document.createElement('canvas'); c.width = w; c.height = yuk;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.imageSmoothingQuality = 'high';
    x.drawImage(bmp, 0, 0, w, yuk);
    if (bmp.close) bmp.close();
    return { c, x, w, yuk };
  }

  function kagitEkle(r) {
    const t = r.tanim;
    let f = okuma.formlar.find(x => x.kod === t.kod && x.secenek === t.secenek && x.sorular.join() === t.sorular.join());
    if (!f) { f = { kod: t.kod, secenek: t.secenek, sorular: t.sorular.slice(), kagitlar: [] }; okuma.formlar.unshift(f); }
    const k = {
      id: 'k' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), no: r.no, kitapcik: r.kitapcik, kitapcikBos: r.kitapcikBos,
      cevaplar: r.cevaplar.slice(), supheli: r.supheli.map(s => ({ ...s })), zaman: Date.now(),
    };
    f.kagitlar.push(k); f.gonderildi = null;
    return k;
  }

  let okuyor = false;
  async function fotoOku(dosyalar) {
    if (!dosyalar.length) return;
    if (okuyor) return bildir('Önceki fotoğraf okunuyor; bitince yeniden deneyin.');
    okuyor = true;
    const ilerleme = (m) => { const e = $('#oku-ilerleme'); if (e) e.innerHTML = m; };
    const hatalar = []; let son = null, okunan = 0, kayitli = true;
    try {
      for (let i = 0; i < dosyalar.length; i++) {
        ilerleme(`<div class="bilgi">${dosyalar.length > 1 ? `${i + 1} / ${dosyalar.length} · ` : ''}Okunuyor…</div>`);
        await new Promise(r => setTimeout(r, 30)); // yazı ekrana çıksın
        try {
          const g = await goruntuAc(dosyalar[i]);
          const r = Op.formOku(Op.griyeCevir(g.x.getImageData(0, 0, g.w, g.yuk).data, g.w, g.yuk, 2400));
          if (r.hata) { hatalar.push(`${h(dosyalar[i].name)}: ${h(r.hata)}`); continue; }
          son = kagitEkle(r); okunan++;
          fotolar.set(son.id, { dosya: dosyalar[i], nokta: r.nokta });
        } catch (e) { console.error(e); hatalar.push(`${h(dosyalar[i].name)}: fotoğraf açılamadı (${h(e && e.message)}).`); }
      }
      if (okunan) kayitli = await okumaKaydet();
    } finally { okuyor = false; }
    if (dosyalar.length === 1 && son && kontrolKalan(son)) { location.hash = '#/oku/' + son.id; return; }
    yonlendir();
    if (hatalar.length) ilerleme(`<div class="bilgi hata"><b>Okunamadı:</b><br>${hatalar.join('<br>')}</div>`);
    if (son && kayitli) bildir(dosyalar.length === 1 ? `Okundu: okul no ${son.no || '?'}.` : `${okunan} kâğıt okundu.`);
  }

  const kagitBul = (id) => { for (const f of okuma.formlar) { const k = f.kagitlar.find(x => x.id === id); if (k) return { f, k }; } return null; };

  function gorKontrol(id) {
    const b = kagitBul(id);
    if (!b) return '<p>Kâğıt bulunamadı. <a href="#/oku">Kâğıt okumaya dön</a></p>';
    const { f, k } = b;
    const o = okumaSinavi(f);
    const adlar = o ? o.dersler.map(d => d.ad) : f.sorular.map((_, i) => `Ders ${i + 1}`);
    const foto = fotolar.has(id);
    const ikinci = k.no && k.no !== Op.ANAHTAR_NO && f.kagitlar.filter(x => x.no === k.no).length > 1;
    const noS = k.supheli.find(s => s.alan === 'no'), kitS = k.supheli.find(s => s.alan === 'kitapcik');
    let html = `<div class="satir ayrik"><div><div class="alt"><a href="#/oku">Kâğıt oku</a> ›</div><h1>Kâğıt kontrolü</h1>
      <div class="alt">${o ? h(o.ad) + ' · ' : ''}${foto ? 'Belirsiz yerler aşağıda; kâğıda bakarak doğru olanı seçin.' : 'Fotoğraf bu oturumda yok: kâğıda bakarak seçin ya da kâğıdı yeniden çekin.'}</div></div>
      <div class="satir"><button data-is="kontrol-sil" data-id="${id}">Kâğıdı sil</button><a href="#/oku"><button class="ana">Bitti</button></a></div></div>
      <div class="kart kontrol-ust"><div class="satir">
        <label>Okul no<br><input type="text" inputmode="numeric" maxlength="5" data-is="kontrol-no" data-id="${id}" value="${h(k.no)}" style="width:110px"></label>
        <div>Kitapçık<br>${['A', 'B'].map(c => `<button data-is="kontrol-kit" data-id="${id}" data-c="${c}" class="${!k.kitapcikBos && k.kitapcik === c ? 'secili' : ''}">${c}</button>`).join(' ')}</div></div>
        ${k.no === Op.ANAHTAR_NO ? '<p class="alt">Okul no 00000: bu kâğıt cevap anahtarı olarak alınır.</p>' : ''}
        ${noS && noS.secim == null ? `<p class="zayif">Okul numarası net okunamadı; kâğıttakiyle karşılaştırıp düzeltin. <button data-is="kontrol-no-onay" data-id="${id}">Numara doğru</button></p>` : ''}
        ${ikinci ? '<p class="zayif">Bu numara bu listede iki kez var; birini düzeltin ya da silin.</p>' : ''}
        ${kitS && kitS.secim == null ? '<p class="zayif">Kitapçık işareti belirsiz; kâğıda bakıp seçin.</p>' : ''}
        ${foto ? '<canvas class="kirpik" data-kirp="no"></canvas>' : ''}</div>`;
    const sorular = k.supheli.map((s, i) => [s, i]).filter(([s]) => s.alan === 'soru');
    if (sorular.length) html += `<h2>Belirsiz işaretler (${sorular.length})</h2>`;
    for (const [s, i] of sorular) {
      const c = k.cevaplar[s.ders][s.soru];
      html += `<div class="kart kontrol-soru${s.secim != null ? ' bitti' : ''}"><div class="satir ayrik"><b>${h(adlar[s.ders])} · ${s.soru + 1}. soru</b><span class="alt">${s.hiza ? 'kâğıt burada bükük' : ''}</span></div>
        ${foto ? `<canvas class="kirpik" data-kirp="${i}"></canvas>` : ''}
        <div class="satir secenekler">${[...Op.HARF.slice(0, f.secenek), '-', '*'].map(x => `<button data-is="kontrol-sec" data-id="${id}" data-i="${i}" data-c="${x}" class="${x === c ? 'secili' : ''}">${x === '-' ? 'Boş' : x === '*' ? 'Çift' : x}</button>`).join('')}</div></div>`;
    }
    if (sorular.length > 1) html += `<p><button data-is="kontrol-hepsi" data-id="${id}">Kalanları okunduğu gibi onayla</button></p>`;
    if (!sorular.length) html += '<p class="alt">Bu kâğıtta belirsiz işaret yok.</p>';
    return html;
  }

  // kontrol ekranındaki kesitler: fotoğraf bir kez açılır, her belirsiz yer sayfa düzleminde düz çizilir
  let kesitGoruntu = null;
  async function kesitleriCiz(id) {
    const ft = fotolar.get(id), b = kagitBul(id);
    if (!ft || !b) return;
    if (!kesitGoruntu || kesitGoruntu.id !== id) kesitGoruntu = { id, g: await goruntuAc(ft.dosya) };
    const duzen = Op.formDuzeni({ secenek: b.f.secenek, sorular: b.f.sorular });
    document.querySelectorAll('canvas[data-kirp]').forEach(cv => {
      const a = cv.dataset.kirp;
      const s = a === 'no' ? { alan: 'no' } : b.k.supheli[Number(a)];
      if (!s) return;
      const r = Op.kontrolAlani(duzen, s);
      const W = Math.min(520, Math.round((r.x1 - r.x0) * 9)), H = Math.round(W * (r.y1 - r.y0) / (r.x1 - r.x0));
      cv.width = W; cv.height = H;
      const [ax, ay] = ft.nokta(r.x0, r.y0), [bx, by] = ft.nokta(r.x1, r.y0), [cx, cy] = ft.nokta(r.x0, r.y1);
      // tuval → fotoğraf afin dönüşümü [a c; b d]; tuvale fotoğraftan tuvale (tersi) uygulanır
      const m = [(bx - ax) / W, (by - ay) / W, (cx - ax) / H, (cy - ay) / H];
      const det = m[0] * m[3] - m[1] * m[2];
      if (!det) return;
      const t = [m[3] / det, -m[1] / det, -m[2] / det, m[0] / det];
      const x = cv.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
      x.setTransform(t[0], t[1], t[2], t[3], -(t[0] * ax + t[2] * ay), -(t[1] * ax + t[3] * ay));
      x.drawImage(kesitGoruntu.g.c, 0, 0);
      x.setTransform(1, 0, 0, 1, 0, 0);
    });
  }

  async function kontrolSec(id, i, c, dugme) {
    const b = kagitBul(id); if (!b) return;
    const s = b.k.supheli[i]; if (!s || s.alan !== 'soru') return;
    const dizi = [...b.k.cevaplar[s.ders]]; dizi[s.soru] = c; b.k.cevaplar[s.ders] = dizi.join('');
    s.secim = c;
    if (dugme) {
      dugme.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('secili', x === dugme));
      dugme.closest('.kontrol-soru').classList.add('bitti');
    }
    if ((await okumaKaydet()) && !kontrolKalan(b.k)) bildir('Bu kâğıt tamam.');
  }

  /* Sorunlar gönderilmeden önce gösterilir */
  function okumaSorunlari(f) {
    const s = [];
    const kalan = f.kagitlar.filter(k => k.no && kontrolKalan(k)).length;
    const nosuz = f.kagitlar.filter(k => !k.no).length;
    const sayac = {}; f.kagitlar.forEach(k => { if (k.no && k.no !== Op.ANAHTAR_NO) sayac[k.no] = (sayac[k.no] || 0) + 1; }); // A ve B anahtar kâğıtları ayrı işlenir
    const iki = Object.keys(sayac).filter(n => sayac[n] > 1);
    if (kalan) s.push(`${kalan} kâğıtta kontrol edilmemiş yer var; okunduğu gibi gönderilir.`);
    if (nosuz) s.push(`${nosuz} kâğıdın okul numarası yok; bu kâğıtlar gönderilmez.`);
    if (iki.length) s.push(`Aynı numara birden çok kâğıtta: ${iki.join(', ')}. Sonraki okunan öncekinin yerine geçer.`);
    return s;
  }
  function okumaVerisi(f) {
    return {
      bicim: 'deneme-takip/optik', surum: 1, tarih: new Date().toISOString(),
      formlar: [{ kod: f.kod, secenek: f.secenek, sorular: f.sorular, kagitlar: f.kagitlar.filter(k => k.no).map(k => ({ no: k.no, kitapcik: k.kitapcik, kitapcikBos: k.kitapcikBos, cevaplar: k.cevaplar, kontrol: kontrolKalan(k), zaman: k.zaman })) }],
    };
  }
  async function okumaGonder(kod) {
    const f = okuma.formlar.find(x => x.kod === kod); if (!f) return;
    const sorun = okumaSorunlari(f);
    if (sorun.length && !(await sec('Göndermeden önce', sorun.map(h).join('<br>'), [{ ad: 'Kontrole dön', deger: null, ana: true }, { ad: 'Yine de gönder', deger: 1 }]))) return;
    const metin = JSON.stringify(okumaVerisi(f));
    const ad = `optik-okuma-${yerelGun()}-${f.kod}`;
    // Android paylaşımı JSON dosyasını kabul etmez; içerik aynı, uzantı .txt (PC'deki uygulama ikisini de alır)
    const dosya = new File([metin], ad + '.txt', { type: 'text/plain' });
    let gitti = false;
    if (navigator.canShare && navigator.canShare({ files: [dosya] })) {
      try { await navigator.share({ files: [dosya], title: 'Optik okuma' }); gitti = true; } catch (e) { if (e && e.name === 'AbortError') return; console.warn(e); }
    }
    if (!gitti) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([metin], { type: 'application/json' }));
      a.download = ad + '.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    }
    f.gonderildi = Date.now();
    const kayitli = await okumaKaydet(); yonlendir();
    if (kayitli) bildir(gitti ? 'Gönderildi. PC’de Veri ve yedek sayfasında bu dosyayı seçin.' : 'Dosya indirildi. Drive’a koyup PC’de Veri ve yedek sayfasında seçin.');
  }

  /* Okuma dosyasını (telefondan gelen ya da bu cihazdaki) optik sınavlara katar; rapor HTML'i ve değişen sınavlar */
  async function optikOkumaAl(veri) {
    if (!(durum.optik || []).length) return { html: '<div class="bilgi hata"><b>Optik okuma alınmadı.</b> Bu tarayıcıda optik sınav yok. Formu basan bilgisayarda açın ya da onun yedeğini önce buraya geri yükleyin.</div>', degisen: [] };
    const { degisen, rapor } = Op.okumaAl(durum.optik, veri);
    degisen.forEach(optikYayinla);
    // önceki deneme kaydedilemediyse kâğıtlar bellekte "aynı" görünür; yine de kaydet
    if ((degisen.length || kayitBekliyor) && !(await kaydet())) return { html: KAYIT_HATASI, degisen, kayitHatasi: true };
    const bos = !rapor.yeni && !rapor.guncel && !rapor.anahtar;
    let html = `<div class="bilgi${bos ? ' uyari' : ''}"><b>${bos ? 'Yeni bir şey alınmadı.' : 'Optik okuma alındı.'}</b> Yeni kâğıt ${rapor.yeni}, güncellenen ${rapor.guncel}${rapor.guncelNo.length ? ` (okul no ${rapor.guncelNo.slice(0, 12).map(h).join(', ')}${rapor.guncelNo.length > 12 ? '…' : ''})` : ''}${rapor.anahtar ? `, cevap anahtarı kâğıdı ${rapor.anahtar}` : ''}.</div>`;
    if (rapor.eski) html += `<div class="bilgi uyari">${rapor.eski} kâğıt alınmadı: aynı numaranın daha yeni okunmuş kâğıdı zaten var (eski bir dosya seçilmiş olabilir).</div>`;
    for (const o of degisen) {
      const yayinda = durum.sinavlar.some(s => s.id === o.id);
      html += `<div class="bilgi${yayinda ? '' : ' uyari'}"><a href="#/optik/${encodeURIComponent(o.id)}">${h(o.ad)}</a>: ${yayinda ? `${o.kagitlar.length} kâğıt. <a href="#/sinav/${encodeURIComponent(o.id)}">Sonuçlar</a>` : 'sonuçlar cevap anahtarı tamamlanınca görünür.'}</div>`;
      const bil = sinifiBilinmeyen(o.kagitlar.map(k => k.no));
      if (bil.length) html += `<div class="bilgi uyari">${h(o.ad)}: öğrenci listesinde sınıfıyla olmayan numara: ${bil.slice(0, 12).map(h).join(', ')}${bil.length > 12 ? '…' : ''}. Yanlış kodlanmış olabilir; kâğıtlara bakın.</div>`;
    }
    if (rapor.bilinmeyenForm.length) html += `<div class="bilgi hata">${rapor.bilinmeyenForm.length} formun sınavı bu tarayıcıda yok (form kodu ${rapor.bilinmeyenForm.map(h).join(', ')}). Formu basan bilgisayarın yedeğini önce buraya geri yükleyin.</div>`;
    if (rapor.uyusmayan.length) html += `<div class="bilgi hata">Ders ya da soru sayısı tutmadığı için alınmadı: ${rapor.uyusmayan.map(h).join(', ')}.</div>`;
    if (rapor.kontrolsuz) html += `<div class="bilgi uyari">${rapor.kontrolsuz} kâğıt telefonda kontrol edilmeden gönderildi; belirsiz işaretler okunduğu gibi alındı.</div>`;
    const uy = [...new Set(rapor.uyari)];
    if (uy.length) html += `<div class="bilgi uyari">${uy.slice(0, 10).map(h).join('<br>')}${uy.length > 10 ? `<br>… ve ${uy.length - 10} uyarı daha` : ''}</div>`;
    return { html, degisen };
  }

  /* ---------- veri ve yedek ---------- */
  function gorVeri() {
    const a = ayar();
    const son = durum.sonYedek ? new Date(durum.sonYedek).toLocaleString('tr-TR') : 'hiç alınmadı';
    const sonuc = bekleyenSonuc; bekleyenSonuc = '';
    return `<h1>Veri ve yedek</h1><div id="aktarma-sonuc">${sonuc}</div>
      <div class="kart"><b>TestPlus’tan sonuç al</b><p class="alt">Masaüstündeki “TestPlus’tan Aktar” kısayolu dönüştürücüyü çalıştırır ve <code>testplus_aktarim.json</code> dosyasını Belgeler › Deneme Takip klasörüne yazar ve klasörü açar. Dosyayı buraya bırakın ya da seçin. Aynı sınav yeniden alınırsa güncellenir; mükerrer olmaz.</p>

  }

  /* ---------- yönlendirme ---------- */
  function hashCoz() {
    const [yol, q] = location.hash.replace(/^#\/?/, '').split('?');
    const coz = (x) => { try { return decodeURIComponent(x); } catch (e) { return x; } };
    const parca = yol.split('/').filter(Boolean).map(coz);
    const sorgu = Object.fromEntries(new URLSearchParams(q || ''));
    return { parca, sorgu };
  }
  function sorguYaz(degis, yerinde = false) {
    const { parca, sorgu } = hashCoz();
    const s = { ...sorgu, ...degis };
    Object.keys(s).forEach(k => (s[k] === '' || s[k] == null) && delete s[k]);
    const q = new URLSearchParams(s).toString();
    const yeni = '#/' + parca.map(encodeURIComponent).join('/') + (q ? '?' + q : '');
    if (!yerinde) { location.hash = yeni; return; }
    history.replaceState(null, '', yeni); // arama yazarken "Geri" tuşu her harfe dönmesin
    yonlendir();
    const i = $('[data-is="ogrenci-ara"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
  }

  function yonlendir() {
    const { parca, sorgu } = hashCoz();
    const kok = parca[0] || 'sinavlar';
    document.querySelectorAll('#menu a').forEach(a => a.classList.toggle('secili', a.dataset.kok === kok || (kok === 'sinav' && a.dataset.kok === 'sinavlar') || (kok === 'oku' && a.dataset.kok === 'optik') || ((kok === 'ogrenci' || kok === 'ozet') && a.dataset.kok === 'ogrenciler')));
    let html;
    try {
      if (kok === 'sinavlar') html = gorSinavlar(sorgu);
      else if (kok === 'sinav') html = gorSinav(parca[1], parca[2], sorgu);
      else if (kok === 'ogrenciler') html = gorOgrenciler(sorgu);
      else if (kok === 'ozet') html = gorOzet(sorgu);
      else if (kok === 'konu') html = gorKonu(sorgu);
      else if (kok === 'ogrenci') html = gorOgrenci(parca[1], sorgu);
      else if (kok === 'zorluk') html = gorZorluk(sorgu);
      else if (kok === 'karne') html = gorKarne(parca[1], parca[2] || 'hepsi', sorgu);
      else if (kok === 'tahta') html = gorTahta(parca[1], sorgu);
      else if (kok === 'elle') html = gorElle(sorgu);
      else if (kok === 'optik') html = !parca[1] ? gorOptik() : parca[2] === 'form' ? gorOptikForm(parca[1]) : gorOptikSinav(parca[1]);
      else if (kok === 'oku') html = parca[1] ? gorKontrol(parca[1]) : gorOku();
      else if (kok === 'veri') html = gorVeri();
      else html = gorSinavlar(sorgu);
    } catch (e) {
      console.error(e);
      html = `<div class="bilgi hata"><b>Bir hata oluştu.</b> ${h(e.message)}</div>`;
    }
    ekran().innerHTML = html;
    tabloSiralanir(ekran());
    surukleBagla();
    if (kok === 'elle') elleToplamGuncelle();
    if (kok === 'optik' && !parca[1]) optikSigmaGuncelle();
    if (kok === 'oku' && parca[1]) kesitleriCiz(parca[1]).catch(e => console.error(e));
    const baslik = ekran().querySelector('h1');
    document.title = (baslik ? baslik.textContent.trim() + ' · ' : '') + 'Deneme Takip';
    ekran().querySelectorAll('tr[data-git]').forEach(tr => { tr.tabIndex = 0; });
  }

  function surukleBagla() {
    const al = $('#surukle-alani'); if (!al) return;
    ['dragenter', 'dragover'].forEach(e => al.addEventListener(e, ev => { ev.preventDefault(); al.classList.add('ustunde'); }));
    ['dragleave', 'drop'].forEach(e => al.addEventListener(e, ev => { ev.preventDefault(); al.classList.remove('ustunde'); }));
    al.addEventListener('drop', ev => { const f = ev.dataTransfer.files[0]; if (f) dosyaIsle(f); });
  }

  window.addEventListener('dragover', ev => { if (dosyaSuruklenir(ev)) ev.preventDefault(); });

      let r;
      try { r = await Op.kazanimUygula(o, t.bolumler.map((x, i) => ({ ders: t.tahmin[i], girdiler: x.girdiler }))); }
      catch (e) { console.error(e); bildir('Kazanımlar eklenemedi: ' + ((e && e.message) || 'bilinmeyen hata')); return; }
      if (r.hata) { bildir(r.hata); return; }
      kazanimTaslak = null; o.degisti = Date.now();
      optikYayinla(o);
      const kayitli = await kaydet(); yonlendir();
      if (kayitli) bildir(`${r.atanan} soruya kazanım atandı.`);
    }
    else if (is === 'kazanim-kaldir') {
      const o = optikBul(b.dataset.op); if (!o) return;
      if (!(await sec('Kazanımları kaldır', `${h(o.ad)}: sorulara atanmış kazanımlar kaldırılır. Excel’i yeniden seçerek geri ekleyebilirsiniz.`, [{ ad: 'Vazgeç', deger: null, ana: true }, { ad: 'Kaldır', deger: 1 }]))) return;
      o.dersler.forEach(d => { delete d.kazanim; }); delete o.kazanimAd; o.degisti = Date.now();
      optikYayinla(o); await kaydet(); yonlendir();
    }
    else if (is === 'optik-sil') {
      const o = optikBul(b.dataset.op); if (!o) return;
      if (!(await sec('Optik sınavı sil', `${h(o.ad)}: cevap anahtarı ve ${o.kagitlar.length} kâğıt silinir, sonuçlar sınavlardan kalkar. Son yedekte durmaya devam eder.`, [{ ad: 'Vazgeç', deger: null, ana: true }, { ad: 'Sil', deger: 1 }]))) return;
      durum.optik = durum.optik.filter(x => x !== o); durum.sinavlar = durum.sinavlar.filter(s => s.id !== o.id); hayaletTemizle();
      await kaydet(); location.hash = '#/optik';
    }
    else if (is === 'oku-gonder') okumaGonder(Number(b.dataset.kod));
    else if (is === 'oku-ekle') {
      const f = okuma.formlar.find(x => x.kod === Number(b.dataset.kod)); if (!f) return;
      const sorun = okumaSorunlari(f);
      if (sorun.length && !(await sec('Eklemeden önce', sorun.map(h).join('<br>'), [{ ad: 'Kontrole dön', deger: null, ana: true }, { ad: 'Yine de ekle', deger: 1 }]))) return;
      let r;
      try { r = await optikOkumaAl(okumaVerisi(f)); } catch (e) { console.error(e); return bildir('Sınava eklenemedi: ' + (e && e.message)); }
      if (!r.degisen.length || r.kayitHatasi) return iceAktarmaSonucu(r.html);
      f.gonderildi = Date.now(); await okumaKaydet();
      optikRapor = r.html; location.hash = '#/optik/' + encodeURIComponent(r.degisen[0].id);
    }
    else if (is === 'oku-temizle') {
      const f = okuma.formlar.find(x => x.kod === Number(b.dataset.kod)); if (!f) return;
      if (!(await sec('Listeyi temizle', `${f.kagitlar.length} kâğıdın okuma sonucu bu cihazdan silinsin mi?${f.gonderildi ? '' : '<br><b>Bu liste henüz gönderilmedi ya da sınava eklenmedi.</b>'}`, [{ ad: 'Vazgeç', deger: null, ana: true }, { ad: 'Sil', deger: 1 }]))) return;
      f.kagitlar.forEach(k => fotolar.delete(k.id));
      okuma.formlar = okuma.formlar.filter(x => x !== f); await okumaKaydet(); yonlendir();

    else if (is === 'kontrol-sec') kontrolSec(b.dataset.id, Number(b.dataset.i), b.dataset.c, b);
    else if (is === 'kontrol-hepsi') {

      await okumaKaydet(); yonlendir();

    else if (is === 'kontrol-sil') {

      fotolar.delete(x.k.id); await okumaKaydet(); location.hash = '#/oku';
    }
  });

  document.addEventListener('change', async (ev) => {
    const t = ev.target;
    if (t.id === 'dosya-sec') { const f = t.files[0]; t.value = ''; if (f) dosyaIsle(f); return; }
    if (t.dataset.ayar) { durum.ayarlar = { ...ayar(), [t.dataset.ayar]: t.checked }; await kaydet(); yonlendir(); return; }
    if (t.dataset.ayarSec) { durum.ayarlar = { ...ayar(), [t.dataset.ayarSec]: Number(t.value) }; await kaydet(); return; }
    const is = t.dataset.is;
    if (is === 'oku-dosya') { const fs = [...t.files]; t.value = ''; fotoOku(fs); return; }
    if (is === 'anahtar') { anahtarDegisti(t); return; }
    if (is === 'kazanim-dosya') { const fs = [...t.files]; t.value = ''; kazanimDosyaSec(t.dataset.op, fs); return; }
    if (is === 'kazanim-ders') { if (kazanimTaslak) kazanimTaslak.tahmin[Number(t.dataset.i)] = Number(t.value); return; }
    if (is === 'optik-sablon') {
      $('#optik-dersler').innerHTML = dersSatirlari(Op.SABLONLAR[t.value]);
      $('#optik-form [name="seviye"]').value = t.value === 'ara' ? '9' : '12';
      optikSigmaGuncelle(); return;
    }
    if (is === 'kontrol-no') {
      const x = kagitBul(t.dataset.id); if (!x) return;
      const ham = t.value.replace(/\D/g, '');
      x.k.no = ham === Op.ANAHTAR_NO ? ham : ham.replace(/^0+(?=\d)/, '');
      const s = x.k.supheli.find(y => y.alan === 'no');
      if (x.k.no) { if (s) s.secim = x.k.no; } else if (s) s.secim = null; else x.k.supheli.push({ alan: 'no' });
      await okumaKaydet(); yonlendir(); return;
    }
    if (is === 'seviye-sec') sorguYaz({ seviye: t.value });
    else if (is === 'sinif-sec') sorguYaz({ sinif: t.value });
    else if (is === 'ders-sec') sorguYaz({ ders: t.value });
    else if (is === 'kaz-gosterim') sorguYaz({ kaz: t.value });
    else if (is === 'z-ders') sorguYaz({ zders: t.value });
    else if (is === 'k-ders') sorguYaz({ kders: t.value });
    else if (is === 'k-filtre') sorguYaz({ kf: t.value });
    else if (is === 'ayrinti') sorguYaz({ ayrinti: t.checked ? '1' : '' });
    else if (is === 'kopya-hepsi') sorguYaz({ hepsi: t.checked ? '1' : '' });
    else if (is === 'puan-turu' || is === 'tyt-esi') {

      const alan = is === 'puan-turu' ? 'puanTuru' : 'tytEsi';

    else if (is === 'tahta-kisi') sorguYaz({ kisi: t.value });
    else if (is === 'ozet-ders') sorguYaz({ ders: t.value });
    else if (is === 'ad-yaz') { const o = ogrenci(t.dataset.no); if (o) { o.ad = t.value.trim() || undefined; await kaydet(); bildir('Ad kaydedildi.'); } }
  });

  let araZaman, elleZaman;
  const dolu = (x) => x !== '' && x != null;
  const elleGirildi = (v) => v && (dolu(v[0]) || dolu(v[1]));
  const elleGecersiz = (dd, yy, soru) => !Number.isInteger(dd) || !Number.isInteger(yy) || dd < 0 || yy < 0 || dd + yy > soru;
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.closest && t.closest('#optik-form')) optikSigmaGuncelle();

    if (t.closest && t.closest('#elle-tablo') && durum.elleTaslak) {
      const tr = t.closest('tr'); const k = durum.elleTaslak.kagitlar[tr.dataset.i];
      const v = k.elle[t.dataset.d] || ['', '']; v[Number(t.dataset.f)] = t.value === '' ? '' : Number(t.value); k.elle[t.dataset.d] = v;
      elleToplamGuncelle();
      clearTimeout(elleZaman); elleZaman = setTimeout(() => DB.koy('durum', durum), 600);

  });

  // arama kutusu yeniden çizimde odağı kaybetmesin
  window.addEventListener('hashchange', () => {
    const odak = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.is;
    yonlendir();
    if (odak === 'ogrenci-ara') { const i = $('[data-is="ogrenci-ara"]'); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }
  });

  async function elleBasla() {
    const f = $('#elle-form');
    const v = (n) => f.querySelector(`[name="${n}"]`);
    const ad = v('ad').value.trim();
    if (!ad) return bildir('Sınav adını yazın.');
    const dersler = STANDART_DERSLER.map(([d], i) => v('d' + i).checked ? { id: d.toLocaleLowerCase('tr').replace(/ç/g, 'c').replace(/ğ/g, 'g').replace(/ı/g, 'i').replace(/ö/g, 'o').replace(/ş/g, 's').replace(/ü/g, 'u').replace(/[^a-z0-9]/g, ''), ad: d, soru: Number(v('n' + i).value) } : null).filter(Boolean);
    if (!dersler.length) return bildir('En az bir ders seçin.');
    if (dersler.some(d => !Number.isInteger(d.soru) || d.soru < 1 || d.soru > 100)) return bildir('Soru sayısı 1 ile 100 arasında tam sayı olmalı.');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(v('tarih').value)) return bildir('Sınav tarihini girin.');
    const sinif = v('sinif').value;
    const nolar = durum.ogrenciler.filter(o => sinif && o.sinif === sinif).map(o => String(o.no));
    v('ekno').value.split(/[,\s]+/).map(x => x.trim()).filter(Boolean).forEach(n => { if (!nolar.includes(n)) nolar.push(n); });
    if (!nolar.length) return bildir('Sınıf seçin ya da okul numarası yazın.');
    nolar.sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
    durum.elleTaslak = {
      id: 'el-' + Date.now().toString(36), ad, tarih: v('tarih').value, seviye: Number(v('seviye').value), yayin: ad.includes(' - ') ? ad.split(' - ')[0] : null,
      ceza: Number(v('ceza').value), notlar: ['Elle girildi; soru ve kazanım analizi yok.'],
      dersler: dersler.map(d => ({ ...d, anahtar: { A: Array(d.soru).fill('X') }, kazanim: Array(d.soru).fill([]), elle: true })),
      kagitlar: nolar.map(no => ({ no, sinif: (ogrenci(no) || {}).sinif || sinif, kitapcik: 'A', elle: {} })),
    };
    await kaydet(); yonlendir();
  }

  async function elleKaydet() {
    const s = durum.elleTaslak; if (!s) return;
    const hatali = [];
    const kagitlar = s.kagitlar.map(k => {
      const elle = {};
      s.dersler.forEach(d => {
        const v = k.elle[d.id];
        if (!elleGirildi(v)) return;
        const dd = dolu(v[0]) ? +v[0] : 0, yy = dolu(v[1]) ? +v[1] : 0;
        if (elleGecersiz(dd, yy, d.soru)) hatali.push(`${k.no} ${d.ad}`);
        elle[d.id] = [dd, yy, d.soru - dd - yy];
      });
      return { ...k, elle };
    }).filter(k => Object.keys(k.elle).length);
    if (hatali.length) return bildir('Geçersiz değer (tam sayı olmalı, doğru + yanlış soru sayısını aşmamalı): ' + hatali.slice(0, 4).join(', '));
    if (!kagitlar.length) return bildir('Hiç değer girilmedi.');
    const sinav = { ...s, kagitlar };
    const yeniOgr = kagitlar.filter(k => !ogrenci(k.no)).map(k => ({ no: k.no, sinif: k.sinif }));
    durum = M.birlestir(durum, { sinavlar: [sinav], ogrenciler: yeniOgr, kazanimlar: [] }).durum;
    delete durum.elleTaslak;
    if (!(await kaydet())) { durum.elleTaslak = s; return; } // girilen değerler kaybolmasın
    location.hash = '#/sinav/' + encodeURIComponent(sinav.id);
    bildir('Sınav kaydedildi. Yedeklemeyi unutmayın.');
  }

  /* ---------- başlat ---------- */
  async function baslat() {
    $('#surum').textContent = SURUM;
    bildirimAlani(); // ekran okuyucu canlı bölgeyi ilk bildirimden önce tanısın
    try {
      const kayit = await DB.al('durum');
      if (kayit) durum = { ...M.bosDurum(), ...kayit };
      const ok = await DB.al('okuma');
      if (ok && Array.isArray(ok.formlar)) okuma = ok;
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    } catch (e) {
      ekran().innerHTML = `<div class="bilgi hata"><b>Tarayıcı deposu açılamadı.</b> Gizli pencerede ya da dosyadan açıldıysa veriler saklanamaz. ${h(e.message)}</div>`;
      return;
    }
    seritGuncelle();
    yonlendir();
  }
  // Elle giriş taslağı sekme gizlenirken ya da kapanırken de yazılır
  const taslakYaz = () => { if (durum.elleTaslak) { clearTimeout(elleZaman); DB.koy('durum', durum).catch(() => {}); } };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') taslakYaz(); });
  window.addEventListener('pagehide', taslakYaz);
  window.DenemeTakip = { durum: () => durum, okuma: () => okuma, dosyaIsle, kontrolSec, M };
  baslat();
})();
</script>
