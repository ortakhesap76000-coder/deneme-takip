<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2759c4">
<title>Deneme Takip</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232759c4'/%3E%3Cpath d='M8 22l5-6 4 3 7-9' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>:root {
  --zemin: #f6f7f9; --kart: #ffffff; --yazi: #1d2330; --soluk: #5d6677; --cizgi: #dfe3ea;
  --vurgu: #2759c4; --vurgu-acik: #e7eefc; --iyi: #1f8a4c; --orta: #b7791f; --zayif: #c53030;
  --iyi-z: #e3f4ea; --orta-z: #fbf0dc; --zayif-z: #fbe5e5; --golge: 0 1px 2px rgba(20, 30, 50, .06), 0 2px 8px rgba(20, 30, 50, .05);
  --r: 10px; color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="acik"]) {
    --zemin: #12151b; --kart: #1b2029; --yazi: #e7eaf0; --soluk: #9aa3b5; --cizgi: #2c3340;
    --vurgu: #7aa2ff; --vurgu-acik: #1f2a44; --iyi: #4cc38a; --orta: #e3a948; --zayif: #f07171;
    --iyi-z: #173326; --orta-z: #3a2e17; --zayif-z: #3b1d1d; --golge: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--zemin); color: var(--yazi); font: 15px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
a { color: var(--vurgu); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--cizgi); background: var(--kart); border-radius: 8px; padding: 7px 12px; }
button:hover { border-color: var(--vurgu); }
button.ana { background: var(--vurgu); color: #fff; border-color: var(--vurgu); }
@media (prefers-color-scheme: dark) { :root:not([data-tema="acik"]) button.ana { color: #0b1020; } }
button.ana:hover { filter: brightness(1.08); }
button:disabled { opacity: .5; cursor: default; }
select, input[type=text], input[type=number], input[type=date] { background: var(--kart); border: 1px solid var(--cizgi); border-radius: 8px; padding: 6px 8px; }
input[type=number] { width: 4.2em; }

header.ust { position: sticky; top: 0; z-index: 5; background: var(--kart); border-bottom: 1px solid var(--cizgi); display: flex; align-items: center; gap: 4px; padding: 0 16px; overflow-x: auto; }
header.ust .marka { font-weight: 700; margin-right: 12px; white-space: nowrap; }
header.ust nav { display: flex; }
header.ust nav a { display: inline-block; padding: 14px 10px; text-decoration: none; color: var(--soluk); border-bottom: 2px solid transparent; white-space: nowrap; }
header.ust nav a.secili { color: var(--yazi); border-bottom-color: var(--vurgu); }
header.ust .bosluk { flex: 1; }
header.ust .surum { color: var(--soluk); font-size: 12px; white-space: nowrap; }

main { max-width: 1180px; margin: 0 auto; padding: 18px 16px 60px; }
h1 { font-size: 22px; margin: 4px 0 4px; }
h2 { font-size: 17px; margin: 22px 0 10px; }
.alt { color: var(--soluk); font-size: 13px; }
.kart { background: var(--kart); border: 1px solid var(--cizgi); border-radius: var(--r); box-shadow: var(--golge); padding: 14px 16px; margin: 12px 0; }
.satir { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ayrik { justify-content: space-between; }
.izgara { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.ozet { background: var(--kart); border: 1px solid var(--cizgi); border-radius: var(--r); padding: 12px 14px; }
.ozet b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.ozet span { color: var(--soluk); font-size: 13px; }

.sekmeler { display: flex; gap: 4px; border-bottom: 1px solid var(--cizgi); margin: 14px 0 8px; overflow-x: auto; }
.sekmeler a { padding: 9px 12px; text-decoration: none; color: var(--soluk); border-bottom: 2px solid transparent; white-space: nowrap; }
.sekmeler a.secili { color: var(--yazi); border-bottom-color: var(--vurgu); }

.tablo-kap { overflow-x: auto; border: 1px solid var(--cizgi); border-radius: var(--r); background: var(--kart); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 9px; border-bottom: 1px solid var(--cizgi); text-align: right; white-space: nowrap; }
th { font-size: 12px; color: var(--soluk); font-weight: 600; background: var(--kart); position: sticky; top: 0; }
th.sol, td.sol { text-align: left; }
tbody tr:hover { background: var(--vurgu-acik); }
tbody tr.tik { cursor: pointer; }
tr:last-child td { border-bottom: 0; }
td.vurgu { font-weight: 700; }
th.sirala { cursor: pointer; user-select: none; }
th.sirala:hover { color: var(--yazi); }
.iyi { color: var(--iyi); } .orta { color: var(--orta); } .zayif { color: var(--zayif); }
.z-iyi { background: var(--iyi-z); } .z-orta { background: var(--orta-z); } .z-zayif { background: var(--zayif-z); }
.rozet { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 12px; background: var(--vurgu-acik); color: var(--vurgu); }
.rozet.uyari { background: var(--orta-z); color: var(--orta); }
.bilgi { padding: 10px 14px; border-radius: var(--r); background: var(--vurgu-acik); margin: 10px 0; }
.bilgi.uyari { background: var(--orta-z); }
.bilgi.hata { background: var(--zayif-z); }
.bos-durum { text-align: center; padding: 50px 16px; color: var(--soluk); }
.bos-durum h1 { color: var(--yazi); }
.harita td { text-align: center; min-width: 34px; padding: 5px 4px; font-size: 12px; }
.harita td.sol { text-align: left; }
.kazanim-ad { max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
.gecmis .kazanim-ad { max-width: 340px; } .gecmis td:nth-child(n+5), .gecmis th:nth-child(n+5) { text-align: center; }
.cubuk { display: inline-block; height: 8px; border-radius: 4px; background: var(--vurgu); vertical-align: middle; }
.cubuk-kap { display: inline-block; width: 90px; height: 8px; background: var(--cizgi); border-radius: 4px; vertical-align: middle; overflow: hidden; }
.cubuk-kap .cubuk { display: block; height: 100%; }
tbody tr.tik:focus-visible { outline: 2px solid var(--vurgu); outline-offset: -2px; }
dialog.secim { border: 1px solid var(--cizgi); border-radius: var(--r); background: var(--kart); color: var(--yazi); max-width: 480px; padding: 18px 20px; }
dialog.secim::backdrop { background: rgba(0, 0, 0, .35); }
dialog.secim h2 { margin-top: 0; }
svg.grafik { width: 100%; height: auto; display: block; }
svg.grafik text { fill: var(--soluk); font-size: 11px; }
.gizli { display: none !important; }
.yedek-serit { background: var(--orta-z); color: var(--yazi); padding: 8px 16px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; font-size: 14px; }
.surukle { border: 2px dashed var(--cizgi); border-radius: var(--r); padding: 28px; text-align: center; color: var(--soluk); }
.surukle.ustunde { border-color: var(--vurgu); background: var(--vurgu-acik); }
.bildirim:not(.acik) { opacity: 0; pointer-events: none; }
.bildirim:empty { padding: 0; }
.bildirim { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--yazi); color: var(--zemin); padding: 10px 16px; border-radius: 8px; z-index: 20; max-width: 90vw; }

/* Sınıf ekranı: tahtaya yansıtılır, isim yok */
.tahta { max-width: 900px; margin: 0 auto; text-align: center; }
.tahta h1 { font-size: 30px; }
.tahta table td, .tahta table th { font-size: 26px; padding: 12px 16px; text-align: center; }
.tahta table th { font-size: 16px; }

/* Karne (A4) */
/* karne her temada beyaz kâğıt: jetonlar açık temaya sabitlenir (üzerine gelme, ızgara çizgisi okunur kalsın) */
.karne { --zemin: #fff; --kart: #fff; --yazi: #111; --soluk: #555; --cizgi: #d5d9e0; --vurgu: #2759c4; --vurgu-acik: #eef2fb; color-scheme: light; }
.karne { background: #fff; color: #111; max-width: 794px; margin: 0 auto; padding: 28px 34px; border: 1px solid var(--cizgi); }
.karne h1 { font-size: 20px; margin: 0; }
.karne .bas { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #222; padding-bottom: 8px; margin-bottom: 12px; }
.karne table { font-size: 13px; }
.karne th { background: #f1f3f6; color: #333; position: static; }
.karne td, .karne th { border-bottom: 1px solid #d5d9e0; padding: 5px 7px; }
.karne h2 { font-size: 14px; margin: 14px 0 6px; }
.karne .kucuk { font-size: 11.5px; color: #444; }
.karne ul.kucuk { font-size: 11px; }
/* her kazanım tek satır: karne A4 tek sayfaya sığar; tam adı uygulamadaki kazanım sekmesinde */
.karne ul.kucuk li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.karne .ikili { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.karne svg.grafik text { fill: #555; }
.karne .iyi { color: #1a7a42; } .karne .zayif { color: #b42323; }

@media (max-width: 640px) {
  header.ust { flex-wrap: wrap; padding: 0 8px; }
  header.ust .marka { padding: 8px 0 0 8px; }
  header.ust .surum { display: none; }
  header.ust nav { width: 100%; overflow-x: auto; }
  header.ust nav a { padding: 10px 8px; font-size: 14px; }
  main { padding: 12px 12px 50px; }
  h1 { font-size: 19px; }
  .karne { padding: 12px; }
  .karne td, .karne th { padding: 4px 3px; font-size: 12px; }
  .karne td.sol { white-space: normal; }
  .karne .ikili { grid-template-columns: 1fr; }
  .tahta table td, .tahta table th { font-size: 18px; padding: 8px; }
}

@media print {
  @page { size: A4; margin: 10mm; }
  /* koyu tema açıkken de kâğıda açık renklerle basılır */
  :root, :root:not([data-tema="acik"]) {
    --zemin: #fff; --kart: #fff; --yazi: #111; --soluk: #555; --cizgi: #d5d9e0; --vurgu: #2759c4; --vurgu-acik: #eef2fb;
    --iyi: #1a7a42; --orta: #9a6512; --zayif: #b42323; --iyi-z: #e3f4ea; --orta-z: #fbf0dc; --zayif-z: #fbe5e5; --golge: none; color-scheme: light;
  }
  body { background: #fff; }
  .tablo-kap { overflow: visible; border: 0; }
  table { font-size: 11px; }
  th { position: static; }
  header.ust, .yedek-serit, .yazdirma-yok, .bildirim { display: none !important; }
  main { padding: 0; max-width: none; }
  .karne { border: 0; padding: 0; max-width: none; }
  .karne-sayfa { break-after: page; }
  .karne-sayfa:last-child { break-after: auto; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* Optik okuma */
label.dugme { display: inline-block; cursor: pointer; border: 1px solid var(--cizgi); background: var(--kart); border-radius: 8px; padding: 7px 12px; }
label.dugme:hover { border-color: var(--vurgu); }
label.dugme.ana, button.secili { background: var(--vurgu); color: #fff; border-color: var(--vurgu); }
@media (prefers-color-scheme: dark) { :root:not([data-tema="acik"]) label.dugme.ana, :root:not([data-tema="acik"]) button.secili { color: #0b1020; } }
.oku-dugmeler label.dugme { font-size: 17px; padding: 14px 22px; }
.optik-ders input[type=text] { flex: 1; min-width: 160px; }
.anahtar { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.anahtar input { width: 100%; font-family: ui-monospace, Consolas, monospace; letter-spacing: 1px; }
input.hatali { border-color: var(--zayif); }
.kontrol-soru.bitti b::after { content: ' ✓'; color: var(--iyi); }
.secenekler button { min-width: 48px; min-height: 44px; font-size: 16px; }
.kontrol-ust button { min-width: 48px; min-height: 40px; }
canvas.kirpik { display: block; max-width: 100%; margin: 8px 0; border: 1px solid var(--cizgi); border-radius: 6px; background: #fff; }
.optik-form svg { display: block; width: 100%; max-width: 794px; height: auto; margin: 12px auto; border: 1px solid var(--cizgi); background: #fff; }
@page optikform { size: A4; margin: 0; }
@media print {
  .optik-form { page: optikform; }
  .optik-form svg { width: 210mm; height: 296mm; max-width: none; margin: 0; border: 0; }
}

details summary { cursor: pointer; }
details p { margin: 4px 0; }
select { max-width: 100%; }
</style>
</head>

<header class="ust">
  <span class="marka">Deneme Takip</span>
  <nav id="menu">
    <a href="#/sinavlar" data-kok="sinavlar">Sınavlar</a>

  <span class="bosluk"></span>

<input type="file" id="dosya-sec" accept=".json,.txt,application/json,text/plain" class="gizli">
<script>/* Deneme Takip · hesap motoru (saf işlevler; tarayıcıda ve Node'da çalışır).
 *
 * Veri biçimi (aktarım ve durum aynı yapıyı paylaşır):
 *   sinav  = { id, ad, tarih, seviye, yayin, ceza, dersler:[ders], kagitlar:[kagit], notlar }
 *   ders   = { id, ad, soru, anahtar:{A:[..], B:[..]}, kazanim:[[kimlik..]..] }
 *            anahtar öğesi: kabul edilen harfler ('A', 'AB'); 'X' = iptal (değerlendirme dışı)
 *   kagit  = { no, sinif, kitapcik, cevap:{dersId:'AB-*..'}, tp?:{dersId:[d,y,b,net]} }
 *            cevap karakteri: A..E, '-' boş, '*' çift işaret (yanlış sayılır)
 *   ceza   = kaç yanlış bir doğruyu götürür (0 = götürmez)
 * Kurallar TestPlus'ın 812 ders sonucuyla birebir doğrulandı (6 Ekim 2026).
 */
(function (kok) {
  'use strict';
  const HARFLER = 'ABCDE';

  function yuvarla(x, b = 2) {
    const k = Math.pow(10, b);
    return Math.round((x + Number.EPSILON) * k) / k;
  }

  function puanla(cevap, anahtar, ceza) {
    let d = 0, y = 0, b = 0;
    for (let i = 0; i < anahtar.length; i++) {
      const dogru = anahtar[i];
      if (dogru === 'X') continue;
      const c = (cevap && cevap[i]) || '-';
      if (c === '-') b++;
      else if (c !== '*' && dogru.indexOf(c) >= 0) d++;
      else y++;
    }
    const net = d - (ceza ? y / ceza : 0);
    return { d, y, b, net };
  }

  function dersAnahtari(ders, kitapcik) {
    const a = ders.anahtar || {};
    return a[kitapcik] || a.A || Object.values(a)[0] || [];
  }

  /* Yarışma sıralaması: eşit puan aynı sırayı alır, sonraki sıra atlanır (1, 2, 2, 4). */
  function sirala(dizi, deger) {
    const sirali = dizi.slice().sort((a, b) => deger(b) - deger(a));
    const sira = new Map();
    let onceki = null, s = 0;
    sirali.forEach((x, i) => {
      const v = yuvarla(deger(x), 6);
      if (v !== onceki) { s = i + 1; onceki = v; }
      sira.set(x, s);
    });
    return sira;
  }

  /* Başarı oranının paydası: iptal (X) sorular düşülür. Elle sınavlarda anahtar yok; soru sayısı alınır. */
  function gecerliSoru(ders) {
    if (ders.elle) return ders.soru;
    return dersAnahtari(ders, 'A').filter(k => k && k !== 'X').length || null;
  }

  /* Z = (x − ortalama) ÷ standart sapma (grup içi, kitle formülü); en az 2 değer ve sıfırdan büyük sapma gerekir. */
  function standartla(grup, deger, yaz) {
    const v = grup.filter(s => deger(s) != null);
    const n = v.length;
    const ort = n ? v.reduce((t, s) => t + deger(s), 0) / n : 0;
    const ss = n ? Math.sqrt(v.reduce((t, s) => t + (deger(s) - ort) ** 2, 0) / n) : 0;
    for (const s of grup) yaz(s, n >= 2 && ss > 1e-9 && deger(s) != null ? (deger(s) - ort) / ss : null);
  }

  /* Bir sınavın bütün kâğıtlarını puanlar; sıra, sınıf sırası ve ortalamaları ekler.
   * basari = net ÷ geçerli soru; öğrencinin toplam başarısı yalnız girdiği derslerin sorularına bölünür. */
  function sinavHesapla(sinav) {
    const ceza = sinav.ceza || 0;
    const gecerli = Object.fromEntries(sinav.dersler.map(d => [d.id, gecerliSoru(d)]));
    const satirlar = sinav.kagitlar.map(k => {
      const dersler = {};
      let toplam = 0, payda = 0, girdi = false;
      for (const ders of sinav.dersler) {
        const cevap = k.cevap && k.cevap[ders.id];
        if (cevap == null && !(k.elle && k.elle[ders.id])) continue;
        let p;
        if (k.elle && k.elle[ders.id]) {
          const [d, y, b] = k.elle[ders.id];
          p = { d, y, b, net: d - (ceza ? y / ceza : 0) };
        } else {
          p = puanla(cevap, dersAnahtari(ders, k.kitapcik), ceza);
        }
        p.basari = gecerli[ders.id] ? p.net / gecerli[ders.id] : null;
        dersler[ders.id] = p;
        toplam += p.net;
        payda += gecerli[ders.id] || 0;
        girdi = true;
      }
      return { kagit: k, no: k.no, sinif: k.sinif || '', dersler, toplam, basari: payda ? toplam / payda : null, girdi };
    }).filter(s => s.girdi);

    const genelSira = sirala(satirlar, s => s.toplam);
    const siniflar = {};
    satirlar.forEach(s => (siniflar[s.sinif] = siniflar[s.sinif] || []).push(s));
    const sinifSira = new Map();
    Object.values(siniflar).forEach(g => sirala(g, s => s.toplam).forEach((v, k) => sinifSira.set(k, v)));
    satirlar.forEach(s => { s.sira = genelSira.get(s); s.sinifSira = sinifSira.get(s); });
    satirlar.sort((a, b) => a.sira - b.sira || String(a.no).localeCompare(String(b.no), 'tr', { numeric: true }));
    // Z ve T puanı: sınava giren bütün kâğıtlar içinde; toplamda başarı oranı, derste net üzerinden
    standartla(satirlar, s => s.basari, (s, z) => { s.z = z; s.t = z == null ? null : 50 + 10 * z; });
    for (const ders of sinav.dersler) {
      standartla(satirlar.filter(s => s.dersler[ders.id]), s => s.dersler[ders.id].net,
        (s, z) => { const p = s.dersler[ders.id]; p.z = z; p.t = z == null ? null : 50 + 10 * z; });
    }

    const ortalama = (grup) => {
      const o = { kisi: grup.length, toplam: null, basari: null, dersler: {} };
      if (!grup.length) return o;
      o.toplam = grup.reduce((t, s) => t + s.toplam, 0) / grup.length;
      // ortalama başarı: öğrenci başarılarının ortalaması (bir dersi girmeyen öğrenci kendi paydasıyla katılır)
      const b = grup.filter(s => s.basari != null);
      if (b.length) o.basari = b.reduce((t, s) => t + s.basari, 0) / b.length;
      for (const ders of sinav.dersler) {
        const g = grup.filter(s => s.dersler[ders.id]);
        if (!g.length) continue;
        const top = (f) => g.reduce((t, s) => t + s.dersler[ders.id][f], 0) / g.length;
        const net = top('net');
        o.dersler[ders.id] = { kisi: g.length, d: top('d'), y: top('y'), b: top('b'), net, basari: gecerli[ders.id] ? net / gecerli[ders.id] : null };
      }
      return o;
    };
    const sinifOrt = {};
    Object.keys(siniflar).sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }))
      .forEach(s => (sinifOrt[s] = ortalama(siniflar[s])));
    return { sinav, satirlar, genel: ortalama(satirlar), siniflar: sinifOrt };
  }

  /* Soru analizi: güçlük (doğru oranı), şık dağılımı, ayırt edicilik (üst %27 − alt %27).
   * Yalnız A kitapçığı ya da anahtarı A ile aynı sırada olan kâğıtlar alınır;
   * B kitapçığının soru eşlemesi bilinmeden karıştırılmaz. */
  function soruAnalizi(hesap, dersId) {
    const ders = hesap.sinav.dersler.find(d => d.id === dersId);
    if (!ders) return null;
    const anahtar = dersAnahtari(ders, 'A');
    const grup = hesap.satirlar.filter(s => s.dersler[dersId] && (s.kagit.kitapcik || 'A') === 'A' && s.kagit.cevap && s.kagit.cevap[dersId] != null);
    const n = grup.length;
    const sirali = grup.slice().sort((a, b) => b.dersler[dersId].net - a.dersler[dersId].net);
    const dilim = Math.max(1, Math.round(n * 0.27));
    const ust = new Set(sirali.slice(0, dilim)), alt = new Set(sirali.slice(-dilim));
    const sorular = [];
    for (let i = 0; i < ders.soru; i++) {
      const dag = { A: 0, B: 0, C: 0, D: 0, E: 0, '-': 0, '*': 0 };
      let dogru = 0, ustD = 0, altD = 0;
      const kabul = anahtar[i] || '';
      for (const s of grup) {
        const c = s.kagit.cevap[dersId][i] || '-';
        dag[c] = (dag[c] || 0) + 1;
        const dg = kabul !== 'X' && c !== '-' && c !== '*' && kabul.indexOf(c) >= 0;
        if (dg) { dogru++; if (ust.has(s)) ustD++; if (alt.has(s)) altD++; }
      }
      // en çok seçilen yanlış şık (çeldirici); iptal soruda yok
      const iptal = kabul === 'X';
      let celdirici = null;
      if (!iptal) for (const h of HARFLER) if (kabul.indexOf(h) < 0 && dag[h] && (!celdirici || dag[h] > dag[celdirici])) celdirici = h;
      sorular.push({
        no: i + 1, anahtar: kabul, kisi: n, dogru,
        guclukP: iptal || !n ? null : dogru / n,
        ayirt: !iptal && n >= 4 ? (ustD - altD) / dilim : null,
        bos: dag['-'], cift: dag['*'], dagilim: dag, celdirici,
        kazanim: (ders.kazanim && ders.kazanim[i]) || [],
      });
    }
    const disarida = hesap.satirlar.filter(s => s.dersler[dersId] && s.kagit.cevap && s.kagit.cevap[dersId] != null).length - n;
    return { ders, kisi: n, disarida, sorular };
  }

  /* Kazanım analizi: her kazanım için soru sayısı, sınıf başarısı ve öğrenci bazlı başarı.
   * grupla(kimlik) verilirse aynı grup anahtarına düşen kazanımlar tek satırda toplanır (ör. öğrenme çıktısı kodu);
   * bir soru bir gruba bir kez sayılır. */
  function kazanimAnalizi(hesap, dersId, grupla = null) {
    const sa = soruAnalizi(hesap, dersId);
    if (!sa) return null;
    const kaz = new Map();
    for (const s of sa.sorular) {
      for (const k of new Set(grupla ? s.kazanim.map(grupla) : s.kazanim)) {
        if (!kaz.has(k)) kaz.set(k, { kimlik: k, sorular: [], dogru: 0, toplam: 0 });
        const e = kaz.get(k);
        e.sorular.push(s.no);
        if (s.anahtar !== 'X') { e.dogru += s.dogru; e.toplam += s.kisi; }
      }
    }
    const grup = hesap.satirlar.filter(s => s.dersler[dersId] && (s.kagit.kitapcik || 'A') === 'A' && s.kagit.cevap && s.kagit.cevap[dersId] != null);
    const anahtar = dersAnahtari(sa.ders, 'A');
    const ogrenci = grup.map(s => {
      const bas = {};
      for (const e of kaz.values()) {
        let d = 0, t = 0;
        for (const no of e.sorular) {
          const kabul = anahtar[no - 1];
          if (!kabul || kabul === 'X') continue; // anahtar soru sayısından kısaysa
          t++;
          const c = s.kagit.cevap[dersId][no - 1] || '-';
          if (c !== '-' && c !== '*' && kabul.indexOf(c) >= 0) d++;
        }
        bas[e.kimlik] = t ? d / t : null;
      }
      return { no: s.no, sinif: s.sinif, basari: bas };
    });
    const liste = [...kaz.values()].map(e => ({ ...e, basari: e.toplam ? e.dogru / e.toplam : null }));
    return { ders: sa.ders, kazanimlar: liste, ogrenci };
  }

  const dogruMu = (c, kabul) => c !== '-' && c !== '*' && kabul.indexOf(c) >= 0;
  // soruAnalizi ile aynı kural: kazanım ve zorluk A kitapçığının soru sırasıyla
  const aGrubu = (hesap, dersId) => hesap.satirlar.filter(s => s.dersler[dersId] && (s.kagit.kitapcik || 'A') === 'A' && s.kagit.cevap && s.kagit.cevap[dersId] != null);

  /* Kazanım geçmişi: bir öğrencinin bir dersteki kazanımları sınavlar boyunca.
   * grupla(kimlik) → anahtar (ör. öğrenme çıktısı kodu); farklı yayınların aynı kodlu kazanımları birleşir,
   * bir soru bir gruba bir kez sayılır. Yalnız öğrencinin A kitapçığıyla girdiği, o derste kazanımı olan sınavlar.
   * Her kazanım: sinav[id] = [{no, sonuc: d|y|b}], öğrencinin d/t'si ve aynı sorularda sınava girenlerin doğru oranı. */
  function kazanimGecmisi(hesaplar, no, dersId, grupla = null) {
    const ilgili = hesaplar.filter(h => h.sinav.dersler.some(d => d.id === dersId && Array.isArray(d.kazanim) && d.kazanim.some(k => k && k.length)))
      .sort((a, b) => String(a.sinav.tarih).localeCompare(String(b.sinav.tarih)));
    const sinavlar = [], kaz = new Map();
    for (const h of ilgili) {
      const grup = aGrubu(h, dersId);
      const s = grup.find(x => String(x.no) === String(no));
      if (!s) continue;
      const ders = h.sinav.dersler.find(d => d.id === dersId);
      const anahtar = dersAnahtari(ders, 'A');
      sinavlar.push({ id: h.sinav.id, ad: h.sinav.ad, tarih: h.sinav.tarih });
      for (let i = 0; i < ders.soru; i++) {
        const kabul = anahtar[i], ks = ders.kazanim[i] || [];
        if (!kabul || kabul === 'X' || !ks.length) continue;
        const c = s.kagit.cevap[dersId][i] || '-';
        const sonuc = c === '-' ? 'b' : dogruMu(c, kabul) ? 'd' : 'y';
        const gd = grup.filter(x => dogruMu(x.kagit.cevap[dersId][i] || '-', kabul)).length;
        for (const k of new Set(grupla ? ks.map(grupla) : ks)) {
          if (!kaz.has(k)) kaz.set(k, { kimlik: k, sinav: {}, d: 0, t: 0, gd: 0, gt: 0 });
          const e = kaz.get(k);
          (e.sinav[h.sinav.id] = e.sinav[h.sinav.id] || []).push({ no: i + 1, sonuc });
          e.t++; if (sonuc === 'd') e.d++;
          e.gd += gd; e.gt += grup.length;
        }
      }
    }
    return { sinavlar, kazanimlar: [...kaz.values()].map(e => ({ ...e, basari: e.t ? e.d / e.t : null, grupBasari: e.gt ? e.gd / e.gt : null })) };
  }

  /* Zorluk profili. Sorunun zorluğu p = o sınava girenlerin (A kitapçığı) doğru oranı; öğrencinin kendi
   * sorusunda p kendisi çıkarılarak hesaplanır (kendi cevabı zorluğu etkilemesin). enAz kişiden az girilen
   * ders-sınavlar dışarıda (p oynak olur). Dilimler ZORLUK_DILIM alt sınırlarıyla: çok kolay p ≥ 0,8 … çok zor < 0,2.
   * Eşik: öğrencinin başarısının %50'nin altına ilk indiği yer; iki dilimin ortalama p'leri arasında doğrusal ara
   * değerle bulunan p (ör. 0,55 = "sınava girenlerin %55'inin çözdüğü sorulardan itibaren yarıdan azını çözüyor").
   * Yalnız en az enAzSoru sorulu dilimler kullanılır; durum: ara | ust (hiç inmiyor) | alt (en kolayda da altında) | az. */
  const ZORLUK_DILIM = [0.8, 0.6, 0.4, 0.2, 0];
  const dilimBul = (p) => ZORLUK_DILIM.findIndex(a => p >= a);
  function zorlukEsigi(dilim, enAzSoru = 5) {
    const n = dilim.filter(x => x.t >= enAzSoru).map(x => ({ p: x.pt / x.t, b: x.d / x.t }));
    if (n.length < 2) return { esik: null, durum: 'az' };
    const i = n.findIndex(x => x.b < 0.5);
    if (i < 0) return { esik: null, durum: 'ust' };
    if (i === 0) return { esik: null, durum: 'alt' };
    const a = n[i - 1], b = n[i];
    return { esik: a.p + (a.b - 0.5) * (b.p - a.p) / (a.b - b.b), durum: 'ara' };
  }
  function zorlukProfili(hesaplar, dersId = null, enAz = 8) {
    enAz = Math.max(2, enAz); // kendisi çıkarılınca en az bir kişi kalsın
    const bos = () => ZORLUK_DILIM.map(() => ({ d: 0, t: 0, pt: 0 }));
    const ogr = new Map(), sinavlar = [], sorular = [];
    for (const h of hesaplar) {
      let soru = 0, pt = 0;
      const dagilim = ZORLUK_DILIM.map(() => 0);
      for (const ders of h.sinav.dersler) {
        if (dersId && ders.id !== dersId) continue;
        const grup = aGrubu(h, ders.id), n = grup.length;
        if (n < enAz) continue;
        const anahtar = dersAnahtari(ders, 'A');
        for (let i = 0; i < ders.soru; i++) {
          const kabul = anahtar[i];
          if (!kabul || kabul === 'X') continue;
          const dg = grup.map(x => dogruMu(x.kagit.cevap[ders.id][i] || '-', kabul));
          const top = dg.filter(Boolean).length, p = top / n;
          soru++; pt += p; dagilim[dilimBul(p)]++;
          // en çok işaretlenen yanlış şık: çoğunluk aynı yanlışta buluşuyorsa anahtar hatası olabilir
          const say = {};
          grup.forEach((x, j) => { const c = x.kagit.cevap[ders.id][i] || '-'; if (!dg[j] && HARFLER.includes(c)) say[c] = (say[c] || 0) + 1; });
          const sik = Object.keys(say).sort((a, b) => say[b] - say[a])[0] || null;
          sorular.push({ sinavId: h.sinav.id, dersId: ders.id, no: i + 1, p, kisi: n, anahtar: kabul, yanlisSik: sik, yanlisN: sik ? say[sik] : 0, kazanim: (ders.kazanim && ders.kazanim[i]) || [] });
          grup.forEach((x, j) => {
            const pk = (top - (dg[j] ? 1 : 0)) / (n - 1);
            const key = String(x.no);
            if (!ogr.has(key)) ogr.set(key, { no: x.no, sinif: x.sinif, dilim: bos() });
            const o = ogr.get(key); o.sinif = x.sinif;
            const e = o.dilim[dilimBul(pk)];
            e.t++; e.pt += pk; if (dg[j]) e.d++;
          });
        }
      }
      if (soru) sinavlar.push({ id: h.sinav.id, ad: h.sinav.ad, tarih: h.sinav.tarih, seviye: h.sinav.seviye, soru, ort: pt / soru, dagilim });
    }
    const ogrenci = [...ogr.values()].map(o => {
      const d = o.dilim.reduce((t, x) => t + x.d, 0), t = o.dilim.reduce((s, x) => s + x.t, 0);
      return { ...o, d, t, basari: t ? d / t : null, ...zorlukEsigi(o.dilim) };
    });
    return { dilimler: ZORLUK_DILIM, sinavlar, sorular, ogrenci };
  }

  /* Sınavlar arası konu takibi (koçun AKAS konu kodları, ders.konu[soru] = kod).
   * Her konu için sınav başına soru numaraları, sınıf başarısı; her öğrenci için o konunun
   * bütün sorularındaki doğru oranı. Yalnız A kitapçığı (soruAnalizi ile aynı kural). */
  function konuTakibi(hesaplar, dersId) {
    const ilgili = hesaplar.filter(h => h.sinav.dersler.some(d => d.id === dersId && Array.isArray(d.konu)))
      .sort((a, b) => String(a.sinav.tarih).localeCompare(String(b.sinav.tarih)));
    const konular = new Map();
    const ogrenci = new Map();
    for (const h of ilgili) {
      const ders = h.sinav.dersler.find(d => d.id === dersId);
      const anahtar = dersAnahtari(ders, 'A');
      const grup = h.satirlar.filter(s => s.dersler[dersId] && (s.kagit.kitapcik || 'A') === 'A' && s.kagit.cevap && s.kagit.cevap[dersId] != null);
      for (let i = 0; i < ders.soru; i++) {
        const kod = ders.konu[i], kabul = anahtar[i];
        if (!kod || !kabul || kabul === 'X') continue;
        if (!konular.has(kod)) konular.set(kod, { kod, sinav: {}, soru: 0, dogru: 0, toplam: 0 });
        const k = konular.get(kod);
        (k.sinav[h.sinav.id] = k.sinav[h.sinav.id] || []).push(i + 1);
        k.soru++;
        for (const s of grup) {
          const c = s.kagit.cevap[dersId][i] || '-';
          const dg = c !== '-' && c !== '*' && kabul.indexOf(c) >= 0;
          k.toplam++; if (dg) k.dogru++;
          const key = String(s.no);
          if (!ogrenci.has(key)) ogrenci.set(key, { no: s.no, sinif: s.sinif, konu: {} });
          const o = ogrenci.get(key); o.sinif = s.sinif;
          const e = o.konu[kod] = o.konu[kod] || { d: 0, t: 0, sinav: {} };
          e.t++; if (dg) e.d++;
          const es = e.sinav[h.sinav.id] = e.sinav[h.sinav.id] || { d: 0, t: 0 };
          es.t++; if (dg) es.d++;
        }
      }
    }
    return {
      sinavlar: ilgili.map(h => ({ id: h.sinav.id, ad: h.sinav.ad, tarih: h.sinav.tarih })),
      konular: [...konular.values()].map(k => ({ ...k, basari: k.toplam ? k.dogru / k.toplam : null })),
      ogrenci: [...ogrenci.values()],
    };
  }

  /* Kopya analizi: aynı kitapçıktaki her öğrenci çifti için ortak yanlış (ikisinin de aynı yanlış şıkkı
   * işaretlediği soru) sayısı, bu sayının bağımsız çalışan iki öğrenciden beklenen değeri ve
   * "en az bu kadar ortak yanlış" olasılığı.
   * Beklenti: ikisinin de yanlış yaptığı her soruda aynı şıkkı seçme olasılığı = Σ p², p = o soruda yanlış
   * şıkların sınıftaki seçilme oranları (çiftin kendisi hariç, her şıkka +0,5 düzeltme; az düzeltme beklentiyi
   * düşürmez, yani temkinlidir). Popüler bir çeldiricide
   * buluşmak az, kimsenin seçmediği şıkta buluşmak çok şüphelidir. Toplam olasılık Poisson-binom dağılımından;
   * çok sayıda çift karşılaştırıldığı için olasılık çift sayısıyla çarpılır (Bonferroni).
   * Ayrıca Harpp-Hogan oranı: ortak yanlış ÷ farklı cevaplanan soru. Sonuç kanıt değil, inceleme işaretidir. */
  function kopyaAnalizi(hesap) {
    const dersler = hesap.sinav.dersler.filter(d => !d.elle);
    const kagitlar = hesap.satirlar.filter(s => s.no && s.kagit.cevap && dersler.some(d => s.kagit.cevap[d.id] != null));
    const gruplar = new Map();
    kagitlar.forEach(s => { const k = s.kagit.kitapcik || 'A'; (gruplar.get(k) || gruplar.set(k, []).get(k)).push(s); });
    const ciftler = [];
    let ciftSayisi = 0;
    for (const [kitapcik, grup] of gruplar) {
      // soru listesi: [dersId, i, kabul, yanlış şıklar]
      const sorular = [];
      for (const d of dersler) {
        const anahtar = dersAnahtari(d, kitapcik);
        for (let i = 0; i < d.soru; i++) {
          const kabul = anahtar[i];
          if (!kabul || kabul === 'X') continue;
          sorular.push({ dersId: d.id, i, kabul, yanlislar: HARFLER.split('').filter(h => kabul.indexOf(h) < 0) });
        }
      }
      const cevap = (s, q) => { const c = s.kagit.cevap[q.dersId]; return c == null ? null : (c[q.i] || '-'); };
      const yanlisMi = (c, q) => c && c !== '-' && c !== '*' && q.kabul.indexOf(c) < 0;
      // her soruda yanlış şıkların sayımı
      const sayim = sorular.map(q => {
        const n = {};
        for (const s of grup) { const c = cevap(s, q); if (yanlisMi(c, q)) n[c] = (n[c] || 0) + 1; }
        return n;
      });
      ciftSayisi += grup.length * (grup.length - 1) / 2;
      for (let a = 0; a < grup.length; a++) {
        for (let b = a + 1; b < grup.length; b++) {
          const A = grup[a], B = grup[b];
          let ortak = 0, ortakBos = 0, farkli = 0, ikisiYanlis = 0, beklenen = 0;
          const ortakDers = {};
          const olas = [];
          sorular.forEach((q, j) => {
            const ca = cevap(A, q), cb = cevap(B, q);
            if (ca == null || cb == null) return;
            if (ca !== cb) farkli++;
            if (ca === '-' && cb === '-') ortakBos++;
            if (!yanlisMi(ca, q) || !yanlisMi(cb, q)) return;
            ikisiYanlis++;
            const n = sayim[j];
            let toplam = 0;
            const p = q.yanlislar.map(h => { const v = (n[h] || 0) - (ca === h) - (cb === h) + 0.5; toplam += v; return v; });
            const s = p.reduce((t, v) => t + (v / toplam) ** 2, 0);
            olas.push(s); beklenen += s;
            if (ca === cb) { ortak++; ortakDers[q.dersId] = (ortakDers[q.dersId] || 0) + 1; }
          });
          if (!ortak) continue;
          // Poisson-binom kuyruğu: P(X ≥ ortak)
          let dag = [1];
          for (const s of olas) {
            const yeni = new Array(dag.length + 1).fill(0);
            dag.forEach((v, k) => { yeni[k] += v * (1 - s); yeni[k + 1] += v * s; });
            dag = yeni;
          }
          const p = Math.min(1, dag.slice(ortak).reduce((t, v) => t + v, 0));
          ciftler.push({ a: A.no, b: B.no, sinifA: A.sinif, sinifB: B.sinif, kitapcik, ortak, ortakDers, ortakBos, ikisiYanlis, farkli, beklenen, oran: farkli ? ortak / farkli : null, p });
        }
      }
    }
    ciftler.forEach(c => { c.pDuzeltilmis = Math.min(1, c.p * ciftSayisi); c.duzey = c.pDuzeltilmis < 0.001 ? 'guclu' : c.pDuzeltilmis < 0.05 ? 'dikkat' : ''; });
    ciftler.sort((x, y) => x.p - y.p || y.ortak - x.ortak);
    return { kagit: kagitlar.length, ciftSayisi, ciftler };
  }

  /* Öğrencinin bu sınavdaki T puanının önceki denemelerine göre sapması (kopya analizinde bilgi olarak).
   * Net yerine T: sınavların zorluğu ve soru sayısı farklıdır. Önceki = bu sınavdan önceki en çok 5 deneme;
   * en az 2 önceki deneme yoksa null. dersler: ders adına göre aynı hesap (ders T puanıyla). */
  function oncekiSapma(hesaplar, sinavId, no, enCok = 5) {
    const g = ogrenciGelisimi(hesaplar, no);
    const simdi = g.find(x => x.sinavId === sinavId);
    if (!simdi || simdi.t == null) return null;
    const onceki = g.filter(x => x.sinavId !== sinavId && String(x.tarih) < String(simdi.tarih));
    const ozet = (deger) => {
      const v = onceki.map(deger).filter(z => z != null).slice(-enCok);
      return v.length >= 2 ? { onceki: v.reduce((t, z) => t + z, 0) / v.length, n: v.length } : null;
    };
    const top = ozet(x => x.t);
    if (!top) return null;
    const dersler = {};
    for (const d of simdi.dersler) {
      if (d.t == null) continue;
      const o = ozet(x => { const e = x.dersler.find(z => z.ad === d.ad); return e ? e.t : null; });
      if (o) dersler[d.id] = { ad: d.ad, simdi: d.t, ...o, fark: d.t - o.onceki };
    }
    return { simdi: simdi.t, ...top, fark: simdi.t - top.onceki, dersler };
  }

  /* ---------- YKS puan tahmini ----------
   * ÖSYM yöntemi (YKS Kılavuzu 3.10.1): her testte ham puan = doğru − yanlış ÷ 4; ham puan son sınıf adaylarının
   * ortalama ve standart sapmasıyla 50 + 10z standart puana çevrilir; standart puanlar Tablo 1C / 1E ağırlıklarıyla
   * toplanır (A-puan; SAY, EA ve SÖZ'e A-TYT'nin %40'ı da girer) ve A-puan kendi içinde 100–500'e doğrusal yayılır.
   * Ortalama ve sapmalar 2026 YKS Sayısal Bilgiler'den. ÖSYM 100 ve 500'ün karşılığı olan A-puanlarını yayımlamaz;
   * min / max, araclar/puan_kalibrasyon.py ile 2026 puan dağılımından tahmin edildi. Sonuç tahminidir; OBP eklenmez.
   * Netler hiçbir zaman büyütülmez: bir testin sınavdaki soru sayısı ÖSYM'dekinden fazlaysa net ÖSYM soru sayısına
   * oranla küçültülür, azsa olduğu gibi alınır (ara sınıf denemesinde sorulmayan konular "yapılmış" sayılmaz). */
  const OSYM = {
    yil: 2026,
    test: {
      tr: { ad: 'Türkçe', ort: 20.5, ss: 8.4, soru: 40 },
      sos: { ad: 'Sosyal Bilimler', ort: 10.2, ss: 3.9, soru: 20 },
      tmat: { ad: 'Temel Matematik', ort: 6.8, ss: 8.0, soru: 40 },
      fen: { ad: 'Fen Bilimleri', ort: 4.3, ss: 5.3, soru: 20 },
      tde: { ad: 'Türk Dili ve Edebiyatı', ort: 6.1, ss: 5.2, soru: 23 }, // soru: o yılın geçerli soru sayısı (2026'da 1 iptal)
      tar1: { ad: 'Tarih-1', ort: 2.6, ss: 2.7, soru: 10 },
      cog1: { ad: 'Coğrafya-1', ort: 1.7, ss: 1.8, soru: 6 },
      tar2: { ad: 'Tarih-2', ort: 1.7, ss: 2.3, soru: 11 },
      cog2: { ad: 'Coğrafya-2', ort: 2.1, ss: 2.5, soru: 11 },
      fel: { ad: 'Felsefe Grubu', ort: 1.6, ss: 2.1, soru: 12 },
      dkab: { ad: 'Din Kültürü', ort: 1.9, ss: 2.2, soru: 6 },
      mat: { ad: 'Matematik', ort: 7.0, ss: 9.1, soru: 39 }, // 2026'da 1 iptal; max bu sayıyla hesaplandı
      fiz: { ad: 'Fizik', ort: 2.7, ss: 3.7, soru: 14 },
      kim: { ad: 'Kimya', ort: 2.2, ss: 3.7, soru: 13 },
      bio: { ad: 'Biyoloji', ort: 3.0, ss: 3.6, soru: 13 },
    },
    // kosul: puan için gruplardan en az birinde 0,5 ham puan (Kılavuz Tablo 1D; grup ÖSYM'de tek testtir, ör. Fen Bilimleri)
    tur: {
      TYT: { ad: 'TYT', agirlik: { tr: 0.33, sos: 0.17, tmat: 0.33, fen: 0.17 }, kosul: [['tr'], ['tmat']], min: 31.76, max: 80.66 },
      SAY: { ad: 'SAY', agirlik: { mat: 0.30, fiz: 0.10, kim: 0.10, bio: 0.10 }, kosul: [['mat'], ['fiz', 'kim', 'bio']], min: 38.88, max: 81.57 },
      EA: { ad: 'EA', agirlik: { mat: 0.30, tde: 0.18, tar1: 0.07, cog1: 0.05 }, kosul: [['mat'], ['tde', 'tar1', 'cog1']], min: 38.12, max: 81.78 },
      SOZ: { ad: 'SÖZ', agirlik: { tde: 0.18, tar1: 0.07, cog1: 0.05, tar2: 0.08, cog2: 0.08, fel: 0.09, dkab: 0.05 }, kosul: [['tde', 'tar1', 'cog1'], ['tar2', 'cog2', 'fel', 'dkab']], min: 40.54, max: 82.70 },
    },
    tytPayi: 0.40,
  };

  // Ders adı karşılaştırması için: küçük harf, Türkçe harfler sadeleşir ("FIZIK", "Cografya", "Tarih-II" → fizik, cografya, tarih-ii)
  const sade = (s) => String(s || '').toLocaleLowerCase('tr').replace(/ı/g, 'i').normalize('NFD').replace(/\p{M}/gu, '');

  // Ara sınıf ve TYT denemesinde dersin girdiği TYT testi
  function tytTesti(ders) {
    const a = sade(ders.ad);
    if (/turkce|edebiyat|turk dili|dil ve anlatim/.test(a)) return 'tr';
    if (/matematik|geometri/.test(a)) return 'tmat';
    if (/sosyal|tarih|cografya|felsefe|\bdin\b|mantik|psikoloji|sosyoloji|inkilap/.test(a)) return 'sos';
    if (/\bfen\b|fizik|kimya|biyoloji/.test(a)) return 'fen';
    return null;
  }

  /* AYT denemesinde dersin testi; "Sosyal Bilimler-1", "Fen Bilimleri" gibi birleşik dersler ayrılamaz (null).
   * Tarih / Coğrafya düzeyi yalnız adın hemen ardındaki 1, 2, I, II'den okunur ("12. Sınıf Tarih" düzey değildir);
   * yoksa soru sayısından. İnkılap ve Çağdaş Tarih AYT testi değildir. */
  function aytTesti(ders) {
    const a = sade(ders.ad);
    const duzey = (ad) => { const m = a.match(new RegExp(ad + '\\s*[-–]?\\s*(ii|2|i|1)(?![a-z0-9])')); return m ? (m[1] === 'ii' || m[1] === '2' ? 2 : 1) : (ders.soru >= 11 ? 2 : 1); };
    if (/edebiyat|turk dili/.test(a)) return 'tde';
    if (/inkilap|cagdas/.test(a)) return null;
    if (/tarih/.test(a)) return duzey('tarih') === 2 ? 'tar2' : 'tar1';
    if (/cografya/.test(a)) return duzey('cografya') === 2 ? 'cog2' : 'cog1';
    if (/felsefe|mantik|psikoloji|sosyoloji/.test(a)) return 'fel';
    if (/\bdin\b/.test(a)) return 'dkab';
    if (/matematik|geometri/.test(a)) return 'mat';
    if (/fizik/.test(a)) return 'fiz';
    if (/kimya/.test(a)) return 'kim';
    if (/biyoloji/.test(a)) return 'bio';
    return null;
  }

  // Sınavın derslerini testlere eşler: soru = testin sınavdaki geçerli soru sayısı, olcek = min(1, ÖSYM ÷ sınav)
  function testBilgisi(sinav, esle) {
    const ders = {}, soru = {}, kitapcik = {}, olcek = {};
    for (const d of sinav.dersler) {
      const k = esle(d);
      if (!k) continue;
      ders[d.id] = k;
      soru[k] = (soru[k] || 0) + (gecerliSoru(d) || d.soru);
      kitapcik[k] = (kitapcik[k] || 0) + d.soru; // iptal sorular dahil (tür tanımada)
    }
    for (const k of Object.keys(soru)) olcek[k] = Math.min(1, OSYM.test[k].soru / soru[k]);
    return { ders, soru, kitapcik, olcek };
  }

  /* Puan türü kendiliğinden: dersleri TYT'deki gibi 40/20/40/20 ise 'tyt'; 11. sınıf ve üstünde Türkçe yokken
   * AYT dersleri varsa 'ayt'; geri kalanı 'ara' (TYT'ye yaklaşık). Koç sinav.puanTuru ile değiştirebilir ('yok' dahil). */
  function puanTuruTahmin(sinav) {
    const s = testBilgisi(sinav, tytTesti).kitapcik;
    if (s.tr === 40 && s.sos === 20 && s.tmat === 40 && s.fen === 20) return 'tyt';
    const adlar = sinav.dersler.map(d => sade(d.ad));
    if ((sinav.seviye == null || sinav.seviye >= 11) && !adlar.some(a => /turkce/.test(a)) && sinav.dersler.some(d => { const k = aytTesti(d); return k && k !== 'mat'; })) return 'ayt';
    return 'ara';
  }
  function puanTuru(sinav) {
    return ['tyt', 'ayt', 'ara', 'yok'].includes(sinav.puanTuru) ? sinav.puanTuru : puanTuruTahmin(sinav);
  }

  /* AYT denemesinin TYT eşi: koçun seçtiği (silinmişse kendiliğinden olana dönülür) ya da 14 gün içindeki TYT denemesi
   * (önce aynı yayın, sonra en yakın tarih). */
  function tytEsiBul(sinav, sinavlar) {
    const secili = sinav.tytEsi && sinavlar.find(s => s.id === sinav.tytEsi && s.id !== sinav.id);
    if (secili) return secili;
    const gun = (t) => Date.parse(t) / 864e5;
    const g0 = gun(sinav.tarih);
    if (isNaN(g0)) return null;
    const adaylar = sinavlar.filter(s => s.id !== sinav.id && puanTuru(s) === 'tyt' && Math.abs(gun(s.tarih) - g0) <= 14);
    const ayni = (s) => Number(!!(s.yayin && s.yayin === sinav.yayin));
    adaylar.sort((a, b) => (ayni(b) - ayni(a))
      || Math.abs(gun(a.tarih) - g0) - Math.abs(gun(b.tarih) - g0) || gun(a.tarih) - gun(b.tarih));
    return adaylar[0] || null;
  }

  // Öğrencinin test netleri (ÖSYM kuralı: 4 yanlış 1 doğruyu götürür), ölçekli; girdiği ders yoksa null
  function testNetleri(satir, bilgi) {
    if (!satir) return null;
    const ham = {};
    let girdi = false;
    for (const [dersId, k] of Object.entries(bilgi.ders)) {
      const p = satir.dersler[dersId]; // girmediği ders boş sayılır (ÖSYM'de boş = 0)
      ham[k] = (ham[k] || 0) + (p ? p.d - p.y / 4 : 0);
      if (p) girdi = true;
    }
    if (!girdi) return null;
    const net = {};
    for (const k of Object.keys(bilgi.soru)) net[k] = (ham[k] || 0) * bilgi.olcek[k];
    return net;
  }

  const aPuan = (net, agirlik) => Object.entries(agirlik).reduce((t, [k, w]) => t + w * (50 + 10 * ((net[k] || 0) - OSYM.test[k].ort) / OSYM.test[k].ss), 0);
  const uygunMu = (net, kosul) => kosul.some(g => g.reduce((t, k) => t + (net[k] || 0), 0) >= 0.5);
  const olcekle = (a, tur) => Math.max(100, Math.min(500, 100 + 400 * (a - tur.min) / (tur.max - tur.min)));

  /* Bir net, puana kaç puan ekler (puan türüne göre; TYT testleri SAY / EA / SÖZ'de %40 ağırlıkla). */
  function netDegeri(turAd) {
    const tur = OSYM.tur[turAd];
    const k = 400 / (tur.max - tur.min);
    const sonuc = {};
    if (turAd !== 'TYT') for (const [t, w] of Object.entries(OSYM.tur.TYT.agirlik)) sonuc[t] = k * OSYM.tytPayi * w * 10 / OSYM.test[t].ss;
    for (const [t, w] of Object.entries(tur.agirlik)) sonuc[t] = k * w * 10 / OSYM.test[t].ss;
    return sonuc;
  }

  /* Sınavın puanları: { tur, turler:['TYT'] ya da ['SAY','EA','SOZ'], ogrenci: Map(no → {TYT|SAY|EA|SOZ: puan|null, net}),
   * bilgi (test eşlemesi ve ölçek), uyari:[metin] }. AYT için TYT eşinin hesabı (sinavHesapla çıktısı) verilir. */
  function puanHesapla(hesap, tytHesap) {
    const sinav = hesap.sinav;
    const tur = puanTuru(sinav);
    const sonuc = { tur, turler: [], ogrenci: new Map(), bilgi: null, uyari: [] };
    if (tur === 'yok') return sonuc;
    const tytBilgi = (s) => {
      const b = testBilgisi(s, tytTesti);
      const eksik = Object.keys(OSYM.tur.TYT.agirlik).filter(k => !b.soru[k]);
      return { b, eksik };
    };
    if (tur === 'tyt' || tur === 'ara') {
      const { b, eksik } = tytBilgi(sinav);
      sonuc.bilgi = b;
      if (eksik.length) { sonuc.uyari.push(`Puan hesaplanmadı: sınavda ${eksik.map(k => OSYM.test[k].ad).join(', ')} dersi yok.`); return sonuc; }
      sonuc.turler = ['TYT'];
      for (const s of hesap.satirlar) {
        if (s.no == null || s.no === '') continue; // numarasız kâğıt öğrenciye bağlanamaz
        const net = testNetleri(s, b);
        sonuc.ogrenci.set(String(s.no), { net, TYT: net && uygunMu(net, OSYM.tur.TYT.kosul) ? olcekle(aPuan(net, OSYM.tur.TYT.agirlik), OSYM.tur.TYT) : null });
      }
      return sonuc;
    }
    // AYT
    const b = testBilgisi(sinav, aytTesti);
    sonuc.bilgi = b;
    sonuc.turler = ['SAY', 'EA', 'SOZ'].filter(t => Object.keys(OSYM.tur[t].agirlik).every(k => b.soru[k]));
    if (!sonuc.turler.length) { sonuc.uyari.push('Puan hesaplanmadı: AYT testleri tanınmadı. Dersler ayrı ayrı (Matematik, Fizik, Kimya, Biyoloji, Edebiyat, Tarih-1, Coğrafya-1 …) girilmiş olmalı.'); return sonuc; }
    const ty = tytHesap ? tytBilgi(tytHesap.sinav) : null;
    if (!ty) { sonuc.uyari.push('SAY / EA / SÖZ puanına TYT de girer: bu AYT denemesinin TYT eşi bulunamadı. Aşağıdan TYT eşini seçin.'); }
    else if (ty.eksik.length) { sonuc.uyari.push(`Seçilen TYT eşinde ${ty.eksik.map(k => OSYM.test[k].ad).join(', ')} dersi yok; puan hesaplanmadı.`); }
    for (const s of hesap.satirlar) {
      if (s.no == null || s.no === '') continue;
      const net = testNetleri(s, b);
      const kayit = { net };
      const tytNet = ty && !ty.eksik.length ? testNetleri(tytHesap.satirlar.find(x => String(x.no) === String(s.no)), ty.b) : null;
      const aTyt = tytNet && uygunMu(tytNet, OSYM.tur.TYT.kosul) ? aPuan(tytNet, OSYM.tur.TYT.agirlik) : null;
      kayit.tytYok = aTyt == null;
      for (const t of sonuc.turler) {
        const T = OSYM.tur[t];
        kayit[t] = aTyt != null && net && uygunMu(net, T.kosul) ? olcekle(OSYM.tytPayi * aTyt + aPuan(net, T.agirlik), T) : null;
      }
      sonuc.ogrenci.set(String(s.no), kayit);
    }
    return sonuc;
  }

  /* Öğrencinin sınavlar arası gelişimi (ders adıyla eşleşir; tarih sırasına göre). */
  function ogrenciGelisimi(hesaplar, no) {
    return hesaplar
      .slice()
      .sort((a, b) => String(a.sinav.tarih).localeCompare(String(b.sinav.tarih)))
      .map(h => {
        const s = h.satirlar.find(x => String(x.no) === String(no));
        if (!s) return null;
        const sinifOrt = h.siniflar[s.sinif];
        return {
          sinavId: h.sinav.id, sinavAd: h.sinav.ad, tarih: h.sinav.tarih,
          toplam: s.toplam, sira: s.sira, kisi: h.satirlar.length,
          sinifSira: s.sinifSira, sinifKisi: sinifOrt ? sinifOrt.kisi : null,
          genelOrt: h.genel.toplam, sinifOrt: sinifOrt ? sinifOrt.toplam : null,
          basari: s.basari, genelBasari: h.genel.basari, sinifBasari: sinifOrt ? sinifOrt.basari : null,
          z: s.z, t: s.t,
          dersler: h.sinav.dersler.filter(d => s.dersler[d.id]).map(d => ({
            id: d.id, ad: d.ad, soru: d.soru, ...s.dersler[d.id],
            genelOrt: h.genel.dersler[d.id] ? h.genel.dersler[d.id].net : null,
            sinifOrt: sinifOrt && sinifOrt.dersler[d.id] ? sinifOrt.dersler[d.id].net : null,
            sinifBasari: sinifOrt && sinifOrt.dersler[d.id] ? sinifOrt.dersler[d.id].basari : null,
          })),
        };
      })
      .filter(Boolean);
  }

  /* TestPlus değerleriyle çapraz denetim: aktarılan her kâğıt/ders için {tutan, tutmayan, ornek}. */
  function tpDenetle(sinav) {
    const h = sinavHesapla(sinav);
    let tutan = 0, tutmayan = 0;
    const ornek = [];
    for (const s of h.satirlar) {
      const tp = s.kagit.tp || {};
      for (const [dersId, v] of Object.entries(tp)) {
        const p = s.dersler[dersId];
        if (!p) continue;
        const ok = p.d === v[0] && p.y === v[1] && p.b === v[2] && Math.abs(p.net - v[3]) < 1e-9;
        if (ok) tutan++; else { tutmayan++; if (ornek.length < 5) ornek.push({ no: s.no, dersId, bizim: [p.d, p.y, p.b, p.net], tp: v }); }
      }
    }
    return { tutan, tutmayan, ornek };
  }

  /* Aktarım ya da yedek dosyasını mevcut duruma katar. Sınav kimliğe, öğrenci okul numarasına göre.
   * Aynı kimlikli sınav yenisiyle değiştirilir; elle girilmiş öğrenci adı korunur (dosyada ad yoksa). */
  function birlestir(durum, gelen) {
    const d = durum || bosDurum();
    const rapor = { yeniSinav: 0, guncelSinav: 0, yeniOgrenci: 0, kazanim: 0 };
    const sinavlar = new Map(d.sinavlar.map(s => [s.id, s]));
    for (const s of gelen.sinavlar || []) {
      const eski = sinavlar.get(s.id);
      if (eski) rapor.guncelSinav++; else rapor.yeniSinav++;
      // koçun uygulamada yaptığı seçimler yeniden aktarımda kaybolmasın
      const yeni = { ...s };
      if (eski) for (const k of ['puanTuru', 'tytEsi']) if (eski[k] != null && yeni[k] == null) yeni[k] = eski[k];
      sinavlar.set(s.id, yeni);
    }
    d.sinavlar = [...sinavlar.values()].sort((a, b) => String(a.tarih).localeCompare(String(b.tarih)));
    const ogr = new Map(d.ogrenciler.map(o => [String(o.no), o]));
    for (const o of gelen.ogrenciler || []) {
      const eski = ogr.get(String(o.no));
      if (!eski) { ogr.set(String(o.no), { ...o }); rapor.yeniOgrenci++; continue; }
      if (o.ad) eski.ad = o.ad;
      if (o.sinif) eski.sinif = o.sinif;
    }
    d.ogrenciler = [...ogr.values()];
    const kaz = new Map(d.kazanimlar.map(k => [k.id, k]));
    for (const k of gelen.kazanimlar || []) { if (!kaz.has(k.id)) rapor.kazanim++; kaz.set(k.id, { ...kaz.get(k.id), ...k }); }
    d.kazanimlar = [...kaz.values()];
    const konu = new Map((d.konular || []).map(k => [k.id, k]));
    for (const k of gelen.konular || []) konu.set(k.id, { ...konu.get(k.id), ...k });
    d.konular = [...konu.values()];
    // telefonla okunan sınavların tanımı ve kâğıtları (Aşama 2): aynı kimlikte yeni değiştirilmiş olan kalır
    const optik = new Map((d.optik || []).map(o => [o.id, o]));
    for (const o of Array.isArray(gelen.optik) ? gelen.optik : []) {
      if (!o || !o.id) continue;
      const eski = optik.get(o.id);
      if (!eski || (o.degisti || 0) >= (eski.degisti || 0)) optik.set(o.id, o);
    }
    d.optik = [...optik.values()];
    return { durum: d, rapor };
  }

  function bosDurum() {
    return { bicim: 'deneme-takip/durum', surum: 1, sinavlar: [], ogrenciler: [], kazanimlar: [], konular: [], optik: [], ayarlar: {} };
  }

  /* Bir dosyanın uygulamaya uygun olup olmadığını denetler; sorun listesini döner. */
  function dogrula(veri) {
    const sorun = [];
    if (!veri || typeof veri !== 'object') return ['Dosya JSON nesnesi değil.'];
    if (!/^deneme-takip\//.test(veri.bicim || '')) sorun.push('Bu dosya Deneme Takip dosyası değil.');
    if (!Array.isArray(veri.sinavlar)) sorun.push('Sınav listesi yok.');
    if (!Array.isArray(veri.ogrenciler)) sorun.push('Öğrenci listesi yok.');
    if ('kazanimlar' in veri && !Array.isArray(veri.kazanimlar)) sorun.push('Kazanım listesi bozuk.');
    if ('konular' in veri && !Array.isArray(veri.konular)) sorun.push('Konu listesi bozuk.');
    if ('optik' in veri && !Array.isArray(veri.optik)) sorun.push('Optik sınav listesi bozuk.');
    const sayiMi = (x) => typeof x === 'number' && Number.isFinite(x);
    for (const s of Array.isArray(veri.sinavlar) ? veri.sinavlar : []) {
      if (!s || !s.id || !Array.isArray(s.dersler) || !s.dersler.length || !Array.isArray(s.kagitlar)) { sorun.push(`Sınav eksik: ${(s && (s.ad || s.id)) || '?'}`); continue; }
      if (s.seviye != null && !Number.isInteger(s.seviye)) sorun.push(`${s.ad}: sınıf düzeyi geçersiz.`);
      if (s.tarih && !/^\d{4}-\d{2}-\d{2}$/.test(s.tarih)) sorun.push(`${s.ad}: tarih geçersiz.`);
      const kimlik = s.dersler.map(d => d && d.id);
      if (kimlik.some(k => !k) || new Set(kimlik).size !== kimlik.length) { sorun.push(`${s.ad}: ders kimliği eksik ya da yinelenmiş.`); continue; }
      for (const k of s.kagitlar) {
        if (!k || (k.cevap != null && typeof k.cevap !== 'object') || (k.elle != null && typeof k.elle !== 'object')) { sorun.push(`${s.ad}: bozuk kâğıt.`); break; }
        if (k.elle && Object.values(k.elle).some(v => !Array.isArray(v) || v.length !== 3 || !v.every(sayiMi))) { sorun.push(`${s.ad}: elle girilen değer bozuk.`); break; }
      }
      for (const d of s.dersler) {
        if (!(d.soru > 0)) { sorun.push(`${s.ad} / ${d.ad}: soru sayısı geçersiz.`); continue; }
        const a = d.anahtar && (d.anahtar.A || Object.values(d.anahtar)[0]);
        if (!a || a.length !== d.soru) sorun.push(`${s.ad} / ${d.ad}: anahtar soru sayısıyla uyuşmuyor.`);
      }
    }
    // optik sınav kaydı (Aşama 2): ekranların dayandığı alanlar
    for (const o of Array.isArray(veri.optik) ? veri.optik : []) {
      const ad = (o && (o.ad || o.id)) || '?';
      if (!o || typeof o.id !== 'string' || typeof o.ad !== 'string' || !Array.isArray(o.dersler) || !o.dersler.length || !Array.isArray(o.kagitlar)) { sorun.push(`Optik sınav eksik: ${ad}`); continue; }
      if ((o.secenek != null && ![4, 5].includes(o.secenek)) || (o.seviye != null && !Number.isInteger(o.seviye)) || !sayiMi(o.ceza || 0) || (o.tarih && !/^\d{4}-\d{2}-\d{2}$/.test(o.tarih))) sorun.push(`Optik sınav ${ad}: tanım bozuk.`);
      if (o.dersler.some(d => !d || typeof d.id !== 'string' || typeof d.ad !== 'string' || !Number.isInteger(d.soru) || d.soru < 1 || !d.anahtar || !Array.isArray(d.anahtar.A) || d.anahtar.A.length !== d.soru || (d.anahtar.B != null && !Array.isArray(d.anahtar.B)))) sorun.push(`Optik sınav ${ad}: ders ya da anahtar bozuk.`);

    if (aday.length < 4) return null;
    aday = aday.slice().sort((a, b) => b.alan - a.alan);
    const buyuk = aday.slice(0, 6).map(a => a.alan).sort((a, b) => a - b);
    const ortanca = buyuk[Math.floor(buyuk.length / 2)];
    aday = aday.filter(a => a.alan >= ortanca * 0.3 && a.alan <= ortanca * 3).slice(0, 14);
    let en = null;
    const n = aday.length;
    const yakin = (x, y, tol, haric) => {
      let b = null, bd = tol * tol;
      for (const a of aday) { if (haric.includes(a)) continue; const d = (a.x - x) ** 2 + (a.y - y) ** 2; if (d < bd) { bd = d; b = a; } }
      return b;
    };
    let gx0 = Infinity, gx1 = -Infinity, gy0 = Infinity, gy1 = -Infinity;
    for (const a of aday) { gx0 = Math.min(gx0, a.x); gx1 = Math.max(gx1, a.x); gy0 = Math.min(gy0, a.y); gy1 = Math.max(gy1, a.y); }
    const enAzAlan = (gx1 - gx0) * (gy1 - gy0) * 0.05;
    for (let a = 0; a < n; a++) for (let b = a + 1; b < n; b++) for (let c = b + 1; c < n; c++) for (let d = c + 1; d < n; d++) {
      let p = [aday[a], aday[b], aday[c], aday[d]];
      const mx = (p[0].x + p[1].x + p[2].x + p[3].x) / 4, my = (p[0].y + p[1].y + p[2].y + p[3].y) / 4;
      p = p.sort((u, v) => Math.atan2(u.y - my, u.x - mx) - Math.atan2(v.y - my, v.x - mx));
      // içbükey olmamalı
      let isaret = 0, gecersiz = false, alan = 0;
      for (let i = 0; i < 4; i++) {
        const u = p[i], v = p[(i + 1) % 4], z = p[(i + 2) % 4];
        const cr = (v.x - u.x) * (z.y - v.y) - (v.y - u.y) * (z.x - v.x);
        if (!isaret) isaret = Math.sign(cr); else if (Math.sign(cr) !== isaret) gecersiz = true;
        alan += u.x * v.y - v.x * u.y;
      }
      if (gecersiz) continue;
      alan = Math.abs(alan) / 2;
      if (alan < enAzAlan) continue;
      const kenar = (i) => Math.hypot(p[(i + 1) % 4].x - p[i].x, p[(i + 1) % 4].y - p[i].y);
      for (const kayma of [0, 1]) {
        // kayma 0: p0-p1 kısa kenar (üst ya da alt); kayma 1: p1-p2 kısa kenar
        const s = [0, 1, 2, 3].map(i => p[(i + kayma) % 4]);
        const kisa = (kenar(kayma) + kenar((kayma + 2) % 4)) / 2, uzun = (kenar((kayma + 1) % 4) + kenar((kayma + 3) % 4)) / 2;
        const oran = uzun / kisa;
        if (oran < 1.05 || oran > 2.3) continue;
        const H = homografi(SAYFA_KOSE, s.map(q => [q.x, q.y]));
        if (!H) continue;
        const tol = kisa / (ISARET.x[1] - ISARET.x[0]) * 7;
        const orta = ORTA.map(([x, y]) => { const [u, v] = uygula(H, x, y); return yakin(u, v, tol, p); });
        if (orta[0] && orta[0] === orta[1]) orta[1] = null;
        const puan = orta.filter(Boolean).length * 1e12 + alan;
        if (!en || puan > en.puan) en = { puan, kose: s, orta };
      }
    }
    return en;
  }

  // ---------------------------------------------------------------- okuma
  /* Bir eşleme (köşe sırası) için sayfa → görüntü dönüşümü: yan ortaları bulunduysa üst ve alt yarı ayrı. */
  function donusum(kose, orta) {
    const k = kose.map(q => [q.x, q.y]);
    const tek = homografi(SAYFA_KOSE, k);
    if (!orta[0] || !orta[1]) return { tum: tek, ust: tek, alt: tek, parcali: false };
    const ml = [orta[0].x, orta[0].y], mr = [orta[1].x, orta[1].y];
    const ust = homografi([SAYFA_KOSE[0], SAYFA_KOSE[1], ORTA[1], ORTA[0]], [k[0], k[1], mr, ml]);
    const alt = homografi([ORTA[0], ORTA[1], SAYFA_KOSE[2], SAYFA_KOSE[3]], [ml, mr, k[2], k[3]]);
    return { tum: tek, ust: ust || tek, alt: alt || tek, parcali: true };
  }

  // sayfa mm → görüntü pikseli; görüntüyü kapsamına almayan ayrı kapanış (sonuçta dönünce fotoğraf bellekte kalmasın)
  const noktaYap = (T) => (x, y) => uygula(y <= ISARET.y[1] ? T.ust : T.alt, x, y);

  function olcer(im, T) {
    const nokta = noktaYap(T);
    const parlak = (x, y) => { const [u, v] = nokta(x, y); return piksel(im, u, v); };
    // daire içi ortalama parlaklık (r mm), 19 örnek
    const ic = (x, y, r) => {
      let t = parlak(x, y), n = 1;
      for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3; t += parlak(x + r * 0.5 * Math.cos(a), y + r * 0.5 * Math.sin(a)); n++; }
      for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; t += parlak(x + r * Math.cos(a), y + r * Math.sin(a)); n++; }
      return t / n;
    };
    return { nokta, parlak, ic };
  }

  function otsu(degerler) {
    const v = degerler.slice().sort((a, b) => a - b);
    const n = v.length;
    let en = { esik: 0.4, ayrim: -1, alt: 0, ust: 0 };
    let sol = 0;
    const top = v.reduce((t, x) => t + x, 0);
    for (let i = 1; i < n; i++) {
      sol += v[i - 1];
      const m0 = sol / i, m1 = (top - sol) / (n - i);
      const ayrim = i * (n - i) * (m1 - m0) ** 2;
      if (ayrim > en.ayrim) en = { esik: (v[i - 1] + v[i]) / 2, ayrim, alt: m0, ust: m1 };
    }
    return en;
  }

  function koduOku(O) {
    const kara = [];
    for (let i = 0; i < KOD.sutun * KOD.satir; i++) {
      const x = KOD.x + (i % KOD.sutun + 0.5) * KOD.adim, y = KOD.y + (Math.floor(i / KOD.sutun) + 0.5) * KOD.adim;
      kara.push(O.ic(x, y, KOD.dolu * 0.3));
    }
    const beyaz = [];
    for (let c = 0; c < KOD.sutun; c++) {
      const x = KOD.x + (c + 0.5) * KOD.adim;
      beyaz.push(Math.max(O.parlak(x, KOD.y - 1.2), O.parlak(x, KOD.y + KOD.satir * KOD.adim + 1.2)));
    }
    const koyuluk = kara.map((v, i) => 1 - v / Math.max(1, beyaz[i % KOD.sutun]));
    const e = otsu(koyuluk);
    if (e.ust - e.alt < 0.2) return null;
    return kodCoz(koyuluk.map(v => (v > e.esik ? 1 : 0)));
  }

  // Kabarcık örnek noktaları (mm, merkeze göre): iç disk, basılı halka (kaba aramada üç yarıçap) ve aradaki beyaz
  const cember = (r, n) => Array.from({ length: n }, (_, i) => [r * Math.cos(2 * Math.PI * i / n), r * Math.sin(2 * Math.PI * i / n)]);
  const IC = [[0, 0], ...cember(0.6, 6), ...cember(1.15, 12)];
  const HALKA = cember(YARICAP, 16);
  const HALKA3 = [...cember(YARICAP - 0.25, 10), ...cember(YARICAP, 10), ...cember(YARICAP + 0.25, 10)];
  const HALKA_IC = cember(YARICAP - 0.65, 12), HALKA_DIS = cember(YARICAP + 0.65, 12);

  /* Yerel doğrusal yaklaşım: kabarcık merkezinin görüntü konumu ve mm başına piksel türevleri (örnekleme hızlı olsun diye). */
  function yerel(O, x, y) {
    const [u, v] = O.nokta(x, y), [u1, v1] = O.nokta(x + 1, y), [u2, v2] = O.nokta(x, y + 1);
    return { u, v, a: u1 - u, b: u2 - u, c: v1 - v, d: v2 - v };
  }
  const ornek = (im, L, x, y) => piksel(im, L.u + L.a * x + L.b * y, L.v + L.c * x + L.d * y);
  const ortalama = (im, L, noktalar, dx, dy) => { let t = 0; for (const [x, y] of noktalar) t += ornek(im, L, dx + x, dy + y); return t / noktalar.length; };

  /* Kabarcık öbeğinin basılı halkalara en iyi oturduğu kayma (mm): halka çizgisi, hemen içinden ve dışından koyu.
   * Kabarcıklar arası boşlukta çizgi olmadığından yanlış oturma ödüllenmez. Önce geniş halkayla kaba arama; geniş halka
   * yarım aralık kaymış (dolu kabarcıklar arasına) oturmayı doğru konumdan ayıramayabildiği için kaba aramanın en iyi
   * birkaç adayı ve başlangıç noktası keskin halkayla ince aranır, en iyisi seçilir. */
  function hizala(im, Ls, merkez = [0, 0], aralik = 2.4) {
    const deger = (dx, dy, halka) => {
      let t = 0;
      for (const L of Ls) t += ortalama(im, L, halka, dx, dy) - (ortalama(im, L, HALKA_IC, dx, dy) + ortalama(im, L, HALKA_DIS, dx, dy)) / 2;
      return t;
    };
    const kaba = [];
    for (let dy = -aralik; dy <= aralik + 1e-9; dy += 0.4) for (let dx = -aralik; dx <= aralik + 1e-9; dx += 0.4)
      kaba.push({ dx: merkez[0] + dx, dy: merkez[1] + dy, t: deger(merkez[0] + dx, merkez[1] + dy, HALKA3) });
    kaba.sort((a, b) => a.t - b.t);
    const adaylar = [kaba[0]];
    // dar aramada (çapalar, ±1,2 mm'ye kadar) yarım aralık kayması erişilemez; tek aday yeter
    const enCok = aralik > 2 ? 4 : 1;
    if (enCok > 1 && Math.hypot(kaba[0].dx - merkez[0], kaba[0].dy - merkez[1]) > 0.3) adaylar.push({ dx: merkez[0], dy: merkez[1] });
    for (const k of kaba) {
      if (adaylar.length >= enCok) break;
      if (adaylar.every(a => Math.hypot(a.dx - k.dx, a.dy - k.dy) >= 1)) adaylar.push(k);
    }
    let en = null;
    for (const a of adaylar) for (let dy = -0.3; dy <= 0.3 + 1e-9; dy += 0.1) for (let dx = -0.3; dx <= 0.3 + 1e-9; dx += 0.1) {
      const t = deger(a.dx + dx, a.dy + dy, HALKA);
      if (!en || t < en.t) en = { dx: a.dx + dx, dy: a.dy + dy, t };
    }
    return en;
  }

  /* Sütun içinde değişen kayma (kâğıt bükülmesi): önce sütun geneli, sonra her 4 satırda bir çapa (±3 satırlık pencere),
   * aradaki satırlar çapalar arasında doğrusal. satirlar: [{ L:[yerel..] , y }] (y sırasında). */
  function sutunHizala(im, satirlar) {
    const genel = hizala(im, satirlar.filter((_, i) => i % 3 === 1).flatMap(s => s.L.filter((_, j) => j % 2 === 0)));
    const capa = [];
    for (let i = 0; i < satirlar.length; i += 4) capa.push(i);
    if (capa[capa.length - 1] !== satirlar.length - 1) capa.push(satirlar.length - 1);
    const k = new Map(capa.map(i => {
      const pencere = satirlar.slice(Math.max(0, i - 2), i + 3).flatMap(s => s.L);
      return [i, hizala(im, pencere, [genel.dx, genel.dy], 0.8)];
    }));
    return satirlar.map((_, i) => {
      const j = capa.findIndex(c => c >= i);
      if (capa[j] === i) return k.get(i);
      const a = capa[j - 1], b = capa[j], t = (i - a) / (b - a);
      return { dx: k.get(a).dx * (1 - t) + k.get(b).dx * t, dy: k.get(a).dy * (1 - t) + k.get(b).dy * t };
    });
  }

  /* Gri görüntüden (Uint8Array, w, h) formu okur.
   * Dönüş: { tanim, no, kitapcik, cevaplar:[dizi], supheli:[{alan, ders?, soru?, hane?}], esik, isaret } ya da { hata }. */
  function formOku(im, secenekler = {}) {
    const kucuk = kucult(im, 1000);
    const aday = adaylar(kucuk).map(a => ({ x: a.x * kucuk.k, y: a.y * kucuk.k, alan: a.alan }));
    const sec = isaretleriSec(aday);
    if (!sec) return { hata: 'Köşe kareleri bulunamadı. Formun tamamı, dört köşesi görünecek biçimde çekilmeli.' };
    // dört döndürme adayından kod şeridi doğrulananı (CRC) seç
    let T = null, tanim = null, O = null;
    for (let r = 0; r < 4 && !tanim; r++) {
      const kose = [0, 1, 2, 3].map(i => sec.kose[(i + r) % 4]);
      const orta = r % 2 === 0 ? (r === 0 ? sec.orta : [sec.orta[1], sec.orta[0]]) : [null, null];
      T = donusum(kose, orta);
      if (!T.tum) continue;
      O = olcer(im, T);
      tanim = koduOku(O);
    }
    if (!tanim) return { hata: 'Form okunamadı. Sayfanın altı köşe karesi de görünecek biçimde, net ve yakından yeniden çekin.' };
    if (secenekler.beklenen && secenekler.beklenen.kod !== tanim.kod) return { hata: 'Bu form başka bir sınavın formu.', tanim };
    const d = formDuzeni(tanim);
    if (d.hata) return { hata: d.hata, tanim };

    /* Bir kabarcık satırının (aynı sütunda yan yana kabarcıklar) koyulukları; yerel beyaz kabarcıklar arası boşluktan.
     * hiza: basılı halka çizgisinin iç ve dış yanına göre koyuluğu, satırın ortancası (halkaya oturmamışsa küçülür). */
    const olc = (Ls, kayma, beyazNokta) => {
      const beyaz = Math.max(1, ...Ls.flatMap(L => beyazNokta.map(([x, y]) => ornek(im, L, kayma.dx + x, kayma.dy + y))));
      const v = Ls.map(L => Math.max(0, 1 - ortalama(im, L, IC, kayma.dx, kayma.dy) / beyaz));
      const h = Ls.map(L => ((ortalama(im, L, HALKA_IC, kayma.dx, kayma.dy) + ortalama(im, L, HALKA_DIS, kayma.dx, kayma.dy)) / 2
        - ortalama(im, L, HALKA, kayma.dx, kayma.dy)) / beyaz).sort((a, b) => a - b);
      return { v, hiza: h[Math.floor(h.length / 2)] };
    };
    const ax = ARALIK / 2, ay = SATIR / 2;
    const ARA_BEYAZ = [[-ax, -ay], [ax, -ay], [-ax, ay], [ax, ay]];
    // cevap alanı: sütun sütun
    const sutunlar = new Map();
    for (const k of d.kabarcik) {
      const a = Math.round(k.x);
      if (!sutunlar.has(a)) sutunlar.set(a, []);
      sutunlar.get(a).push({ k, L: k.cx.map(x => yerel(O, x, k.y)) });
    }
    const sorular = [];
    for (const liste of sutunlar.values()) {
      liste.sort((a, b) => a.k.y - b.k.y);
      const kayma = sutunHizala(im, liste);
      liste.forEach((s, i) => sorular.push({ ...s.k, ...olc(s.L, kayma[i], ARA_BEYAZ), satir: liste, i, kayma: kayma[i] }));
    }
    /* Hiza denetimi: halkalara oturmamış satır (çapalar arası bükülme) komşularıyla yeniden hizalanır;
     * yine oturmazsa işaretlenir. Sınır, kâğıdın ortanca hiza kalitesine göre. */
    const hz = sorular.map(s => s.hiza).sort((a, b) => a - b);
    const hizaSinir = 0.4 * hz[Math.floor(hz.length / 2)];
    for (const s of sorular) {
      if (s.hiza >= hizaSinir) continue;
      const pencere = s.satir.slice(Math.max(0, s.i - 1), s.i + 2).flatMap(x => x.L);
      const yeni = hizala(im, pencere, [s.kayma.dx, s.kayma.dy], 1.2);
      const o = olc(s.satir[s.i].L, yeni, ARA_BEYAZ);
      if (o.hiza > s.hiza) Object.assign(s, o);
      s.hizaBozuk = s.hiza < hizaSinir;
    }
    // okul no ve kitapçık: hane sütunları birlikte hizalanır
    const noSatir = [...Array(10)].map((_, r) => ({ L: [...Array(NO.hane)].map((_, hane) => yerel(O, NO.x + hane * NO.dx, NO.y + r * NO.dy)) }));
    const noKayma = sutunHizala(im, noSatir);
    const NO_BEYAZ = [[-NO.dx / 2, NO.dy / 2], [NO.dx / 2, NO.dy / 2]];
    const noOlcum = noSatir.map((s, r) => olc(s.L, noKayma[r], NO_BEYAZ));
    const noV = [...Array(NO.hane)].map((_, hane) => noOlcum.map(o => o.v[hane]));
    const kitL = [...KITAPCIK.harf].map((_, i) => yerel(O, KITAPCIK.x, KITAPCIK.y + i * KITAPCIK.dy));
    const kitKayma = hizala(im, kitL, [noKayma[0].dx, noKayma[0].dy], 0.8);
    const kitOlcum = olc(kitL, kitKayma, [[-3, KITAPCIK.dy / 2], [3, KITAPCIK.dy / 2]]);
    const kitV = kitOlcum.v;

    // eşik: bütün kabarcıkların koyuluk dağılımında Otsu; boş kâğıtta sabit
    const hepsi = sorular.flatMap(s => s.v).concat(noV.flat(), kitV);
    const e = otsu(hepsi);
    const esik = e.ust - e.alt < 0.18 ? 0.4 : Math.min(0.55, Math.max(0.25, e.esik));
    const pay = 0.08;
    const supheli = [];
    const sec1 = (v) => {
      const dolu = v.map((x, i) => [x, i]).filter(([x]) => x >= esik).sort((a, b) => b[0] - a[0]);
      const sinirda = v.some(x => Math.abs(x - esik) < pay);
      if (!dolu.length) {
        // eşiğin altında ama satırın kalanından belirgin koyu şık: kâğıdın geri kalanı çok koyu işaretlenmişken
        // hafif basılmış işaret (ya da silinmiş iz) olabilir; boş sayılır ama işaretlenir
        const s = v.slice().sort((a, b) => a - b);
        const silik = s[s.length - 1] >= 0.15 && s[s.length - 1] - s[Math.floor(s.length / 2)] >= 0.12;
        return { i: -1, emin: !sinirda && !silik };
      }
      if (dolu.length === 1) return { i: dolu[0][1], emin: !sinirda };
      // biri belirgin koyuysa ötekisi silinmiş iz sayılır ama işaretlenir
      if (dolu[0][0] >= dolu[1][0] * 1.6) return { i: dolu[0][1], emin: false };
      // çift işaret yanlış sayılır. İki işaret benzer koyuluktaysa gerçek çift işarettir; biri belirgin açıksa
      // koyu silgi izi olabilir, kontrole düşer
      return { i: -2, emin: !sinirda && dolu[1][0] >= esik + pay && dolu[0][0] < dolu[1][0] * 1.25 };
    };
    const cevaplar = d.tanim.sorular.map(n => Array(n).fill('-'));
    for (const s of sorular) {
      const r = sec1(s.v);
      cevaplar[s.ders][s.soru] = r.i === -1 ? '-' : r.i === -2 ? '*' : HARF[r.i];
      if (!r.emin || s.hizaBozuk) supheli.push({ alan: 'soru', ders: s.ders, soru: s.soru, v: s.v.map(x => Math.round(x * 100) / 100), ...(s.hizaBozuk && { hiza: true }) });
    }
    // numara sola ya da sağa yaslı yazılabilir; rakamlar arasında boş hane şüphelidir
    let no = '', araBos = false, noSupheli = false;
    for (const v of noV) {
      const r = sec1(v);
      if (r.i >= 0) { if (araBos) noSupheli = true; no += r.i; } else { if (r.i === -2) noSupheli = true; if (no) araBos = true; }
      if (!r.emin) noSupheli = true;
    }
    if (noSupheli || !no) supheli.push({ alan: 'no' });
    const k = sec1(kitV);
    const kitapcik = k.i >= 0 ? KITAPCIK.harf[k.i] : 'A';
    if (!k.emin || k.i === -2) supheli.push({ alan: 'kitapcik' });
    return {
      tanim: d.tanim, no: no === ANAHTAR_NO ? no : no.replace(/^0+(?=\d)/, ''), kitapcik, kitapcikBos: k.i === -1, cevaplar: cevaplar.map(c => c.join('')),
      supheli, esik: Math.round(esik * 100) / 100, parcali: T.parcali,
      isaret: sec.kose.map(q => [q.x, q.y]),
      // ekranda gösterim için: sayfa mm → görüntü pikseli
      nokta: noktaYap(T),
    };
  }

  // ---------------------------------------------------------------- optik sınav verisi
  /* Optik sınav (durum.optik[]): { id, ad, tarih, seviye, yayin, ceza, secenek, kitapcikB, degisti,
   *   dersler:[{ id, ad, soru, anahtar:{ A:[öğe], B?:[öğe] } }], kagitlar:[{ no, kitapcik, kitapcikBos, cevaplar:[dizi], zaman }] }
   * Anahtar öğesi: 'A'..'E', birden çok doğru 'AB', iptal 'X', bilinmiyor ''. Anahtar tamamlanınca motorun sınav
   * biçimine çevrilip (optikYayini) sınavlara katılır; anahtarsız sınav sonuç ekranlarına girmez. */
  const SABLONLAR = {
    tyt: [['Türkçe', 40], ['Sosyal Bilimler', 20], ['Temel Matematik', 40], ['Fen Bilimleri', 20]],
    ayt: [['Türk Dili ve Edebiyatı', 24], ['Tarih-1', 10], ['Coğrafya-1', 6], ['Tarih-2', 11], ['Coğrafya-2', 11], ['Felsefe Grubu', 12],
      ['Din Kültürü', 6], ['Matematik', 40], ['Fizik', 14], ['Kimya', 13], ['Biyoloji', 13]],
    ara: [['Türkçe', 30], ['Sosyal Bilimler', 30], ['Matematik', 30], ['Fen Bilimleri', 30]],
  };
  const ANAHTAR_NO = '00000'; // beş hanesi de 0 kodlanmış kâğıt cevap anahtarıdır (öğrenci numarasında baştaki sıfırlar atılır)

  function dersKimligi(ad, kullanilan) {
    const taban = String(ad).toLocaleLowerCase('tr').replace(/ı/g, 'i').normalize('NFD').replace(/\p{M}/gu, '').replace(/[^a-z0-9]/g, '') || 'ders';
    let id = taban, i = 2;
    while (kullanilan.has(id)) id = taban + i++;
    kullanilan.add(id);
    return id;
  }

  /* Girdi denetlenir; sorun varsa { hata }, yoksa { sinav } */
  function optikSinav(g, simdi = Date.now()) {
    const ad = String(g.ad || '').trim();
    if (!ad) return { hata: 'Sınav adını yazın.' };
    if (!/^\d{4}-\d{2}-\d{2}$/.test(g.tarih || '')) return { hata: 'Sınav tarihini girin.' };
    const dersler = (g.dersler || []).map(d => ({ ad: String(d.ad || '').trim(), soru: Number(d.soru) })).filter(d => d.ad || d.soru);
    if (!dersler.length) return { hata: 'En az bir ders girin.' };
    if (dersler.some(d => !d.ad)) return { hata: 'Her dersin adı olmalı.' };
    if (dersler.some(d => !Number.isInteger(d.soru) || d.soru < 1 || d.soru > EN_COK_SORU)) return { hata: `Soru sayısı 1 ile ${EN_COK_SORU} arasında tam sayı olmalı.` };
    const secenek = Number(g.secenek) === 4 ? 4 : 5;
    const duzen = formDuzeni({ secenek, sorular: dersler.map(d => d.soru) });
    if (duzen.hata) return { hata: duzen.hata };
    const kullanilan = new Set();
    return {
      sinav: {
        id: 'op-' + simdi.toString(36), ad, tarih: g.tarih, seviye: Number(g.seviye) || null,
        yayin: ad.includes(' - ') ? ad.split(' - ')[0].trim() : null, ceza: Number(g.ceza) || 0, secenek, kitapcikB: !!g.kitapcikB,
        degisti: simdi, kagitlar: [],
        dersler: dersler.map(d => ({ id: dersKimligi(d.ad, kullanilan), ad: d.ad, soru: d.soru, anahtar: { A: Array(d.soru).fill('') } })),
      },
    };
  }

  /* Yazılmış anahtar: "ABCDE…", "1-A 2-B …", boşluk ve numaralar atlanır; X iptal, [AB] iki doğru, ? bilinmiyor. */
  function anahtarCoz(metin, soru, secenek = 5) {
    const harf = HARF.slice(0, secenek);
    const dizi = [];
    const s = String(metin || '').toLocaleUpperCase('tr');
    for (let i = 0; i < s.length; i++) {
      const c = s[i];
      if (c === '[' || c === '(') {
        const son = s.indexOf(c === '[' ? ']' : ')', i);
        if (son < 0) return { dizi, hata: `${dizi.length + 1}. soru: “${c}” kapanmamış.`, gecersiz: true };
        const ic = s.slice(i + 1, son).replace(/[^A-ZÇĞİÖŞÜ]/g, '');
        if (ic && [...ic].every(x => harf.includes(x))) { dizi.push([...new Set(ic)].sort().join('')); i = son; continue; }
        if (ic) return { dizi, hata: `${dizi.length + 1}. soru: “${s.slice(i, son + 1)}” anlaşılmadı.`, gecersiz: true };
        continue; // "1)" gibi numara ayracı
      }
      if (harf.includes(c) || c === 'X') dizi.push(c);
      else if (c === '?') dizi.push('');
      else if (/[A-ZÇĞİÖŞÜ]/.test(c)) return { dizi, hata: `${dizi.length + 1}. soru: “${c}” bu sınavda şık değil.`, gecersiz: true };
    }
    if (dizi.length !== soru) return { dizi, hata: `${dizi.length} / ${soru} soru girildi.`, fazla: dizi.length > soru };
    return { dizi };
  }
  /* Kontrol ekranında gösterilecek sayfa bölgesi (mm): belirsiz soru satırı (komşu satırların yarısıyla), okul no ya da kitapçık */
  function kontrolAlani(duzen, s) {
    if (s.alan === 'no') return { x0: NO.x - 4, y0: 37, x1: NO.x + (NO.hane - 1) * NO.dx + 4, y1: NO.y + 9 * NO.dy + 3 };
    if (s.alan === 'kitapcik') return { x0: KITAPCIK.x - 8, y0: 37, x1: KITAPCIK.x + 8, y1: KITAPCIK.y + KITAPCIK.dy + 4 };
    const k = duzen.kabarcik.find(x => x.ders === s.ders && x.soru === s.soru);
    return { x0: k.x - 0.5, y0: k.y - 4.5, x1: k.x + duzen.sutunGen + 0.5, y1: k.y + 4.5 };
  }
  const anahtarYazi = (dizi) => (dizi || []).map(x => !x ? '?' : x.length > 1 ? `[${x}]` : x).join('');

  const kitapciklar = (op) => op.kitapcikB ? ['A', 'B'] : ['A'];
  /* Eksik anahtarlar: [{ ders, kitapcik, eksik }] */
  function anahtarEksik(op) {
    const e = [];
    for (const d of op.dersler) for (const k of kitapciklar(op)) {
      const a = (d.anahtar && d.anahtar[k]) || [];
      const n = d.soru - a.filter(Boolean).length;
      if (n > 0) e.push({ ders: d.ad, kitapcik: k, eksik: n });
    }
    return e;
  }

  /* Motorun sınav biçimi. sinifBul(no) öğrencinin sınıfını verir. */
  function optikYayini(op, sinifBul = () => '') {
    return {
      id: op.id, ad: op.ad, tarih: op.tarih, seviye: op.seviye, yayin: op.yayin, ceza: op.ceza, optik: true,
      notlar: ['Telefonla optik okundu.'],
      dersler: op.dersler.map(d => {
        const anahtar = {};
        for (const k of kitapciklar(op)) anahtar[k] = d.anahtar[k].slice();
        const kazanim = Array.isArray(d.kazanim) && d.kazanim.length === d.soru ? d.kazanim.map(x => (x || []).slice()) : Array.from({ length: d.soru }, () => []);
        return { id: d.id, ad: d.ad, soru: d.soru, anahtar, kazanim };
      }),
      kagitlar: op.kagitlar.map(k => ({
        no: k.no, sinif: sinifBul(k.no) || '', kitapcik: op.kitapcikB ? k.kitapcik : 'A',
        cevap: Object.fromEntries(op.dersler.map((d, i) => [d.id, k.cevaplar[i]])),
      })),
    };
  }

  /* Telefondan gelen okuma dosyasını optik sınavlara katar (yerinde değiştirir).
   * veri = { bicim:'deneme-takip/optik', formlar:[{ kod, secenek, sorular, kagitlar:[{ no, kitapcik, kitapcikBos, cevaplar, kontrol }] }] }
   * Aynı numaralı kâğıt varsa daha yeni okunan (zaman) kalır. Anahtar kâğıdı (okul no 00000) yalnız yazılmamış anahtar
   * öğelerini doldurur; yazılı anahtarla çelişirse yazılı olan korunur ve uyarılır.
   * Dönüş: { degisen:[op], rapor:{ yeni, guncel, guncelNo:[no], eski, anahtar, bilinmeyenForm:[kod], uyusmayan:[ad], kontrolsuz, uyari:[metin] } } */
  function okumaAl(oplar, veri, simdi = Date.now()) {
    const rapor = { yeni: 0, guncel: 0, guncelNo: [], eski: 0, anahtar: 0, bilinmeyenForm: [], uyusmayan: [], kontrolsuz: 0, uyari: [] };
    const degisen = new Set();
    if (veri && veri.surum > 1) { rapor.uyari.push('Okuma dosyası uygulamanın bu sürümünden yeni; önce uygulamayı güncelleyin.'); return { degisen: [], rapor }; }
    for (const f of (veri && Array.isArray(veri.formlar) && veri.formlar) || []) {
      if (!f || typeof f !== 'object') continue;
      const op = oplar.find(o => formKodu(o.id) === f.kod);
      if (!op) { rapor.bilinmeyenForm.push(String(f.kod)); continue; }
      const sorular = op.dersler.map(d => d.soru);
      if ((op.secenek || 5) !== f.secenek || sorular.join() !== (f.sorular || []).join()) { rapor.uyusmayan.push(op.ad); continue; }
      const gecersiz = (op.secenek || 5) === 4 ? /[^A-D*-]/ : /[^A-E*-]/;
      for (const k of Array.isArray(f.kagitlar) ? f.kagitlar : []) {
        if (!k || !Array.isArray(k.cevaplar) || k.cevaplar.length !== sorular.length || k.cevaplar.some((c, i) => typeof c !== 'string' || c.length !== sorular[i] || gecersiz.test(c))) {
          rapor.uyari.push(`${op.ad}: bozuk bir kâğıt alınmadı.`); continue;
        }
        const no = String(k.no || '');
        if (!/^\d+$/.test(no)) { rapor.uyari.push(`${op.ad}: okul numarası olmayan bir kâğıt alınmadı.`); continue; }
        if (k.kontrol) rapor.kontrolsuz++;
        if (no === ANAHTAR_NO) {
          if (op.kitapcikB && k.kitapcikBos) { rapor.uyari.push(`${op.ad}: anahtar kâğıdında kitapçık işaretlenmemiş; alınmadı (A ya da B işaretleyip yeniden okutun).`); continue; }
          const kit = op.kitapcikB && k.kitapcik === 'B' ? 'B' : 'A';
          let doldu = 0;
          op.dersler.forEach((d, i) => {
            const yeni = [...k.cevaplar[i]].map(c => c === '-' || c === '*' ? '' : c);
            const eski = d.anahtar[kit] || [];
            const celisen = [];
            yeni.forEach((x, j) => { if (eski[j] && x && x !== eski[j]) celisen.push(j + 1); });
            if (celisen.length) rapor.uyari.push(`${op.ad} / ${d.ad}${op.kitapcikB ? ' ' + kit : ''}: anahtar kâğıdı yazılı anahtardan farklı (soru ${celisen.slice(0, 8).join(', ')}${celisen.length > 8 ? '…' : ''}); yazılı anahtar korundu. Kâğıttakini almak için o dersin anahtarını silip dosyayı yeniden alın.`);
            d.anahtar[kit] = Array.from({ length: d.soru }, (_, j) => { if (!eski[j] && yeni[j]) doldu++; return eski[j] || yeni[j] || ''; });
          });
          rapor.anahtar++;
          if (doldu) degisen.add(op);
          continue;
        }
        const kagit = { no, kitapcik: k.kitapcik === 'B' ? 'B' : 'A', kitapcikBos: !!k.kitapcikBos, cevaplar: k.cevaplar.slice(), zaman: Number(k.zaman) || simdi };
        const i = op.kagitlar.findIndex(x => x.no === no);
        if (i >= 0 && (op.kagitlar[i].zaman || 0) > kagit.zaman) { rapor.eski++; continue; }
        if (i >= 0) {
