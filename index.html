      html += `<p class="alt"><b>${P.turler.map(t => M.OSYM.tur[t].ad).join(', ')}</b>: ÖSYM’nin yöntemiyle tahmini sınav puanları (OBP hariç). AYT testlerinin standart puanlarına TYT eşindeki A-TYT puanının %40’ı eklenir; TYT eşine girmeyen öğrencinin puanı hesaplanmaz. Ortalama ve sapmalar ${M.OSYM.yil} YKS’den; 100–500 aralığının uçları ${M.OSYM.yil} puan dağılımından tahmin edildi, 10 puana kadar sapabilir.${olcekNotu}</p>`;
    } else if (P.tur === 'yok') {
      html += '<p class="alt">Bu sınav için puan hesaplanmıyor.</p>';
    }
    if (P.turler.length) {
      html += `<details class="alt"><summary>1 net kaç puan?</summary>${P.turler.map(t => { const d = M.netDegeri(t); return `<p><b>${puanBaslik(P, t)}</b>: ${Object.entries(d).map(([k, v]) => `${testAd(k)} ${sayi(v)}`).join(' · ')}</p>`; }).join('')}
        <p>Bir netin değeri testin ağırlığına ve ülke genelinde o testteki netlerin ne kadar dağıldığına bağlıdır (dağılım küçükse her net daha değerlidir), testteki soru sayısına göre orantılanmaz.${kucultulen.length ? ` Değerler ÖSYM sınavındaki bir net içindir; bu sınavda net küçültülen testlerde bir net daha az getirir: ${kucultulen.map(k => `${testAd(k)} ×${sayi(b.olcek[k])}`).join(', ')}.` : ''}</p></details>`;
    }
    return html + '</div>';
  }

  function sekmeDersler(s, x) {
    const gruplar = [['Genel', x.genel], ...Object.entries(x.siniflar).map(([k, v]) => [k, v])];
    let html = `<div class="tablo-kap"><table><thead><tr><th class="sol">Grup</th><th>Kişi</th>${s.dersler.map(d => `<th>${h(d.ad)} net</th><th>Başarı</th>`).join('')}<th>Toplam net</th></tr></thead><tbody>`;
    gruplar.forEach(([ad, o]) => {
      html += `<tr><td class="sol"><b>${h(ad)}</b></td><td>${o.kisi}</td>`;
      s.dersler.forEach(d => {
        const od = o.dersler[d.id]; const p = od ? od.basari : null;
        html += `<td>${od ? sayi(od.net) : '–'}</td><td><span class="cubuk-kap"><span class="cubuk" style="width:${Math.max(0, Math.min(100, (p || 0) * 100))}%"></span></span> <span class="${renkSinif(p)}">${yuzde(p)}</span></td>`;
      });
      html += `<td class="vurgu">${sayi(o.toplam)}</td></tr>`;
    });
    html += '</tbody></table></div><p class="alt">Başarı: ortalama net ÷ soru sayısı (iptal sorular hariç).</p>';
    // sınıf düzeyindeki önceki sınavlarla karşılaştırma
    const ayni = durum.sinavlar.filter(t => t.seviye === s.seviye && t.tarih <= s.tarih);
    if (ayni.length > 1) {
      const kh = ayni.map(hesap);
      const seriler = s.dersler.map(d => ({ ad: d.ad, renk: dersRenk(d.ad), degerler: kh.map(k => { const dd = k.sinav.dersler.find(z => z.ad === d.ad); const o = dd && k.genel.dersler[dd.id]; return o ? o.basari : null; }) }));
      html += `<div class="kart"><b>Bu sınava kadar ders başarısı (${s.seviye}. sınıf)</b>${cizgiGrafik({ etiketler: ayni.map(t => kisaTarih(t.tarih)), seriler, yuzdeMi: true })}</div>`;
    }
    return html;
  }

  function dersSecici(s, secili) {
    return `<label class="alt">Ders</label> <select data-is="ders-sec">${s.dersler.map(d => `<option value="${h(d.id)}" ${d.id === secili ? 'selected' : ''}>${h(d.ad)}</option>`).join('')}</select>`;
  }

  function sekmeSorular(s, x, sorgu) {
    const dersId = sorgu.ders || s.dersler[0].id;
    const a = M.soruAnalizi(x, dersId);
    if (!a) return '<p>Ders bulunamadı.</p>';
    if (!a.kisi) return `<div class="satir">${dersSecici(s, dersId)}</div><div class="bilgi">Bu derste cevap dizisi olan kâğıt yok (elle girilen sonuçlarda soru analizi yapılamaz).</div>`;
    let html = `<div class="satir ayrik" style="margin:8px 0">${dersSecici(s, dersId)}<span class="alt">${a.kisi} kâğıt${a.disarida ? ` (${a.disarida} B kitapçığı analiz dışı: soru eşlemesi bilinmiyor)` : ''} · güçlük: doğru oranı · ayırt edicilik: en iyi %27 ile en zayıf %27 arasındaki doğru oranı farkı</span></div>`;
    html += `<div class="tablo-kap"><table><thead><tr><th class="sirala">Soru</th><th>Cevap</th><th class="sirala">Doğru</th>${M.HARFLER.split('').map(h_ => `<th>${h_}</th>`).join('')}<th>Boş</th><th title="çift işaret">Çift</th><th class="sirala">Ayırt edicilik</th><th class="sol">Kazanım</th></tr></thead><tbody>`;
    a.sorular.forEach(q => {
      const r = renkSinif(q.guclukP);
      html += `<tr><td>${q.no}</td><td><b>${q.anahtar === 'X' ? 'İptal' : h(q.anahtar)}</b></td><td class="${r}" data-d="${q.guclukP == null ? -1 : q.guclukP}"><b>${yuzde(q.guclukP)}</b></td>`;
      M.HARFLER.split('').forEach(hr => {
        const n = q.dagilim[hr] || 0;
        const dogru = q.anahtar.indexOf(hr) >= 0, celd = hr === q.celdirici && n >= Math.max(2, q.dogru);
        html += `<td class="${dogru ? 'z-iyi' : celd ? 'z-zayif' : ''}">${n || ''}</td>`;
      });
      const ay = q.ayirt;
      html += `<td>${q.bos || ''}</td><td>${q.cift || ''}</td><td data-d="${ay == null ? -9 : ay}" class="${ay == null ? '' : ay < 0.2 ? 'zayif' : ay >= 0.4 ? 'iyi' : 'orta'}">${ay == null ? '–' : sayi(ay)}</td>`;
      html += `<td class="sol kazanim-ad" title="${h(q.kazanim.map(kazanimAd).join(' | '))}">${h(q.kazanim.map(kazanimAd).join(' | ')) || '<span class="alt">–</span>'}</td></tr>`;
    });
    html += '</tbody></table></div>';
    html += `<p class="alt">Yeşil: doğru şık. Kırmızı: doğru cevaptan çok ya da ona yakın seçilen çeldirici. Ayırt edicilik 0,40 ve üstü iyi, 0,20 altı zayıf (soru gözden geçirilmeli).</p>`;
    return html;
  }

  function sekmeKopya(s, x, sorgu) {
    const k = M.kopyaAnalizi(x);
    if (k.kagit < 3) return '<div class="bilgi">Kopya analizi için cevap dizisi olan en az 3 kâğıt gerekir; elle girilen sonuçlarda yapılamaz.</div>';
    const hepsi = sorgu.hepsi === '1';
    const isaretli = k.ciftler.filter(c => c.duzey);
    const liste = hepsi ? k.ciftler.slice(0, Math.max(30, isaretli.length)) : isaretli;
    const dersAd = id => (s.dersler.find(d => d.id === id) || {}).ad || id;
    const olasilik = p => p >= 0.5 ? '–' : p < 1e-6 ? '< 1 / 1.000.000' : '1 / ' + Math.round(1 / p).toLocaleString('tr-TR');
    const cok = Object.keys(x.siniflar).length > 1;
    let html = `<div class="bilgi uyari"><b>Bu bir inceleme işaretidir, kanıt değildir.</b> İki öğrencinin aynı sorularda aynı yanlış şıkkı seçmesi, birbirinden bağımsız çalışan iki öğrenciden beklenenden çok fazlaysa işaretlenir. Yan yana oturmak, birlikte çalışmak ya da aynı yanlış bilgiyi aynı kaynaktan öğrenmek de benzerlik yaratır. Öğrenciyle konuşmadan önce kâğıtlara ve oturma düzenine bakın; bu sayfayı öğrenciyle ya da sınıfla paylaşmayın.</div>`;
    html += `<div class="satir ayrik yazdirma-yok" style="margin:8px 0"><span class="alt">${k.kagit} kâğıt · ${k.ciftSayisi} çift karşılaştırıldı · <b>${isaretli.filter(c => c.duzey === 'guclu').length}</b> güçlü, <b>${isaretli.filter(c => c.duzey === 'dikkat').length}</b> dikkat</span><label class="alt"><input type="checkbox" data-is="kopya-hepsi" ${hepsi ? 'checked' : ''}> İşaretsizlerle birlikte en benzer 30 çifti göster</label></div>`;
    if (!liste.length) return html + '<p>Bu sınavda işaretlenen çift yok.</p>';
    html += `<div class="tablo-kap"><table><thead><tr><th class="sol">Düzey</th><th class="sol" title="altında: bu sınavdaki T puanı ← önceki denemelerin T ortalaması">Öğrenci 1</th><th class="sol" title="altında: bu sınavdaki T puanı ← önceki denemelerin T ortalaması">Öğrenci 2</th>${cok ? '<th class="sol">Sınıf</th>' : ''}<th title="ikisinin de aynı yanlış şıkkı işaretlediği soru">Ortak yanlış</th><th title="bağımsız çalışan iki öğrenciden beklenen ortak yanlış">Beklenen</th><th title="ikisinin de yanlış yaptığı soru">İkisi de yanlış</th><th title="farklı cevaplanan soru">Farklı cevap</th><th title="Harpp-Hogan oranı: ortak yanlış ÷ farklı cevap; 1 ve üstü çok yüksektir">Oran</th><th title="bu sınavda bu kadar benzer bir çiftin tesadüfen çıkma olasılığı">Tesadüf olasılığı</th><th class="sol">Derslere göre ortak yanlış</th></tr></thead><tbody>`;
    const hs = tumHesaplar();
    liste.forEach(c => {
      const duzey = c.duzey === 'guclu' ? '<b class="zayif">Güçlü</b>' : c.duzey === 'dikkat' ? '<b class="orta">Dikkat</b>' : '<span class="alt">–</span>';
      const sapma = (no) => {
        const o = M.oncekiSapma(hs, s.id, no);
        if (!o) return '<div class="alt">önceki deneme az</div>';
        // ortak yanlışın olduğu derslerde aynı karşılaştırma (ipucunda)
        const ders = Object.keys(c.ortakDers).map(id => o.dersler[id]).filter(Boolean).map(d => `${d.ad}: ${sayi(d.simdi, 0)} ← ${sayi(d.onceki, 0)} (${d.fark >= 0 ? '+' : ''}${sayi(d.fark, 0)})`).join(' · ');
        const f = `${o.fark >= 0 ? '+' : ''}${sayi(o.fark, 0)}`;
        return `<div class="alt" style="white-space:nowrap" title="${h(`Önceki ${o.n} deneme.` + (ders ? ' Ortak yanlışlı derslerde T: ' + ders : ''))}">T ${sayi(o.simdi, 0)} ← ${sayi(o.onceki, 0)} ${Math.round(o.fark) >= 10 ? `<b class="zayif">${f}</b>` : f}</div>`;
      };
      html += `<tr><td class="sol">${duzey}</td><td class="sol"><a href="#/ogrenci/${encodeURIComponent(c.a)}">${h(ogrEtiket(c.a))}</a>${sapma(c.a)}</td><td class="sol"><a href="#/ogrenci/${encodeURIComponent(c.b)}">${h(ogrEtiket(c.b))}</a>${sapma(c.b)}</td>${cok ? `<td class="sol">${h(c.sinifA === c.sinifB ? c.sinifA : c.sinifA + ' / ' + c.sinifB)}</td>` : ''}<td class="vurgu">${c.ortak}</td><td>${sayi(c.beklenen, 1)}</td><td>${c.ikisiYanlis}</td><td>${c.farkli}</td><td>${sayi(c.oran)}</td><td>${olasilik(c.pDuzeltilmis)}</td><td class="sol">${Object.entries(c.ortakDers).map(([id, n]) => `${h(dersAd(id))} ${n}`).join(' · ')}</td></tr>`;
    });
    html += '</tbody></table></div>';
    html += '<p class="alt">Beklenen: her soruda sınıfın yanlış şıklara dağılımından hesaplanır; herkesin düştüğü çeldiricide buluşmak az, kimsenin seçmediği şıkta buluşmak çok şey söyler. Güçlü: tesadüf olasılığı binde birden az. Dikkat: yüzde 5’ten az. Aynı çift birkaç sınavda işaretleniyorsa iz daha anlamlıdır. Yalnız aynı kitapçıktaki kâğıtlar karşılaştırılır.</p>';
    html += '<p class="alt">Öğrenci adının altındaki “T 64 ← 48 +16”: öğrencinin bu sınavdaki T puanı ← önceki en çok 5 denemesinin T ortalaması (T, sınavların zorluk farkını giderir; en az 2 önceki deneme gerekir). +10, sınıfta bir standart sapmalık yükseliştir ve kırmızı yazılır; fare üstüne gelince ortak yanlışlı derslerin karşılaştırması görünür. Bu sütun düzeyi değiştirmez: çalışan öğrenci de yükselir. İşaretli bir çiftte yalnız birinin olağan dışı yükselmesi, kimin kimden baktığı konusunda ipucu olabilir.</p>';
    return html;
  }

  function sekmeKazanimlar(s, x, sorgu) {
    const dersId = sorgu.ders || s.dersler[0].id;
    const kodlu = sorgu.kaz === 'kod';
    const dersK = (s.dersler.find(d => d.id === dersId) || {}).kazanim || [];
    const G = kazanimGruplari(dersK.flat());
    const k = M.kazanimAnalizi(x, dersId, kodlu ? G.grupla : null);
    if (!k) return '<p>Ders bulunamadı.</p>';
    const ad = kodlu ? G.etiket : kazanimAd, ipucu = kodlu ? G.ipucu : kazanimAd;
    // seçenek yalnız toplanacak bir şey varsa (aynı koda düşen iki alt madde) görünür
    const toplanir = kodlu || new Set(k.kazanimlar.map(e => G.grupla(e.kimlik))).size < k.kazanimlar.length;
    const gosterim = toplanir ? `<span><label class="alt">Gösterim</label> <select data-is="kaz-gosterim"><option value="">Her alt madde ayrı</option><option value="kod" ${kodlu ? 'selected' : ''}>Öğrenme çıktısına göre (kod)</option></select></span>` : '';
    let html = `<div class="satir ayrik" style="margin:8px 0"><span class="satir">${dersSecici(s, dersId)}${gosterim}</span>${sinifSecici(x, sorgu.sinif || '')}</div>`;
    if (!k.kazanimlar.length) return html + `<div class="bilgi">Bu derste sorulara kazanım atanmamış. ${s.optik && optikBul(s.id) ? `Kazanım Excel’ini <a href="#/optik/${encodeURIComponent(s.id)}">optik sınav sayfasından</a> yükleyin.` : 'TestPlus’ta kazanım Excel’i yüklenmiş sınavlarda görünür.'}</div>`;
    const liste = k.kazanimlar.slice().sort((a, b) => (a.basari ?? 1) - (b.basari ?? 1));
    html += `<h2>Kapsam ve sınıf başarısı</h2>${kodlu ? '<p class="alt">Aynı koddaki alt maddeler (a, b, ç…) tek satırda toplandı. Başarı, bu soruların hepsindeki doğru oranıdır; bir soru iki alt maddeye bağlıysa bir kez sayılır.</p>' : ''}<div class="tablo-kap"><table><thead><tr><th class="sol">Kazanım</th><th>Soru</th><th class="sirala">Başarı</th></tr></thead><tbody>`;
    liste.forEach(e => {
      html += `<tr><td class="sol kazanim-ad" title="${h(ipucu(e.kimlik))}">${h(ad(e.kimlik))}</td><td title="soru numaraları">${araliklar(e.sorular)}</td><td data-d="${e.basari == null ? -1 : e.basari}"><span class="cubuk-kap"><span class="cubuk" style="width:${(e.basari || 0) * 100}%"></span></span> <b class="${renkSinif(e.basari)}">${yuzde(e.basari)}</b></td></tr>`;
    });
    html += '</tbody></table></div>';
    const sinif = sorgu.sinif || '';
    const ogr = k.ogrenci.filter(o => !sinif || o.sinif === sinif).sort((a, b) => String(a.no).localeCompare(String(b.no), 'tr', { numeric: true }));
    html += `<h2>Öğrenci × kazanım ısı haritası</h2><p class="alt">Satır: öğrenci. Sütun: yukarıdaki listedeki sırayla kazanım (en zayıftan güçlüye). Hücre: o kazanımın sorularındaki doğru oranı. Üzerine gelince kazanım adı görünür.</p>`;
    html += `<div class="tablo-kap"><table class="harita"><thead><tr><th class="sol">Öğrenci</th>${liste.map((e, i) => `<th title="${h(ipucu(e.kimlik))}">${i + 1}</th>`).join('')}<th>Ort.</th></tr></thead><tbody>`;
    ogr.forEach(o => {
      const degerler = liste.map(e => o.basari[e.kimlik]);
      const gecerli = degerler.filter(v => v != null);
      const ort = gecerli.length ? gecerli.reduce((a, b) => a + b, 0) / gecerli.length : null;
      html += `<tr class="tik" data-git="#/ogrenci/${encodeURIComponent(o.no)}"><td class="sol">${h(ogrEtiket(o.no))}</td>${degerler.map((v, i) => `<td class="z-${renkSinif(v)}" title="${h(ipucu(liste[i].kimlik))}">${v == null ? '' : Math.round(v * 100)}</td>`).join('')}<td><b>${ort == null ? '' : Math.round(ort * 100)}</b></td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  function gorOgrenciler(sorgu) {
    if (!durum.ogrenciler.length) return bosEkran();
    const hs = tumHesaplar();
    const ara = (sorgu.ara || '').toLocaleLowerCase('tr');
    const sinif = sorgu.sinif || '';
    const siniflar = [...new Set(durum.ogrenciler.map(o => o.sinif).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
    const satirlar = durum.ogrenciler
      .filter(o => (!sinif || o.sinif === sinif) && (!ara || String(o.no).includes(ara) || (o.ad || '').toLocaleLowerCase('tr').includes(ara)))
      .map(o => {
        const g = M.ogrenciGelisimi(hs, o.no);
        const son = g[g.length - 1], onceki = g[g.length - 2];
        return { o, g, son, onceki };
      })
      .sort((a, b) => (a.o.sinif || '').localeCompare(b.o.sinif || '', 'tr', { numeric: true }) || String(a.o.no).localeCompare(String(b.o.no), 'tr', { numeric: true }));
    let html = `<div class="satir ayrik"><div><h1>Öğrenciler</h1><div class="alt">${durum.ogrenciler.length} öğrenci</div></div>
      <div class="satir"><a href="#/ozet"><button>Net özeti</button></a><input type="text" placeholder="No ya da ad ara" data-is="ogrenci-ara" value="${h(sorgu.ara || '')}"> <select data-is="ogr-sinif-sec"><option value="">Bütün sınıflar</option>${siniflar.map(v => `<option ${v === sinif ? 'selected' : ''}>${h(v)}</option>`).join('')}</select></div></div>`;
    html += `<div class="tablo-kap"><table><thead><tr><th class="sol sirala">No</th><th class="sol sirala">Ad</th><th class="sol sirala">Sınıf</th><th class="sirala">Sınav</th><th class="sol">Son sınav</th><th class="sirala">Son toplam net</th><th class="sirala">Sıra</th><th class="sirala" title="son sınavın başarı yüzdesi ile bir öncekinin farkı">Değişim</th></tr></thead><tbody>`;
    satirlar.forEach(({ o, g, son, onceki }) => {
      let deg = null;
      if (son && onceki) {
        if (son.basari != null && onceki.basari != null) deg = son.basari - onceki.basari;
      }
      html += `<tr class="tik" data-git="#/ogrenci/${encodeURIComponent(o.no)}"><td class="sol">${h(o.no)}</td><td class="sol">${h(o.ad || '') || '<span class="alt">–</span>'}</td><td class="sol">${h(o.sinif || '')}</td><td>${g.length}</td><td class="sol">${son ? h(son.sinavAd) : '–'}</td><td class="vurgu">${son ? sayi(son.toplam) : '–'}</td><td>${son ? son.sira + ' / ' + son.kisi : '–'}</td><td data-d="${deg == null ? -99 : deg}" class="${deg == null ? '' : deg > 0.02 ? 'iyi' : deg < -0.02 ? 'zayif' : ''}">${deg == null ? '–' : (deg > 0 ? '▲ ' : deg < 0 ? '▼ ' : '') + Math.abs(Math.round(deg * 100)) + ' puan'}</td></tr>`;
    });
    html += '</tbody></table></div><p class="alt">Değişim: son iki sınavın başarı yüzdesi (toplam net ÷ toplam soru) farkı, yüzde puanı olarak.</p>';
    return html;
  }

  /* Net özeti: öğrenci × sınav. Koçun Excel'indeki "Net Özeti"nin karşılığı; girilmeyen sınav boş kalır,
   * sıra ortalama başarıya (net ÷ soru) göredir, böylece az sınava giren öğrenci haksız sıralanmaz. */
  function gorOzet(sorgu) {
    if (!durum.sinavlar.length) return bosEkran();
    const sev = sorgu.seviye ? Number(sorgu.seviye) : (durum.sinavlar.filter(s => s.seviye).pop() || {}).seviye || null;
    const sinavlar = durum.sinavlar.filter(s => !sev || s.seviye === sev);
    const hs = sinavlar.map(hesap);
    const dersAd = sorgu.ders || '';
    const dersAdlari = [...new Set(sinavlar.flatMap(s => s.dersler.map(d => d.ad)))];
    const sinif = sorgu.sinif || '';
    const kayit = new Map();
    hs.forEach((x, i) => x.satirlar.forEach(r => {
      if (!r.no) return; // numarasız kâğıt öğrenciye bağlanamaz
      let net, basari, t;
      if (dersAd) {
        const d = x.sinav.dersler.find(z => z.ad === dersAd);
        if (!d || !r.dersler[d.id]) return;
        ({ net, basari, t } = r.dersler[d.id]);
      } else {
        net = r.toplam; basari = r.basari; t = r.t;
      }
      const k = kayit.get(String(r.no)) || { no: r.no, sinif: r.sinif, hucre: Array(hs.length).fill(null) };
      k.sinif = r.sinif; k.hucre[i] = { net, basari, t };
      kayit.set(String(r.no), k);
    }));
    const siniflar = [...new Set([...kayit.values()].map(k => k.sinif).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
    const satirlar = [...kayit.values()].filter(k => !sinif || k.sinif === sinif).map(k => {
      const v = k.hucre.filter(Boolean), vb = v.filter(c => c.basari != null), vt = v.filter(c => c.t != null);
      return { ...k, sayi: v.length, ortNet: v.reduce((t, c) => t + c.net, 0) / v.length, ortBasari: vb.length ? vb.reduce((t, c) => t + c.basari, 0) / vb.length : null, ortT: vt.length ? vt.reduce((t, c) => t + c.t, 0) / vt.length : null };
    });
    const sira = M.sirala(satirlar, k => k.ortBasari == null ? -Infinity : k.ortBasari);
    satirlar.sort((a, b) => sira.get(a) - sira.get(b) || String(a.no).localeCompare(String(b.no), 'tr', { numeric: true }));
    let html = `<div class="satir ayrik"><div><div class="alt"><a href="#/ogrenciler">Öğrenciler</a> ›</div><h1>Net özeti</h1><div class="alt">${sev ? sev + '. sınıf · ' : ''}${sinavlar.length} sınav · ${satirlar.length} öğrenci</div></div>
      <div class="satir"><select data-is="seviye-sec">${seviyeler().map(v => `<option value="${v}" ${v === sev ? 'selected' : ''}>${v}. sınıf</option>`).join('')}</select>
      <select data-is="ozet-ders"><option value="">Toplam net</option>${dersAdlari.map(a => `<option ${a === dersAd ? 'selected' : ''}>${h(a)}</option>`).join('')}</select>
      ${siniflar.length > 1 ? `<select data-is="sinif-sec"><option value="">Bütün sınıflar</option>${siniflar.map(v => `<option ${v === sinif ? 'selected' : ''}>${h(v)}</option>`).join('')}</select>` : ''}</div></div>`;
    if (!satirlar.length) return html + '<p>Bu seçimde sonuç yok.</p>';
    html += `<div class="tablo-kap"><table><thead><tr><th class="sirala">Sıra</th><th class="sol sirala">No</th><th class="sol sirala">Ad</th>${siniflar.length > 1 ? '<th class="sol sirala">Sınıf</th>' : ''}`;
    sinavlar.forEach(s => { html += `<th class="sirala" title="${h(s.ad)}">${h(kisaTarih(s.tarih))}<br><span style="font-weight:400">${h((s.yayin || s.ad).replace(/ Yayınları$/, '').slice(0, 14))}</span></th>`; });
    html += `<th class="sirala" title="girdiği sınav sayısı">Sınav</th><th class="sirala">Ort. net</th><th class="sirala" title="net ÷ soru sayısı ortalaması">Ort. başarı</th><th class="sirala" title="girdiği sınavlardaki T puanlarının ortalaması">Ort. T</th></tr></thead><tbody>`;
    satirlar.forEach(k => {
      html += `<tr class="tik" data-git="#/ogrenci/${encodeURIComponent(k.no)}"><td>${sira.get(k)}</td><td class="sol">${h(k.no)}</td><td class="sol">${h(ogrAd(k.no)) || '<span class="alt">–</span>'}</td>${siniflar.length > 1 ? `<td class="sol">${h(k.sinif)}</td>` : ''}`;
      k.hucre.forEach(c => { html += c ? `<td data-d="${c.net}" class="${c.net < 0 ? 'zayif' : ''}">${sayi(c.net)}</td>` : '<td data-d="-999" class="alt" title="sınava girmedi">–</td>'; });
      html += `<td>${k.sayi}</td><td class="vurgu">${sayi(k.ortNet)}</td><td data-d="${k.ortBasari == null ? -99 : k.ortBasari}">${yuzde(k.ortBasari)}</td><td data-d="${k.ortT == null ? -99 : k.ortT}">${sayi(k.ortT, 1)}</td></tr>`;
    });
    html += `</tbody><tfoot><tr><td colspan="${siniflar.length > 1 ? 4 : 3}" class="sol"><b>Ortalama</b></td>`;
    sinavlar.forEach((s, i) => { const v = satirlar.map(k => k.hucre[i]).filter(Boolean); html += `<td><b>${v.length ? sayi(v.reduce((t, c) => t + c.net, 0) / v.length) : '–'}</b></td>`; });
    html += `<td></td><td><b>${sayi(satirlar.reduce((t, k) => t + k.ortNet, 0) / satirlar.length)}</b></td><td></td><td></td></tr></tfoot></table></div>`;
    html += `<p class="alt">“–”: sınava girmedi; ortalamaya katılmaz. Sıra ortalama başarıya (net ÷ soru, iptal sorular hariç) göredir; soru sayısı farklı sınavlar (ör. 25 soruluk) da böylece adil karşılaştırılır. Sütun başlığına tıklayınca o sınava göre sıralanır.</p>`;
    return html;
  }

  /* Konu takibi: koçun AKAS konu kodlarıyla sınavlar arası kapsam ve öğrenci başarısı.
   * AKAS'tan farkı: öğrenci hücresi ders yüzdesi değil, o konunun sorularındaki gerçek doğru oranıdır. */
  const KAPSAM = (n) => n === 0 ? ['Sorulmamış', 'alt'] : n === 1 ? ['Az', 'zayif'] : n <= 5 ? ['Temsil', 'orta'] : ['Yeterli', 'iyi'];
  const isaret = (p) => p == null ? '' : p >= ESIK.iyi ? '✦' : p >= ESIK.zayif ? '●' : '▾';

  function gorKonu(sorgu) {
    if (!durum.sinavlar.length) return bosEkran();
    const konulu = durum.sinavlar.filter(s => s.dersler.some(d => Array.isArray(d.konu)));
    let html = `<div class="satir ayrik"><div><h1>Konu takibi</h1><div class="alt">Sınavlar arası konu kapsamı ve öğrenci başarısı · konu kodları koçun AKAS eşlemesinden</div></div>`;
    if (!konulu.length) return html + `</div><div class="bilgi">Hiçbir sınavda konu eşlemesi yok. Konu kodları dönüştürücüdeki AKAS eşleme dosyasından gelir.</div>`;
    const sevler = [...new Set(konulu.map(s => s.seviye).filter(Boolean))].sort((a, b) => a - b);
    const sev = sorgu.seviye ? Number(sorgu.seviye) : (sevler.length ? sevler[sevler.length - 1] : null);
    const sinavlar = durum.sinavlar.filter(s => sev == null || s.seviye === sev);
    const dersler = [];
    sinavlar.forEach(s => s.dersler.forEach(d => { if (Array.isArray(d.konu) && !dersler.some(x => x.id === d.id)) dersler.push({ id: d.id, ad: d.ad }); }));
    const dersId = dersler.some(d => d.id === sorgu.ders) ? sorgu.ders : (dersler[0] || {}).id;
    const t = dersId ? M.konuTakibi(sinavlar.map(hesap), dersId) : { sinavlar: [], konular: [], ogrenci: [] };
    const siniflar = [...new Set(t.ogrenci.map(o => o.sinif).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
    const sinif = siniflar.includes(sorgu.sinif) ? sorgu.sinif : '';
    html += `<div class="satir"><select data-is="seviye-sec">${sevler.map(v => `<option value="${v}" ${v === sev ? 'selected' : ''}>${v}. sınıf</option>`).join('')}</select>
      <select data-is="ders-sec">${dersler.map(d => `<option value="${h(d.id)}" ${d.id === dersId ? 'selected' : ''}>${h(d.ad)}</option>`).join('')}</select>
      ${siniflar.length > 1 ? `<select data-is="sinif-sec"><option value="">Bütün sınıflar</option>${siniflar.map(v => `<option ${v === sinif ? 'selected' : ''}>${h(v)}</option>`).join('')}</select>` : ''}</div></div>`;
    if (!dersId) return html + `<div class="bilgi">${sev ? sev + '. sınıf sınavlarında' : 'Bu sınavlarda'} konu eşlemesi yok.</div>`;
    const eslemesiz = sinavlar.filter(s => !s.dersler.some(d => d.id === dersId && Array.isArray(d.konu)));
    if (eslemesiz.length) html += `<div class="bilgi uyari">Konu eşlemesi olmayan ${eslemesiz.length} sınav bu rapora girmedi: ${eslemesiz.map(s => h(s.ad)).join(', ')}.</div>`;
    if (!t.sinavlar.length) return html;
    const ogr = t.ogrenci.filter(o => !sinif || o.sinif === sinif);
    // katalogdaki bütün konular (hiç sorulmamışlar dahil) + katalogda olmayan kodlar
    const katalog = (durum.konular || []).filter(k => k.ders === dersId);
    const kodlar = [...new Set([...katalog.map(k => k.id), ...t.konular.map(k => k.kod)])];
    const konuAd = (kod) => { const k = (durum.konular || []).find(x => x.id === kod); return k ? k.ad : ''; };
    const satir = kodlar.map(kod => {
      const k = t.konular.find(x => x.kod === kod) || { kod, sinav: {}, soru: 0 };
      let d = 0, n = 0; ogr.forEach(o => { const e = o.konu[kod]; if (e) { d += e.d; n += e.t; } });
      return { ...k, ad: konuAd(kod), sinifBasari: n ? d / n : null };
    });
    const sorulan = satir.filter(k => k.soru).sort((a, b) => (a.sinifBasari ?? 2) - (b.sinifBasari ?? 2));
    const sorulmayan = satir.filter(k => !k.soru);
    const say = (f) => satir.filter(f).length;
    html += `<div class="izgara" style="margin:12px 0">
      <div class="ozet"><b>${satir.length}</b><span>konu</span></div>
      <div class="ozet"><b>${sorulmayan.length}</b><span>hiç sorulmamış</span></div>
      <div class="ozet"><b>${say(k => k.soru === 1)}</b><span>tek soruyla temsil</span></div>
      <div class="ozet"><b class="zayif">${say(k => k.sinifBasari != null && k.sinifBasari < ESIK.zayif)}</b><span>sınıf başarısı %50 altı</span></div></div>`;
    html += `<h2>Kapsam ve sınıf başarısı</h2><div class="tablo-kap"><table><thead><tr><th class="sol sirala">Kod</th><th class="sol sirala">Konu</th>${t.sinavlar.map(s => `<th title="${h(s.ad)}">${h(kisaTarih(s.tarih))}</th>`).join('')}<th class="sirala">Soru</th><th class="sol">Kapsam</th><th class="sirala">Sınıf başarısı</th></tr></thead><tbody>`;
    [...sorulan, ...sorulmayan].forEach(k => {
      const [kd, ks] = KAPSAM(k.soru);
      html += `<tr><td class="sol">${h(k.kod)}</td><td class="sol kazanim-ad" title="${h(k.ad)}">${h(k.ad) || '<span class="alt">katalogda yok</span>'}</td>`;
      t.sinavlar.forEach(s => { const q = k.sinav[s.id]; html += `<td title="${q ? 'soru ' + araliklar(q) : ''}">${q ? q.length : ''}</td>`; });
      html += `<td>${k.soru}</td><td class="sol ${ks}">${kd}</td><td data-d="${k.sinifBasari == null ? -1 : k.sinifBasari}">${k.sinifBasari == null ? '–' : `<span class="cubuk-kap"><span class="cubuk" style="width:${k.sinifBasari * 100}%"></span></span> <b class="${renkSinif(k.sinifBasari)}">${yuzde(k.sinifBasari)}</b>`}</td></tr>`;
    });
    html += `</tbody></table></div><p class="alt">Kapsam (AKAS ile aynı): 0 soru sorulmamış, 1 az, 2–5 temsil, 6 ve üstü yeterli. Hücredeki sayı o sınavdaki soru sayısı; üzerine gelince soru numaraları görünür.</p>`;
    html += `<h2>Öğrenci × konu</h2><p class="alt">Hücre: öğrencinin o konunun bütün sorularındaki doğru oranı. ✦ %67 ve üstü · ● %50–66 · ▾ %50 altı. Sütunlar yukarıdaki sırayla (en zayıf konudan başlayarak); üzerine gelince konu ve doğru sayısı görünür.</p>`;
    html += `<div class="tablo-kap"><table class="harita"><thead><tr><th class="sol">Öğrenci</th>${sorulan.map((k, i) => `<th title="${h(k.kod + ' ' + k.ad)}">${i + 1}</th>`).join('')}<th>Ort.</th></tr></thead><tbody>`;
    ogr.slice().sort((a, b) => String(a.no).localeCompare(String(b.no), 'tr', { numeric: true })).forEach(o => {
      let td = 0, tt = 0;
      const hucre = sorulan.map(k => {
        const e = o.konu[k.kod]; if (!e) return '<td></td>';
        td += e.d; tt += e.t; const p = e.d / e.t;
        return `<td class="z-${renkSinif(p)}" title="${h(k.kod + ' ' + k.ad)}: ${e.d}/${e.t}">${isaret(p)}</td>`;
      }).join('');
      html += `<tr class="tik" data-git="#/ogrenci/${encodeURIComponent(o.no)}"><td class="sol">${h(ogrEtiket(o.no))}</td>${hucre}<td><b>${tt ? Math.round(td / tt * 100) : ''}</b></td></tr>`;
    });
    html += '</tbody></table></div>';
    return html;
  }

  function gorOgrenci(no, sorgu = {}) {
    const o = ogrenci(no);
    if (!o) return '<p>Öğrenci bulunamadı. <a href="#/ogrenciler">Öğrencilere dön</a></p>';
    const g = M.ogrenciGelisimi(tumHesaplar(), no);
    let html = `<div class="satir ayrik"><div><div class="alt"><a href="#/ogrenciler">Öğrenciler</a> ›</div><h1>${h(o.ad || 'Okul no ' + o.no)}</h1><div class="alt">Okul no ${h(o.no)} · ${h(o.sinif || '')} · ${g.length} sınav</div></div>
      <div class="satir yazdirma-yok"><input type="text" data-is="ad-yaz" data-no="${h(o.no)}" placeholder="Ad soyad (sunucuya gitmez)" value="${h(o.ad || '')}" style="min-width:220px"> ${g.length ? `<a href="#/karne/${encodeURIComponent(g[g.length - 1].sinavId)}/${encodeURIComponent(o.no)}"><button class="ana">Son sınav karnesi</button></a>` : ''}</div></div>`;
    if (!g.length) return html + '<p>Bu öğrencinin sınavı yok.</p>';
    const etiket = g.map(x => kisaTarih(x.tarih));
    html += `<div class="kart"><b>Gelişim</b> <span class="alt">· toplam net ÷ toplam soru, %</span>${cizgiGrafik({ etiketler: etiket, yuzdeMi: true, seriler: [
      { ad: ogrEtiket(no), renk: 'var(--vurgu)', kalin: true, degerler: g.map(x => x.basari) },
      { ad: 'Sınıf ortalaması', renk: 'var(--soluk)', kesik: true, degerler: g.map(x => x.sinifBasari) },
    ] })}</div>`;
    const dersAdlari = [...new Set(g.flatMap(x => x.dersler.map(d => d.ad)))];
    html += `<div class="tablo-kap"><table><thead><tr><th class="sol">Tarih</th><th class="sol">Sınav</th>${dersAdlari.map(a => `<th>${h(a)}</th>`).join('')}<th>Toplam</th><th title="T puanı: sınava girenler içinde yeri; 50 ortalama">T</th><th title="tahmini YKS puanı (OBP hariç); TYT ≈ ara sınıf denemesinin yaklaşık TYT karşılığı">Puan</th><th>Sınıf ort.</th><th>Sıra</th><th>Sınıf sıra</th><th></th></tr></thead><tbody>`;
    g.slice().reverse().forEach(x => {
      html += `<tr><td class="sol">${tarihYaz(x.tarih)}</td><td class="sol"><a href="#/sinav/${encodeURIComponent(x.sinavId)}">${h(x.sinavAd)}</a></td>`;
      dersAdlari.forEach(a => { const d = x.dersler.find(z => z.ad === a); html += `<td title="${d ? `D ${d.d} · Y ${d.y} · B ${d.b} · sınıf ort. ${sayi(d.sinifOrt)}` : ''}" class="${d && d.sinifOrt != null ? (d.net >= d.sinifOrt ? 'iyi' : 'zayif') : ''}">${d ? sayi(d.net) : '–'}</td>`; });
      const sv = sinavBul(x.sinavId), P = sv ? puanlar(hesap(sv)) : null, pv = P && P.ogrenci.get(String(no));
      html += `<td class="vurgu">${sayi(x.toplam)}</td><td>${sayi(x.t, 1)}</td><td style="white-space:nowrap">${P && puanYazi(P, pv) || '–'}</td><td>${sayi(x.sinifOrt)}</td><td>${x.sira} / ${x.kisi}</td><td>${x.sinifSira} / ${x.sinifKisi}</td><td><a href="#/karne/${encodeURIComponent(x.sinavId)}/${encodeURIComponent(no)}">karne</a></td></tr>`;
    });
    html += '</tbody></table></div><p class="alt">Yeşil: sınıf ortalamasının üstünde ya da eşit; kırmızı: altında.</p>';
    const hs = tumHesaplar().filter(x => g.some(z => z.sinavId === x.sinav.id));
    html += ogrenciZorluk(hs, no, sorgu) + ogrenciKazanimGecmisi(hs, no, sorgu);
    return html;
  }

  /* ---------- zorluk ---------- */
  const DILIM_AD = ['Çok kolay', 'Kolay', 'Orta', 'Zor', 'Çok zor'];
  const DILIM_ARALIK = ['%80 ve üstü', '%60–79', '%40–59', '%20–39', '%20 altı'];
  const dilimAdi = (p) => DILIM_AD[M.ZORLUK_DILIM.findIndex(a => p >= a)];
  function esikKisa(o) {
    if (o.durum === 'ara') return `%${Math.round(o.esik * 100)} <span class="alt">${dilimAdi(o.esik).toLocaleLowerCase('tr')}</span>`;
    return { ust: 'inmiyor', alt: 'en kolayda', az: '<span class="alt">veri az</span>' }[o.durum];
  }
  function esikCumle(o) {
    if (o.durum === 'ara') return `Sınava girenlerin yaklaşık <b>%${Math.round(o.esik * 100)}</b>’inin çözebildiği sorulardan daha zor sorularda başarısı %50’nin altına iniyor (${dilimAdi(o.esik).toLocaleLowerCase('tr')} dilim).`;
    return { ust: 'Hesaba giren en zor dilimde bile soruların yarısından fazlasını çözüyor.', alt: 'Hesaba giren en kolay dilimde bile soruların yarısından azını çözüyor.', az: 'Eşik için en az iki dilimde beşer soru gerekir; henüz veri az.' }[o.durum];
  }
  // sıralama değeri: en kolayda düşen en üstte, hiç düşmeyen en altta
  const anahtarSuphe = (q) => q.kisi >= 15 && q.yanlisN >= q.kisi / 2; // küçük grupta tesadüf olabilir
  const esikSira = (o) => ({ alt: 2, ara: o.esik, ust: -1, az: -2 }[o.durum]);
  const ZORLUK_ACIKLAMA = 'Bir sorunun zorluğu, o sınava girenlerin (A kitapçığı) o soruyu çözme oranıdır; öğrencinin kendi cevabı bu orana katılmaz. 8 kişiden az girilen dersler hesaba girmez. Boş bırakılan soru çözülmemiş sayılır.';

  function ogrenciZorluk(hs, no, sorgu) {
    const dersler = [];
    hs.forEach(x => x.sinav.dersler.forEach(d => { if (!d.elle && !dersler.some(z => z.id === d.id)) dersler.push({ id: d.id, ad: d.ad }); }));
    const dersId = dersler.some(d => d.id === sorgu.zders) ? sorgu.zders : '';
    const z = M.zorlukProfili(hs, dersId || null);
    const o = z.ogrenci.find(x => String(x.no) === String(no));
    let html = `<div class="kart"><div class="satir ayrik"><b>Zorluk profili</b><span><label class="alt">Ders</label> <select data-is="z-ders"><option value="">Bütün dersler</option>${dersler.map(d => `<option value="${h(d.id)}" ${d.id === dersId ? 'selected' : ''}>${h(d.ad)}</option>`).join('')}</select></span></div>`;
    if (!o || !o.t) return html + '<p class="alt">Bu öğrencinin girdiği sınavlarda zorluk hesaplanacak kadar kâğıt yok.</p></div>';
    html += `<p>${esikCumle(o)}</p><div class="tablo-kap"><table><thead><tr><th class="sol">Dilim</th><th title="sınava girenlerin çözme oranı">Sorunun çözülme oranı</th><th>Soru</th><th>Doğru</th><th class="sol">Öğrencinin başarısı</th><th title="aynı sorularda sınava girenlerin ortalaması">Ortalama öğrenci</th></tr></thead><tbody>`;
    o.dilim.forEach((x, i) => {
      if (!x.t) return;
      const b = x.d / x.t, ort = x.pt / x.t;
      html += `<tr><td class="sol">${DILIM_AD[i]}</td><td>${DILIM_ARALIK[i]}</td><td>${x.t}</td><td>${x.d}</td><td class="sol"><span class="cubuk-kap"><span class="cubuk" style="width:${b * 100}%"></span></span> <b class="${renkSinif(b)}">${yuzde(b)}</b></td><td>${yuzde(ort)}</td></tr>`;
    });
    html += `</tbody></table></div><p class="alt">${ZORLUK_ACIKLAMA} “Ortalama öğrenci”, aynı soruların sınava girenlerce çözülme oranıdır; öğrencinin başarısı bunun üstündeyse o dilimde grubun önündedir. Bütün öğrencilerin karşılaştırması <a href="#/zorluk">Zorluk</a> sayfasında.</p></div>`;
    return html;
  }

  function ogrenciKazanimGecmisi(hs, no, sorgu) {
    const dersler = [];
    hs.forEach(x => x.sinav.dersler.forEach(d => { if (Array.isArray(d.kazanim) && d.kazanim.some(k => k && k.length) && !dersler.some(z => z.id === d.id)) dersler.push({ id: d.id, ad: d.ad }); }));
    let html = `<div class="kart"><b>Kazanım geçmişi</b>`;
    if (!dersler.length) return html + '<p class="alt">Bu öğrencinin girdiği sınavlarda kazanım yüklenmiş ders yok.</p></div>';
    const dersId = dersler.some(d => d.id === sorgu.kders) ? sorgu.kders : dersler[0].id;
    const kodlu = sorgu.kaz !== 'ayri';
    const G = kazanimGruplari(hs.flatMap(x => x.sinav.dersler.filter(d => d.id === dersId).flatMap(d => (d.kazanim || []).flat())));
    const k = M.kazanimGecmisi(hs, no, dersId, kodlu ? G.grupla : null);
    const ad = kodlu ? G.etiket : kazanimAd, ipucu = kodlu ? G.ipucu : kazanimAd;
    const zayifMi = sorgu.kf === 'zayif';
    const liste = k.kazanimlar.filter(e => !zayifMi || (e.basari != null && e.basari < ESIK.zayif))
      .sort((a, b) => (a.basari ?? 2) - (b.basari ?? 2) || (b.grupBasari ?? 0) - (a.grupBasari ?? 0));
    html += ` <div class="satir" style="margin:6px 0"><span><label class="alt">Ders</label> <select data-is="k-ders">${dersler.map(d => `<option value="${h(d.id)}" ${d.id === dersId ? 'selected' : ''}>${h(d.ad)}</option>`).join('')}</select></span>
      <span><label class="alt">Gösterim</label> <select data-is="kaz-gosterim"><option value="">Öğrenme çıktısına göre (kod)</option><option value="ayri" ${kodlu ? '' : 'selected'}>Her alt madde ayrı</option></select></span>
      <span><select data-is="k-filtre"><option value="">Bütün kazanımlar</option><option value="zayif" ${zayifMi ? 'selected' : ''}>Yalnız %50 altı</option></select></span></div>`;
    if (!k.sinavlar.length) return html + '<p class="alt">Bu derste öğrencinin A kitapçığıyla girdiği kazanımlı sınav yok.</p></div>';
    const tekrar = k.kazanimlar.filter(e => Object.keys(e.sinav).length > 1).length;
    html += `<p class="alt">${k.kazanimlar.length} kazanım, ${k.sinavlar.length} sınav; ${tekrar} kazanım birden çok sınavda soruldu. Tarih sütunları: o sınavdaki soruları, ✓ doğru · ✗ yanlış · ○ boş (dörtten çok soruda doğru/soru); üzerine gelince soru numaraları görünür.</p>`;
    html += `<div class="tablo-kap"><table class="gecmis"><thead><tr><th class="sol sirala">Kazanım</th><th class="sirala">Doğru</th><th class="sirala">Başarı</th><th class="sirala" title="aynı sorularda sınava girenlerin doğru oranı">Sınava girenler</th>${k.sinavlar.map(s => `<th title="${h(s.ad)}">${h(kisaTarih(s.tarih))}</th>`).join('')}</tr></thead><tbody>`;
    const IS = { d: '✓', y: '✗', b: '○' }, AD = { d: 'doğru', y: 'yanlış', b: 'boş' };
    liste.forEach(e => {
      html += `<tr><td class="sol kazanim-ad" title="${h(ipucu(e.kimlik))}">${h(ad(e.kimlik))}</td><td data-d="${e.t ? e.d / e.t : -1}">${e.d}/${e.t}</td><td data-d="${e.basari ?? -1}"><b class="${renkSinif(e.basari)}">${yuzde(e.basari)}</b></td><td data-d="${e.grupBasari ?? -1}">${yuzde(e.grupBasari)}</td>`;
      k.sinavlar.forEach(s => {
        const q = e.sinav[s.id];
        if (!q) { html += '<td></td>'; return; }
        const d = q.filter(x => x.sonuc === 'd').length;
        html += `<td class="z-${renkSinif(d / q.length)}" title="${h(s.ad + ': ' + q.map(x => `soru ${x.no} ${AD[x.sonuc]}`).join(' · '))}">${q.length <= 4 ? q.map(x => IS[x.sonuc]).join('') : `${d}/${q.length}`}</td>`;
      });
      html += '</tr>';
    });
    if (!liste.length) html += `<tr><td class="sol alt" colspan="${k.sinavlar.length + 4}">%50 altında kazanım yok.</td></tr>`;
    html += `</tbody></table></div><p class="alt">${kodlu ? 'Aynı koddaki kazanımlar (alt maddeler ve farklı yayınların aynı kodlu kazanımları) tek satırda toplanır. Kod yazımı farklıysa (ör. eski müfredatın M.9.1.2.1’i ile yeni MAT.9.1.2) ayrı satırda kalır.' : 'Her kazanım metni ayrı satırda; yalnız birebir aynı metin sınavlar arasında birleşir.'} Yalnız A kitapçığıyla girilen sınavlar sayılır.</p></div>`;
    return html;
  }

  function gorZorluk(sorgu) {
    if (!durum.sinavlar.length) return bosEkran();
    const sevler = [...new Set(durum.sinavlar.map(s => s.seviye).filter(Boolean))].sort((a, b) => a - b);
    const sev = sevler.includes(Number(sorgu.seviye)) ? Number(sorgu.seviye) : (sevler.length ? sevler[sevler.length - 1] : null);
    const sinavlar = durum.sinavlar.filter(s => sev == null || s.seviye === sev);
    const dersler = [];
    sinavlar.forEach(s => s.dersler.forEach(d => { if (!d.elle && !dersler.some(x => x.id === d.id)) dersler.push({ id: d.id, ad: d.ad }); }));
    const dersId = dersler.some(d => d.id === sorgu.ders) ? sorgu.ders : '';
    const z = M.zorlukProfili(sinavlar.map(hesap), dersId || null);
    const siniflar = [...new Set(z.ogrenci.map(o => o.sinif).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'tr', { numeric: true }));
    const sinif = siniflar.includes(sorgu.sinif) ? sorgu.sinif : '';
    let html = `<div class="satir ayrik"><div><h1>Zorluk</h1><div class="alt">Soruların zorluğu ve her öğrencinin başarısının düştüğü eşik · ${sinavlar.length} sınav</div></div>
      <div class="satir">${sevler.length ? `<select data-is="seviye-sec">${sevler.map(v => `<option value="${v}" ${v === sev ? 'selected' : ''}>${v}. sınıf</option>`).join('')}</select>` : ''}
      <select data-is="ders-sec"><option value="">Bütün dersler</option>${dersler.map(d => `<option value="${h(d.id)}" ${d.id === dersId ? 'selected' : ''}>${h(d.ad)}</option>`).join('')}</select>
      ${siniflar.length > 1 ? `<select data-is="sinif-sec"><option value="">Bütün sınıflar</option>${siniflar.map(v => `<option ${v === sinif ? 'selected' : ''}>${h(v)}</option>`).join('')}</select>` : ''}</div></div>`;
    if (!z.ogrenci.length) return html + '<div class="bilgi">Zorluk hesaplanacak kadar kâğıt yok (bir derse en az 8 kişi girmeli).</div>';
    html += `<p class="alt">${ZORLUK_ACIKLAMA} Dilimler: ${DILIM_AD.map((a, i) => `${a.toLocaleLowerCase('tr')} ${DILIM_ARALIK[i]}`).join(' · ')}. Eşik: öğrencinin başarısının %50’nin altına indiği çözülme oranı (yalnız en az beş sorulu dilimler); düşük eşik, daha zor sorulara kadar dayandığını gösterir.</p>`;

    // öğrenciler
    const ogr = z.ogrenci.filter(o => !sinif || o.sinif === sinif).sort((a, b) => esikSira(b) - esikSira(a) || String(a.no).localeCompare(String(b.no), 'tr', { numeric: true }));
    const cok = siniflar.length > 1;
    html += `<h2>Öğrenciler</h2><div class="tablo-kap"><table><thead><tr><th class="sol sirala">Öğrenci</th>${cok ? '<th class="sol sirala">Sınıf</th>' : ''}${DILIM_AD.map((a, i) => `<th class="sirala" title="çözülme oranı ${DILIM_ARALIK[i]}">${a}</th>`).join('')}<th class="sirala">Toplam</th><th class="sirala" title="başarının %50’nin altına indiği çözülme oranı">Eşik</th></tr></thead><tbody>`;
    const ort = M.ZORLUK_DILIM.map(() => ({ d: 0, t: 0, pt: 0 }));
    ogr.forEach(o => {
      o.dilim.forEach((x, i) => { ort[i].d += x.d; ort[i].t += x.t; ort[i].pt += x.pt; });
      html += `<tr class="tik" data-git="#/ogrenci/${encodeURIComponent(o.no)}"><td class="sol">${h(ogrEtiket(o.no))}</td>${cok ? `<td class="sol">${h(o.sinif || '')}</td>` : ''}${o.dilim.map(x => { const b = x.t ? x.d / x.t : null; return `<td class="z-${renkSinif(b)}" data-d="${b ?? -1}" title="${x.d}/${x.t}">${b == null ? '' : Math.round(b * 100)}</td>`; }).join('')}<td data-d="${o.basari ?? -1}">${yuzde(o.basari)}</td><td data-d="${esikSira(o)}" style="white-space:nowrap">${esikKisa(o)}</td></tr>`;
    });
    html += `</tbody><tfoot><tr><td class="sol"><b>Ortalama</b></td>${cok ? '<td></td>' : ''}${ort.map(x => `<td><b>${x.t ? Math.round(x.d / x.t * 100) : ''}</b></td>`).join('')}<td></td><td></td></tr></tfoot></table></div><p class="alt">Hücre: o dilimdeki sorulardan çözdüğü oran (%). Satıra tıklayınca öğrencinin sayfası açılır. Eşik sütununda “inmiyor”: hesaba giren en zor dilimde bile yarıdan fazlası; “en kolayda”: en kolay dilimde bile yarıdan azı.</p>`;

    // denemeler
    html += `<h2>Denemeler, zordan kolaya</h2><div class="tablo-kap"><table><thead><tr><th class="sol">Sınav</th><th class="sol">Tarih</th><th>Soru</th><th class="sirala">Ortalama çözülme</th>${DILIM_AD.map(a => `<th title="bu dilimdeki soru sayısı">${a}</th>`).join('')}</tr></thead><tbody>`;
    z.sinavlar.slice().sort((a, b) => a.ort - b.ort).forEach(s => {
      html += `<tr><td class="sol"><a href="#/sinav/${encodeURIComponent(s.id)}/sorular">${h(s.ad)}</a></td><td class="sol">${tarihYaz(s.tarih)}</td><td>${s.soru}</td><td data-d="${s.ort}"><span class="cubuk-kap"><span class="cubuk" style="width:${s.ort * 100}%"></span></span> ${yuzde(s.ort)}</td>${s.dagilim.map(n => `<td>${n || ''}</td>`).join('')}</tr>`;
    });
    html += '</tbody></table></div><p class="alt">Ortalama çözülme: soruların sınava girenlerce çözülme oranlarının ortalaması. Aynı öğrenciler zamanla ilerlediği için sonraki bir deneme biraz kolay görünebilir; farklı sınıf düzeyleri karşılaştırılmaz.</p>';

    // en zor sorular
    const zor = z.sorular.slice().sort((a, b) => a.p - b.p || b.kisi - a.kisi).slice(0, 15);
    html += `<h2>En zor 15 soru</h2><div class="tablo-kap"><table><thead><tr><th class="sol">Sınav</th><th class="sol">Ders</th><th>Soru</th><th>Anahtar</th><th>Çözen</th><th title="en çok işaretlenen yanlış şık">Çoğunluğun yanlışı</th><th class="sol">Kazanım</th></tr></thead><tbody>`;
    let suphe = 0;
    zor.forEach(q => {
      const s = sinavBul(q.sinavId), d = s && s.dersler.find(x => x.id === q.dersId);
      html += `<tr><td class="sol"><a href="#/sinav/${encodeURIComponent(q.sinavId)}/sorular?ders=${encodeURIComponent(q.dersId)}">${h(s ? s.ad : q.sinavId)}</a></td><td class="sol">${h(d ? d.ad : q.dersId)}</td><td>${q.no}</td><td>${h(q.anahtar)}</td><td>${yuzde(q.p)} <span class="alt">(${Math.round(q.p * q.kisi)}/${q.kisi})</span></td><td>${q.yanlisSik ? `${q.yanlisSik} <span class="alt">(${q.yanlisN}/${q.kisi})</span>${anahtarSuphe(q) ? (suphe++, ' <b class="zayif" title="Çoğunluk aynı yanlış şıkta buluştu; cevap anahtarını kontrol edin.">⚠</b>') : ''}` : '–'}</td><td class="sol kazanim-ad" title="${h(q.kazanim.map(kazanimAd).join('\n'))}">${q.kazanim.length ? h(kisaKazanim(kazanimAd(q.kazanim[0]))) : '<span class="alt">–</span>'}</td></tr>`;
    });
    html += `</tbody></table></div><p class="alt">Soru numaraları A kitapçığına göredir.${suphe ? ' ⚠: sınava girenlerin yarısı ya da daha fazlası aynı yanlış şıkkı işaretlemiş. Bu, cevap anahtarı hatası da olabilir; kitapçıktan kontrol edin, gerekirse anahtarı düzeltin.' : ''}</p>`;
    return html;
  }

  /* ---------- karne: A4 sayfalı belgeler (öğrenci deneme + birikimli karnesi, branş öğretmeni raporu) ----------
   * Her belge bir .akis: başlık, bloklar, ayak. sayfala() blokları 794 × 1123 px sayfalara dağıtır; ekran,
   * yazdırma ve PDF aynı sayfaları kullanır. */
  const ISARET = { d: '✓', y: '✗', b: '○' };
  const soruIsaret = (q) => `<span class="i-${q.sonuc}">${q.no}${ISARET[q.sonuc]}</span>`;
  const belgeAkisi = (bas, bloklar, ayak) =>
    `<div class="akis"><div class="kbas">${bas}</div>${bloklar.filter(Boolean).map(b => `<div class="blok">${b}</div>`).join('')}<div class="kayak">${h(ayak)}</div></div>`;
  function karneBasi(no, sinif, tur, alt) {
    const ad = ogrAd(no);
    return `<div><div class="kad">${h(ad || 'Okul No ' + no)}</div><div class="kucuk">${ad ? `Okul no ${h(no)} · ` : ''}Sınıf ${h(sinif || '–')}</div></div><div class="sag"><div class="ktur">${h(tur)}</div><div class="kucuk">${alt}</div></div>`;
  }
  function sayfala(kap) {
    kap.querySelectorAll('.akis').forEach(akis => {
      const bas = akis.querySelector(':scope > .kbas').innerHTML, ayak = akis.querySelector(':scope > .kayak').innerHTML;
      const sayfalar = [];
      let govde;
      const yeni = () => {
        const sy = document.createElement('div');
        sy.className = 'karne a4';
        sy.innerHTML = `<div class="kbas">${bas}</div><div class="a4-govde"></div><div class="kayak"><span>${ayak}</span><span class="sayfa-no"></span></div>`;
        akis.before(sy); sayfalar.push(sy); govde = sy.querySelector('.a4-govde');
      };
      const tasti = () => govde.scrollHeight > govde.clientHeight + 1;
      yeni();
      const kuyruk = [...akis.querySelectorAll(':scope > .blok')];
      while (kuyruk.length) {
        const b = kuyruk.shift();
        govde.appendChild(b);
        if (!tasti()) continue;
        // tablolu blok sayfa sonunda bölünür: sığmayan satırlar "(devam)" başlıklı yeni bloğa geçer
        const tablo = b.querySelector(':scope > table'), satir = tablo ? tablo.tBodies[0].rows : [];
        if (satir.length > 3) {
          const baslik = b.querySelector(':scope > h2:not(.bolum)');
          const devam = document.createElement('div');
          devam.className = 'blok';
          devam.innerHTML = `${baslik ? `<h2>${baslik.innerHTML.replace(/ <span class="kucuk">\(devam\)<\/span>$/, '')} <span class="kucuk">(devam)</span></h2>` : ''}<table class="${tablo.className}">${tablo.tHead ? tablo.tHead.outerHTML : ''}<tbody></tbody></table>`;
          const hedef = devam.querySelector('tbody');
          while (tasti() && satir.length > 3) hedef.prepend(satir[satir.length - 1]);
          if (!tasti()) { kuyruk.unshift(devam); continue; }
          while (hedef.rows.length) tablo.tBodies[0].appendChild(hedef.rows[0]); // 3 satır bile sığmıyor: blok bütün olarak taşınır
        }
        // sığmayan blok yeni sayfaya; sayfadaki tek blok sığmasa da kalır
        if (govde.children.length > 1) { yeni(); govde.appendChild(b); if (tasti() && satir.length > 3) { govde.removeChild(b); kuyruk.unshift(b); } }
      }
      if (sayfalar.length > 1) sayfalar.forEach((sy, i) => { sy.querySelector('.sayfa-no').textContent = `Sayfa ${i + 1} / ${sayfalar.length}`; });
      akis.remove();
    });
  }
  // tablo bloğu; sayfa sonundaki bölme sayfala()'da (boy verilirse ayrıca sabit parçalara böler)
  function tabloParcala(bas, thead, satirlar, sinif = 'ktablo', boy = 1e9) {
    const parca = [];
    for (let i = 0; i < satirlar.length; i += boy) parca.push(`${i ? bas.replace('</h2>', ' <span class="kucuk">(devam)</span></h2>') : bas}<table class="${sinif}"><thead>${thead}</thead><tbody>${satirlar.slice(i, i + boy).join('')}</tbody></table>`);
    return parca.length ? parca : [bas];
  }
  // birikimli belgelerin sınavları: aynı sınıf düzeyinden, bu sınavın tarihine kadar
  const birikimliSinavlar = (s) => durum.sinavlar.filter(z => (z.seviye ?? null) === (s.seviye ?? null) && String(z.tarih) <= String(s.tarih));
  const oncekiSinavlar = (s) => birikimliSinavlar(s).filter(z => z.id !== s.id);
  const farkAd = (f) => Math.abs(f) < ESIT_NET ? 'sınıf ortalamasıyla aynı' : `sınıf ortalamasının ${sayi(Math.abs(f))} net ${f > 0 ? 'üstünde' : 'altında'}`;
  // ok işareti ve özet cümlesi aynı eşiği kullanır: 0,1 netten küçük fark "aynı" sayılır
  const ESIT_NET = 0.1;
  const ok = (f, esik = ESIT_NET) => f == null || Math.abs(f) < esik ? '' : f > 0 ? ' <span class="iyi">▲</span>' : ' <span class="zayif">▼</span>';
  // başarı farkı yüzde puanı olarak: yuvarlanınca 0 olan fark renksiz
  const farkPuan = (f) => { const n = Math.round(f * 100); return n ? `<span class="${n < 0 ? 'zayif' : 'iyi'}">${n > 0 ? '+' : ''}${n}</span>` : '0'; };
  function dokumSatiri(d, satir) {
    const c = satir.kagit.cevap && satir.kagit.cevap[d.id];
    if (c == null) return '';
    const an = M.dersAnahtari(d, satir.kagit.kitapcik);
    const yanlis = [], bos = [];
    for (let i = 0; i < d.soru; i++) { const k = an[i] || ''; if (!k || k === 'X') continue; const ch = c[i] || '-'; if (ch === '-') bos.push(i + 1); else if (ch === '*' || k.indexOf(ch) < 0) yanlis.push(i + 1); }
    return `<p class="kucuk">Yanlış: ${yanlis.length ? araliklar(yanlis) : 'yok'}${bos.length ? ` · Boş: ${araliklar(bos)}` : ''}</p>`;
  }

  function denemeKarnesi(s, x, satir) {
    const a = ayar(), no = satir.no;
    const cok = Object.keys(x.siniflar).length > 1;
    const kars = (cok && x.siniflar[satir.sinif]) || x.genel; // şube varsa şube, yoksa sınava girenler
    const dersler = s.dersler.filter(d => satir.dersler[d.id]);
    const bKitap = (satir.kagit.kitapcik || 'A') !== 'A';
    const bloklar = [];

    // özet cümlesi
    let ozet = `<b>${sayi(satir.toplam)} net</b> · ${farkAd(satir.toplam - kars.toplam)}.`;
    // dersler soru sayısına göre karşılaştırılır (başarı farkı); "aynı" eşiği ok işaretiyle ortak (net farkı)
    const farklar = dersler.map(d => { const p = satir.dersler[d.id], o = kars.dersler[d.id]; return { ad: d.ad, n: o ? p.net - o.net : null, f: p.basari != null && o && o.basari != null ? p.basari - o.basari : null }; })
      .filter(z => z.f != null).sort((p, q) => q.f - p.f);
    if (farklar.length > 1) {
      const ust = farklar.filter(z => z.n >= ESIT_NET), alt = farklar.filter(z => z.n <= -ESIT_NET);
      if (ust.length && alt.length) ozet += ` Sınıfa göre en iyi dersi ${h(ust[0].ad)}; en geride kaldığı ders ${h(alt[alt.length - 1].ad)}.`;
      else if (ust.length) ozet += ` Hiçbir derste sınıf ortalamasının altında değil; en güçlü dersi ${h(ust[0].ad)}.`;
      else if (alt.length) ozet += ` Hiçbir derste sınıf ortalamasının üstünde değil; en çok çalışılacak ders ${h(alt[alt.length - 1].ad)}.`;
    }
    bloklar.push(`<div class="kozet">${ozet}</div>`);

    // ders tablosu
    let t = `<table class="ktablo"><thead><tr><th class="sol" style="width:30%">Ders</th><th>Soru</th><th>Doğru</th><th>Yanlış</th><th>Boş</th><th>Net</th><th>Sınıf ort.</th>${cok ? '<th>Genel ort.</th>' : ''}</tr></thead><tbody>`;
    dersler.forEach(d => {
      const p = satir.dersler[d.id], so = kars.dersler[d.id], go = x.genel.dersler[d.id];
      t += `<tr><td class="sol">${h(d.ad)}</td><td>${d.soru}</td><td>${p.d}</td><td>${p.y}</td><td>${p.b}</td><td><b>${sayi(p.net)}</b>${so ? ok(p.net - so.net) : ''}</td><td>${so ? sayi(so.net) : '–'}</td>${cok ? `<td>${go ? sayi(go.net) : '–'}</td>` : ''}</tr>`;
    });
    const top = (f) => dersler.reduce((n, d) => n + satir.dersler[d.id][f], 0);
    t += `<tr class="toplam"><td class="sol"><b>Toplam</b></td><td>${dersler.reduce((n, d) => n + d.soru, 0)}</td><td>${top('d')}</td><td>${top('y')}</td><td>${top('b')}</td><td><b>${sayi(satir.toplam)}</b>${ok(satir.toplam - kars.toplam)}</td><td>${sayi(kars.toplam)}</td>${cok ? `<td>${sayi(x.genel.toplam)}</td>` : ''}</tr></tbody></table>`;
    const ek = [];
    if (a.karnePuan) {
      const P = puanlar(x), py = puanYazi(P, P.ogrenci.get(String(no)));
      if (py) ek.push(`${P.tur === 'ara' ? 'Yaklaşık TYT puanı' : 'Tahmini puan'}: <b>${py.replace(/^TYT ≈ /, '')}</b> <span class="soluk">(${P.tur === 'ara' ? 'ÖSYM yöntemiyle, bu sınavdaki netlerin TYT karşılığı' : 'bu denemedeki netlerle ÖSYM yöntemiyle; OBP hariç'})</span>`);
    }
    if (a.karneSira) ek.push(`Sıra: genel <b>${satir.sira} / ${x.satirlar.length}</b>${cok && x.siniflar[satir.sinif] ? ` · sınıf içi <b>${satir.sinifSira} / ${x.siniflar[satir.sinif].kisi}</b>` : ''}`);
    bloklar.push(t + ek.map(e => `<p class="kucuk">${e}</p>`).join(''));

    // üç kutu
    const kv = bKitap ? [] : dersler.map(d => ({ d, k: M.karneKutulari(M.soruDurumlari(x, no, d.id)) })).filter(z => z.k);
    if (kv.length) {
      const topla = (tur) => kv.flatMap(z => z.k[tur].map(q => ({ ...q, ders: z.d })));
      const kutu = (sinif, bas, alt, liste, bos) => `<div class="kutu ${sinif}"><div class="kutu-bas">${bas}</div><div class="kutu-alt">${alt}</div>${liste.length
        ? liste.slice(0, 4).map(q => `<div class="kutu-oge"><b>${h(q.ders.ad)} · ${q.no}. soru</b> <span class="kutu-alt">%${Math.floor(q.p * 100 + 1e-9)} çözdü</span>${q.kazanim.length ? `<div class="kutu-kaz">${mebiA(mebiKazanim(q.kazanim[0]))}${h(kisaKazanim(kazanimAd(q.kazanim[0])))}</div>` : ''}</div>`).join('') + (liste.length > 4 ? `<div class="kutu-alt" style="margin-top:5px">ve ${liste.length - 4} soru daha</div>` : '')
        : `<div class="kutu-alt">${bos}</div>`}</div>`;
      bloklar.push(`<h2>Bu denemede</h2><div class="kutular">${kutu('k-once', 'Önce bunlar', 'Çoğunluğun çözdüğü, kaçırılan sorular', topla('once').sort((p, q) => q.p - p.p), 'Bu denemede çoğunluğun çözüp senin kaçırdığın soru yok.')}${kutu('k-hedef', 'Sıradaki hedef', 'Zor sorular; henüz çözülemeyenler', topla('hedef').sort((p, q) => q.p - p.p), 'Yok.')}${kutu('k-guclu', 'Güçlü yön', 'Çoğunluğun çözemediği, çözülen sorular', topla('guclu').sort((p, q) => p.p - q.p), 'Bu denemede yok.')}</div>
        <p class="kucuk">Yüzde: sınava girenlerin (A kitapçığı, öğrencinin kendisi hariç) o soruyu çözme oranı. Kolay: %60 ve üstü; zor: %40’ın altı.</p>`);
    } else if (bKitap) bloklar.push('<p class="kucuk">B kitapçığı: soru zorluğu A kitapçığının soru sırasıyla ölçüldüğü için soru kutuları ve kazanım tablosu bu karnede yok.</p>');
    else if (dersler.some(d => satir.kagit.cevap && satir.kagit.cevap[d.id] != null)) bloklar.push(`<p class="kucuk">Sınava girenler ${M.KUTU.enAz} kişiden az olduğu için soru zorluğu ölçülmedi.</p>`);

    // ders ders kazanımlar ve sorular
    const dersBloklari = [];
    dersler.forEach(d => {
      const dokum = a.karneSoruDokumu ? dokumSatiri(d, satir) : '';
      let tablo = [];
      if (a.karneKazanim && !bKitap && satir.kagit.cevap && satir.kagit.cevap[d.id] != null && Array.isArray(d.kazanim) && d.kazanim.some(k => k && k.length)) {
        const G = kazanimGruplari(d.kazanim.flat());
        const k = M.kazanimGecmisi([x], no, d.id, G.grupla);
        const satirlar = k.kazanimlar.map(e => ({ e, q: e.sinav[s.id] || [] })).filter(z => z.q.length).sort((p, q) => p.q[0].no - q.q[0].no)
          .map(({ e, q }) => `<tr><td class="sol kazanim-ad">${mebiA(G.mebi(e.kimlik))}${h(G.etiket(e.kimlik))}</td><td class="sol isaretler">${q.map(soruIsaret).join(' ')}</td><td>${yuzde(e.grupBasari)}</td></tr>`);
        tablo = tabloParcala(`<h2>${h(d.ad)}</h2>${dokum}`, '<tr><th class="sol" style="width:60%">Kazanım</th><th class="sol">Sorular</th><th style="width:15%">Sınava girenler</th></tr>', satirlar, 'ktablo kaz');
      }
      if (tablo.length) dersBloklari.push(...tablo);
      else if (dokum) dersBloklari.push(`<h2>${h(d.ad)}</h2>${dokum}`);
    });
    if (dersBloklari.length) {
      const kazVar = dersBloklari.some(b => b.includes('ktablo kaz'));
      dersBloklari[0] = `<h2 class="bolum">Ders ders ${kazVar ? 'kazanımlar' : 'sorular'}</h2>${kazVar ? '<p class="kucuk">Sorular sütununda soru numarası ve sonucu: ✓ doğru · ✗ yanlış · ○ boş (A kitapçığı). Sınava girenler: aynı soruların doğru oranı.</p>' : ''}` + dersBloklari[0];
      bloklar.push(...dersBloklari);
    }
    if (bloklar.some(b => b.includes('class="mebi'))) bloklar.push(`<p class="kucuk">${mebiNot(bloklar)}</p>`);
    return belgeAkisi(karneBasi(no, satir.sinif, 'Deneme karnesi', `${h(s.ad)} · ${tarihYaz(s.tarih)}${bKitap ? ' · B kitapçığı' : ''}`), bloklar, 'Deneme Takip · deneme karnesi');
  }

  function birikimliKarne(s, no, sinif) {
    const a = ayar();
    const hs = birikimliSinavlar(s).map(hesap);
    const g = M.ogrenciGelisimi(hs, no);
    const bloklar = [];
    const ilk = g[0], son = g[g.length - 1];
    let ozet;
    if (g.length < 2) ozet = 'Bu düzeyde şimdiye kadar tek denemesi var; birikimli karne denemeler arttıkça anlam kazanır.';
    else {
      ozet = `<b>${g.length} deneme.</b> Başarı ilk denemede ${yuzde(ilk.basari)} (sınıf ${yuzde(ilk.sinifBasari)}), son denemede ${yuzde(son.basari)} (sınıf ${yuzde(son.sinifBasari)}).`;
      if (a.karneSira && ilk.sinifKisi && son.sinifKisi) ozet += ` Sınıf içi sıra ${ilk.sinifSira}/${ilk.sinifKisi} → ${son.sinifSira}/${son.sinifKisi}.`;
      // ders ders sınıfa göre fark: ilk ve son denemesi arasında
      const ders = new Map();
      g.forEach(z => z.dersler.forEach(d => { if (d.basari == null || d.sinifBasari == null) return; const e = ders.get(d.id) || { ad: d.ad, f: [] }; e.f.push(d.basari - d.sinifBasari); ders.set(d.id, e); }));
      const ilerleme = [...ders.values()].filter(e => e.f.length > 1).map(e => ({ ad: e.ad, i: e.f[e.f.length - 1] - e.f[0] })).sort((p, q) => q.i - p.i);
      if (ilerleme.length && ilerleme[0].i > 0.03) ozet += ` Sınıfa göre en çok ilerlediği ders ${h(ilerleme[0].ad)}.`;
      if (ilerleme.length > 1 && ilerleme[ilerleme.length - 1].i < -0.03) ozet += ` En çok gerilediği ders ${h(ilerleme[ilerleme.length - 1].ad)}.`;
    }
    const z = M.zorlukProfili(hs);
    const o = z.ogrenci.find(e => String(e.no) === String(no));
    if (o && o.t) ozet += ' ' + esikCumle(o);
    bloklar.push(`<div class="kozet">${ozet}</div>`);
    if (g.length > 1) bloklar.push(`<h2>Denemelerde başarı (%)</h2>${cizgiGrafik({ etiketler: g.map(e => kisaTarih(e.tarih)), yuzdeMi: true, yuks: 170, seriler: [
      { ad: 'Öğrenci', renk: '#2759c4', kalin: true, degerler: g.map(e => e.basari) },
      { ad: 'Sınıf ort.', renk: '#888', kesik: true, degerler: g.map(e => e.sinifBasari) }] })}`);

    // ders tablosu
    if (g.length) {
      const ders = new Map();
      g.forEach(e => e.dersler.forEach(d => { const x = ders.get(d.id) || { ad: d.ad, b: [], s: [] }; if (d.basari != null) { x.b.push(d.basari); x.s.push(d.sinifBasari); } ders.set(d.id, x); }));
      const ort = (v) => { const w = v.filter(n => n != null); return w.length ? w.reduce((p, q) => p + q, 0) / w.length : null; };
      bloklar.push(`<h2>Dersler</h2><table class="ktablo"><thead><tr><th class="sol" style="width:34%">Ders</th><th>Deneme</th><th>Başarı ort.</th><th>Sınıf ort.</th><th>Son deneme</th><th>Sınıf (son)</th></tr></thead><tbody>${[...ders.values()].filter(d => d.b.length).map(d =>
        `<tr><td class="sol">${h(d.ad)}</td><td>${d.b.length}</td><td><b>${yuzde(ort(d.b))}</b>${ok(ort(d.b) != null && ort(d.s) != null ? ort(d.b) - ort(d.s) : null, 0.03)}</td><td>${yuzde(ort(d.s))}</td><td>${yuzde(d.b[d.b.length - 1])}</td><td>${yuzde(d.s[d.s.length - 1])}</td></tr>`).join('')}</tbody></table>`);
    }
    // zorluk dilimleri
    if (o && o.t) {
      const ds = o.dilim.map((x, i) => ({ x, i })).filter(e => e.x.t);
      bloklar.push(`<h2>Soru zorluğuna göre</h2><table class="ktablo"><thead><tr><th class="sol" style="width:24%"></th>${ds.map(e => `<th>${DILIM_AD[e.i]}<div class="soluk">${DILIM_ARALIK[e.i]}</div></th>`).join('')}</tr></thead><tbody>
        <tr><td class="sol">Öğrenci</td>${ds.map(e => `<td><b class="${renkSinif(e.x.d / e.x.t)}">${yuzde(e.x.d / e.x.t)}</b></td>`).join('')}</tr>
        <tr><td class="sol">Ortalama öğrenci</td>${ds.map(e => `<td>${yuzde(e.x.pt / e.x.t)}</td>`).join('')}</tr>
        <tr><td class="sol soluk">Soru sayısı</td>${ds.map(e => `<td class="soluk">${e.x.t}</td>`).join('')}</tr></tbody></table><p class="kucuk">Dilim: sorunun sınava girenlerce çözülme oranı. Ortalama öğrenci: aynı soruların çözülme oranı.</p>`);
    }
    // kazanımlar
    const kdersler = [];
    hs.forEach(x => x.sinav.dersler.forEach(d => { if (Array.isArray(d.kazanim) && d.kazanim.some(k => k && k.length) && !kdersler.some(e => e.id === d.id)) kdersler.push({ id: d.id, ad: d.ad }); }));
    const ogeler = [];
    kdersler.forEach(d => {
      const G = kazanimGruplari(hs.flatMap(x => x.sinav.dersler.filter(e => e.id === d.id).flatMap(e => (e.kazanim || []).flat())));
      const k = M.kazanimGecmisi(hs, no, d.id, G.grupla);
      k.kazanimlar.forEach(e => ogeler.push({ e, ders: d.ad, ad: G.etiket(e.kimlik), mebi: G.mebi(e.kimlik), sinavlar: k.sinavlar, hukum: M.kazanimHukmu(e) }));
    });
    if (ogeler.length) {
      const say = (hk) => ogeler.filter(e => e.hukum === hk).length;
      const H = M.KAZANIM_HUKUM;
      const kutu = (sinif, bas, alt, n) => `<div class="kutu ${sinif}"><div class="kutu-bas">${bas} <span class="kutu-sayi">${n}</span></div><div class="kutu-alt">${alt}</div></div>`;
      bloklar.push(`<h2>Kazanımlar</h2><div class="kutular dort">${kutu('k-guclu', 'Sağlam', `en az ${H.enAzSoru} soru, %${H.saglam * 100} ve üstü`, say('saglam'))}${kutu('k-hedef', 'Gelişiyor', `en az ${H.enAzSoru} soru, %${H.tekrar * 100}–${H.saglam * 100 - 1}`, say('orta'))}${kutu('k-once', 'Tekrar et', `en az ${H.enAzSoru} soru, %${H.tekrar * 100}’nin altı`, say('tekrar'))}${kutu('k-az', 'Henüz az veri', `${H.enAzSoru - 1} ya da daha az soru; hüküm yok`, say('az'))}</div>
        <p class="kucuk">Aynı öğrenme çıktısı kodundaki kazanımlar birlikte sayılır; yalnız A kitapçığıyla girilen denemeler.</p>`);
      const satir = (x) => `<tr><td class="sol">${h(x.ders)}</td><td class="sol kazanim-ad">${mebiA(x.mebi)}${h(x.ad)}</td><td class="sol isaretler">${x.sinavlar.filter(sv => x.e.sinav[sv.id]).map(sv => x.e.sinav[sv.id].map(q => `<span class="i-${q.sonuc}">${ISARET[q.sonuc]}</span>`).join('')).join(' ')}</td><td>${x.e.d}/${x.e.t}</td><td>${yuzde(x.e.grupBasari)}</td></tr>`;
      const thead = '<tr><th class="sol" style="width:20%">Ders</th><th class="sol" style="width:40%">Kazanım</th><th class="sol">Denemeler</th><th style="width:8%">Doğru</th><th style="width:14%">Sınava girenler</th></tr>';
      const tekrar = ogeler.filter(x => x.hukum === 'tekrar').sort((p, q) => p.e.basari - q.e.basari || q.e.grupBasari - p.e.grupBasari);
      if (tekrar.length) bloklar.push(...tabloParcala('<h2>Tekrar edilecek kazanımlar</h2>', thead, tekrar.map(satir), 'ktablo kaz'));
      const orta = ogeler.filter(x => x.hukum === 'orta').sort((p, q) => p.e.basari - q.e.basari || q.e.t - p.e.t);
      if (orta.length) bloklar.push(...tabloParcala(`<h2>Gelişen kazanımlar${orta.length > 15 ? ' <span class="kucuk">(en düşük 15)</span>' : ''}</h2>`, thead, orta.slice(0, 15).map(satir), 'ktablo kaz'));
      const saglam = ogeler.filter(x => x.hukum === 'saglam').sort((p, q) => q.e.t - p.e.t || q.e.basari - p.e.basari);
      if (saglam.length) bloklar.push(...tabloParcala(`<h2>Sağlam kazanımlar${saglam.length > 15 ? ' <span class="kucuk">(en çok soruyla ölçülen 15)</span>' : ''}</h2>`, thead, saglam.slice(0, 15).map(satir), 'ktablo kaz'));
      if (tekrar.length || orta.length || saglam.length) bloklar.push(`<p class="kucuk">Denemeler sütunu: her denemedeki soruların sonucu, soldan sağa tarih sırasıyla (✓ doğru · ✗ yanlış · ○ boş).${bloklar.some(b => b.includes('class="mebi')) ? ' ' + mebiNot(bloklar) : ''}</p>`);
    }
    const aralik = g.length > 1 ? `${tarihYaz(ilk.tarih)} – ${tarihYaz(son.tarih)} · ${g.length} deneme` : g.length ? `${tarihYaz(ilk.tarih)} · 1 deneme` : tarihYaz(s.tarih);
    return belgeAkisi(karneBasi(no, sinif, 'Birikimli karne', `${s.seviye ? s.seviye + '. sınıf · ' : ''}${aralik}`), bloklar, 'Deneme Takip · birikimli karne');
  }

  function ogretmenDeneme(s, x, d) {
    const bloklar = [];
    const grup = x.satirlar.filter(r => r.dersler[d.id]);
    const ort = x.genel.dersler[d.id];
    const sa = M.soruAnalizi(x, d.id);
    const subeler = Object.entries(x.siniflar).filter(([, v]) => v.dersler[d.id]);
    let ozet = `<b>${grup.length} öğrenci</b> · ortalama ${sayi(ort ? ort.net : null)} net (${yuzde(ort ? ort.basari : null)}).`;
    if (subeler.length > 1) ozet += ' Şubeler: ' + subeler.map(([k, v]) => `${h(k)} ${sayi(v.dersler[d.id].net)}`).join(' · ') + '.';
    if (sa && sa.disarida) ozet += ` B kitapçığıyla giren ${sa.disarida} öğrenci soru analizine girmedi.`;
    bloklar.push(`<div class="kozet">${ozet}</div>`);
    // sorular
    if (sa && sa.kisi) {
      let suphe = 0;
      const satirlar = sa.sorular.map(q => {
        if (q.guclukP == null) return `<tr><td>${q.no}</td><td>${h(q.anahtar || '–')}</td><td colspan="3" class="sol soluk">iptal</td><td class="sol kazanim-ad"></td></tr>`;
        const yn = q.celdirici ? q.dagilim[q.celdirici] : 0;
        const s2 = anahtarSuphe({ kisi: q.kisi, yanlisN: yn });
        if (s2) suphe++;
        return `<tr><td>${q.no}</td><td>${h(q.anahtar)}</td><td><b class="${renkSinif(q.guclukP)}">${yuzde(q.guclukP)}</b></td><td>${yuzde(q.bos / q.kisi)}</td><td>${q.celdirici ? `${q.celdirici} <span class="soluk">${yuzde(yn / q.kisi)}</span>${s2 ? ' <b class="zayif">⚠</b>' : ''}` : '–'}</td><td class="sol kazanim-ad">${q.kazanim.length ? h(kisaKazanim(kazanimAd(q.kazanim[0]))) : ''}</td></tr>`;
      });
      bloklar.push(...tabloParcala(`<h2>Sorular</h2><p class="kucuk">${sa.kisi} kâğıt (A kitapçığı). Çözen: doğru cevap oranı. En çok seçilen yanlış: o şık ve onu seçenlerin oranı.</p>`,
        '<tr><th style="width:6%">No</th><th style="width:9%">Anahtar</th><th style="width:10%">Çözen</th><th style="width:8%">Boş</th><th style="width:15%">En çok seçilen yanlış</th><th class="sol">Kazanım</th></tr>', satirlar, 'ktablo kaz'));
      if (suphe) bloklar.push('<p class="kucuk"><b class="zayif">⚠</b> Sınava girenlerin yarısı ya da fazlası aynı yanlış şıkkı işaretlemiş: cevap anahtarı hatası olabilir, kitapçıktan kontrol edin.</p>');
    } else if (sa) bloklar.push('<h2>Sorular</h2><p class="kucuk">Soru analizi için A kitapçığıyla girilmiş cevap kâğıdı yok.</p>');
    // sınıfça zayıf kazanımlar
    if (Array.isArray(d.kazanim) && d.kazanim.some(k => k && k.length)) {
      const G = kazanimGruplari(d.kazanim.flat());
      const k = M.kazanimAnalizi(x, d.id, G.grupla);
      const zayif = k ? k.kazanimlar.filter(e => e.basari != null && e.basari < ESIK.zayif).sort((p, q) => p.basari - q.basari) : [];
      bloklar.push(...(zayif.length ? tabloParcala('<h2>Sınıfça zayıf kazanımlar</h2>', '<tr><th class="sol" style="width:70%">Kazanım</th><th>Sorular</th><th>Başarı</th></tr>',
        zayif.map(e => `<tr><td class="sol kazanim-ad">${h(G.etiket(e.kimlik))}</td><td>${araliklar(e.sorular)}</td><td><b class="zayif">${yuzde(e.basari)}</b></td></tr>`), 'ktablo kaz')
        : ['<h2>Sınıfça zayıf kazanımlar</h2><p class="kucuk">%50’nin altında kazanım yok.</p>']));
    }
    // dikkat edilecek öğrenciler
    const dl = M.dikkatListesi(x, oncekiSinavlar(s).map(hesap), d.id)
      .filter(r => (r.kolayKacan || 0) >= 3 || (r.degisim != null && Math.round(r.degisim * 100) <= -15))
      .sort((p, q) => (q.kolayKacan || 0) - (p.kolayKacan || 0) || (p.degisim ?? 0) - (q.degisim ?? 0));
    const kolayOlcuk = sa && sa.kisi >= M.KUTU.enAz;
    bloklar.push(...(dl.length ? tabloParcala(`<h2>Dikkat edilecek öğrenciler</h2><p class="kucuk">${kolayOlcuk ? 'Çoğunluğun çözdüğü (%60 ve üstü) en az 3 soruyu kaçıranlar ya da önceki' : `Önceki`} denemeye göre başarısı 15 puan ya da daha çok düşenler.${kolayOlcuk ? '' : ` Sınava girenler ${M.KUTU.enAz} kişiden az olduğu için kolay soru ölçülmedi.`}</p>`,
      '<tr><th class="sol" style="width:28%">Öğrenci</th><th>Şube</th><th>Net</th><th style="width:20%">Kaçırdığı kolay soru</th><th style="width:22%">Önceki denemeye göre</th></tr>',
      dl.map(r => `<tr><td class="sol">${h(ogrEtiket(r.no))}</td><td>${h(r.sinif)}</td><td>${sayi(r.net)}</td><td>${r.kolayKacan ?? '–'}</td><td>${r.degisim == null ? '–' : farkPuan(r.degisim) + ' puan'}</td></tr>`))
      : [`<h2>Dikkat edilecek öğrenciler</h2><p class="kucuk">Yok: ${kolayOlcuk ? 'kimse çoğunluğun çözdüğü 3 soruyu kaçırmadı, ' : ''}kimsenin başarısı önceki denemeye göre 15 puan ya da daha çok düşmedi.${kolayOlcuk ? '' : ` Sınava girenler ${M.KUTU.enAz} kişiden az olduğu için kolay soru ölçülmedi.`}</p>`]));
    // öğrenci netleri
    const sira = M.sirala(grup, r => r.dersler[d.id].net);
    const liste = grup.slice().sort((p, q) => sira.get(p) - sira.get(q) || String(p.no).localeCompare(String(q.no), 'tr', { numeric: true }));
    bloklar.push(...tabloParcala('<h2>Öğrenci netleri</h2>', '<tr><th style="width:8%">Sıra</th><th class="sol" style="width:38%">Öğrenci</th><th>Şube</th><th>Doğru</th><th>Yanlış</th><th>Boş</th><th>Net</th></tr>',
      liste.map(r => { const p = r.dersler[d.id]; return `<tr><td>${sira.get(r)}</td><td class="sol">${h(ogrEtiket(r.no))}</td><td>${h(r.sinif)}</td><td>${p.d}</td><td>${p.y}</td><td>${p.b}</td><td><b>${sayi(p.net)}</b></td></tr>`; }), 'ktablo'));
    return belgeAkisi(`<div><div class="kad">${h(d.ad)}</div><div class="kucuk">Öğretmen raporu</div></div><div class="sag"><div class="ktur">Deneme</div><div class="kucuk">${h(s.ad)} · ${tarihYaz(s.tarih)}</div></div>`, bloklar, 'Deneme Takip · öğretmen raporu');
  }

  function ogretmenBirikimli(s, d) {
    const hs = birikimliSinavlar(s).filter(z => z.dersler.some(e => e.id === d.id)).map(hesap)
      .sort((p, q) => String(p.sinav.tarih).localeCompare(String(q.sinav.tarih)));
    const bloklar = [];
    const bas = (x) => x.genel.dersler[d.id] ? x.genel.dersler[d.id].basari : null;
    const ilk = hs[0], son = hs[hs.length - 1];
    bloklar.push(`<div class="kozet">${hs.length < 2 ? 'Bu düzeyde bu dersin tek denemesi var; birikimli rapor denemeler arttıkça anlam kazanır.'
      : `<b>${hs.length} deneme.</b> Ders başarısı ilk denemede ${yuzde(bas(ilk))}, son denemede ${yuzde(bas(son))}. Denemelerin zorluğu farklı olduğundan değişimi şubeler arası farkla birlikte okuyun.`}</div>`);
    if (hs.length > 1) {
      const subeler = [...new Set(hs.flatMap(x => Object.keys(x.siniflar).filter(k => x.siniflar[k].dersler[d.id])))].sort((p, q) => p.localeCompare(q, 'tr', { numeric: true }));
      const renk = ['#c0392b', '#1f8a4c', '#b7791f', '#7d3cbd', '#138496'];
      bloklar.push(`<h2>Denemelerde ders başarısı (%)</h2>${cizgiGrafik({ etiketler: hs.map(x => kisaTarih(x.sinav.tarih)), yuzdeMi: true, yuks: 170, seriler: [
        { ad: 'Genel', renk: '#2759c4', kalin: true, degerler: hs.map(bas) },
        ...(subeler.length > 1 ? subeler.slice(0, 5).map((k, i) => ({ ad: k, renk: renk[i], degerler: hs.map(x => x.siniflar[k] && x.siniflar[k].dersler[d.id] ? x.siniflar[k].dersler[d.id].basari : null) })) : [])] })}`);
    }
    // kazanım haritası
    const ids = hs.flatMap(x => x.sinav.dersler.filter(e => e.id === d.id).flatMap(e => (e.kazanim || []).flat()));
    if (ids.length) {
      const G = kazanimGruplari(ids);
      const k = M.sinifKazanimGecmisi(hs, d.id, G.grupla).sort((p, q) => p.basari - q.basari);
      const sinir = 60;
      bloklar.push(...tabloParcala(`<h2>Kazanımlar, zayıftan güçlüye</h2><p class="kucuk">${k.length} kazanım (aynı öğrenme çıktısı kodu birlikte)${k.length > sinir ? `; en zayıf ${sinir} tanesi` : ''}. Başarı: bu kazanımın bütün sorularında doğru oranı (A kitapçığı). ${M.KAZANIM_HUKUM.enAzSoru} sorudan az sorulanların başarısı soluk: tek soruya bakarak hüküm verilmez.</p>`,
        '<tr><th class="sol" style="width:66%">Kazanım</th><th>Soru</th><th>Deneme</th><th>Başarı</th></tr>',
        k.slice(0, sinir).map(e => `<tr><td class="sol kazanim-ad">${h(G.etiket(e.kimlik))}</td><td>${e.soru}</td><td>${e.sinavSay}</td><td>${e.soru < M.KAZANIM_HUKUM.enAzSoru ? `<span class="soluk">${yuzde(e.basari)}</span>` : `<b class="${renkSinif(e.basari)}">${yuzde(e.basari)}</b>`}</td></tr>`), 'ktablo kaz'));
    }
    // öğrenciler
    const z = M.zorlukProfili(hs, d.id);
    const esik = new Map(z.ogrenci.map(o => [String(o.no), o]));
    const ogr = new Map();
    hs.forEach(x => x.satirlar.forEach(r => { const p = r.dersler[d.id]; if (!p || p.basari == null) return; const e = ogr.get(String(r.no)) || { no: r.no, sinif: r.sinif, b: [] }; e.b.push(p.basari); e.sinif = r.sinif; ogr.set(String(r.no), e); }));
    const liste = [...ogr.values()].sort((p, q) => String(p.no).localeCompare(String(q.no), 'tr', { numeric: true }));
    if (liste.length) bloklar.push(...tabloParcala('<h2>Öğrenciler</h2><p class="kucuk">Ortalama: girdiği denemelerde bu dersteki başarısı. Değişim: son deneme − ilk deneme. Eşik: başarısının %50’nin altına indiği soru zorluğu (çözülme oranı).</p>',
      '<tr><th class="sol" style="width:34%">Öğrenci</th><th>Şube</th><th>Deneme</th><th>Ortalama</th><th>Son</th><th>Değişim</th><th>Eşik</th></tr>',
      liste.map(e => { const ort = e.b.reduce((p, q) => p + q, 0) / e.b.length, df = e.b.length > 1 ? e.b[e.b.length - 1] - e.b[0] : null, o = esik.get(String(e.no));
        return `<tr><td class="sol">${h(ogrEtiket(e.no))}</td><td>${h(e.sinif)}</td><td>${e.b.length}</td><td><b class="${renkSinif(ort)}">${yuzde(ort)}</b></td><td>${yuzde(e.b[e.b.length - 1])}</td><td>${df == null ? '–' : farkPuan(df)}</td><td style="white-space:nowrap">${o && o.t ? esikKisa(o) : '–'}</td></tr>`; }), 'ktablo'));
    return belgeAkisi(`<div><div class="kad">${h(d.ad)}</div><div class="kucuk">Öğretmen raporu</div></div><div class="sag"><div class="ktur">Birikimli</div><div class="kucuk">${s.seviye ? s.seviye + '. sınıf · ' : ''}${hs.length} deneme · ${tarihYaz(s.tarih)} tarihine kadar</div></div>`, bloklar, 'Deneme Takip · öğretmen raporu');
  }

  function gorKarne(sinavId, kim, sorgu) {
    const s = sinavBul(sinavId);
    if (!s) return '<p>Sınav bulunamadı.</p>';
    const x = hesap(s);
    const sinif = x.siniflar[sorgu.sinif] ? sorgu.sinif : '';
    const tur = ['birikimli', 'ogretmen'].includes(sorgu.tur) ? sorgu.tur : 'deneme';
    const hepsi = kim === 'hepsi';
    const satirlar = hepsi ? x.satirlar.filter(r => !sinif || r.sinif === sinif).slice().sort((a, b) => String(a.no).localeCompare(String(b.no), 'tr', { numeric: true })) : x.satirlar.filter(r => String(r.no) === String(kim));
    const dersler = s.dersler.filter(d => x.satirlar.some(r => r.dersler[d.id]));
    const dersId = dersler.some(d => d.id === sorgu.ders) ? sorgu.ders : (dersler[0] || {}).id;
    const okapsam = sorgu.okapsam === 'birikimli' ? 'birikimli' : 'deneme';
    const a = ayar();
    const bag = (t) => `#/karne/${encodeURIComponent(s.id)}/${t === 'ogretmen' ? 'hepsi' : encodeURIComponent(kim)}?tur=${t}${sinif ? '&sinif=' + encodeURIComponent(sinif) : ''}`;
    const sekme = (t, ad) => `<a href="${bag(t)}" class="sekme ${tur === t ? 'secili' : ''}">${ad}</a>`;
    let html = `<div class="yazdirma-yok" style="margin-bottom:12px"><div class="satir ayrik"><div><div class="alt"><a href="#/sinav/${encodeURIComponent(s.id)}">${h(s.ad)}</a> ›</div><h1>${tur === 'ogretmen' ? 'Öğretmen raporu' : `Karne${hepsi ? 'ler' : ''}`}</h1></div>
      <div class="satir">${hepsi ? `<button data-is="karne-zip" title="Her öğrenciye deneme ve birikimli karne, her derse öğretmen raporu; ayrı PDF'ler tek ZIP'te">Hepsini indir (ZIP)</button>` : ''}<button data-is="karne-pdf">PDF indir</button><button class="ana" data-is="yazdir">Yazdır</button></div></div>
      <div class="sekmeler">${sekme('deneme', 'Deneme karnesi')}${sekme('birikimli', 'Birikimli karne')}${sekme('ogretmen', 'Öğretmen raporu')}</div>
      <div class="satir" style="margin-top:8px">${hepsi && tur !== 'ogretmen' ? sinifSecici(x, sinif) : ''}${tur === 'ogretmen'
        ? `<select data-is="karne-ders">${dersler.map(d => `<option value="${h(d.id)}" ${d.id === dersId ? 'selected' : ''}>${h(d.ad)}</option>`).join('')}</select>
           <select data-is="karne-kapsam"><option value="">Bu deneme</option><option value="birikimli" ${okapsam === 'birikimli' ? 'selected' : ''}>Birikimli</option></select>`
        : `<label class="alt"><input type="checkbox" data-ayar="karneSira" ${a.karneSira ? 'checked' : ''}> Sıra</label>
           ${tur === 'deneme' ? `<label class="alt"><input type="checkbox" data-ayar="karnePuan" ${a.karnePuan ? 'checked' : ''}> Puan</label>
           <label class="alt"><input type="checkbox" data-ayar="karneKazanim" ${a.karneKazanim ? 'checked' : ''}> Kazanımlar</label>
           <label class="alt"><input type="checkbox" data-ayar="karneSoruDokumu" ${a.karneSoruDokumu ? 'checked' : ''}> Soru dökümü</label>` : ''}
           <label class="alt" title="Kazanımın yanına MEBİ konu sayfası bağlantısı (yalnız kodu ve metni doğrulananlara)"><input type="checkbox" data-ayar="karneMebi" ${a.karneMebi ? 'checked' : ''}> MEBİ bağlantıları</label>`}
        <span class="alt" id="karne-durum"></span></div></div>`;
    if (tur === 'ogretmen') {
      const d = dersler.find(e => e.id === dersId);
      if (!d) return html + '<p>Bu sınavda ders yok.</p>';
      return html + `<div class="a4-kap">${okapsam === 'birikimli' ? ogretmenBirikimli(s, d) : ogretmenDeneme(s, x, d)}</div>`;
    }
    if (!satirlar.length) return html + `<p>${hepsi ? 'Bu sınavda öğrenci yok.' : 'Bu öğrenci bu sınava girmemiş.'}</p>`;
    if (satirlar.some(r => !ogrAd(r.no))) html += `<div class="bilgi uyari yazdirma-yok">Bazı öğrencilerin adı yok; karnede okul numarası yazar. Adlar öğrenci sayfasından ya da adlı aktarımla eklenir.</div>`;
    html += `<div class="a4-kap">${satirlar.map(r => tur === 'birikimli' ? birikimliKarne(s, r.no, r.sinif) : denemeKarnesi(s, x, r)).join('')}</div>`;
    return html;
  }

  /* PDF ve ZIP: belgeler ekran dışında sayfalanır, her sayfa resme çevrilir. */
  async function belgeleriPdf(isler, ilerleme) {
    const kap = document.createElement('div');
    kap.className = 'uretim';
    document.body.appendChild(kap);
    try {
      const cikti = [];
      for (let i = 0; i < isler.length; i++) {
